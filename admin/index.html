<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>MAUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F5F1EB] text-[#29292B]">
  <div id="app"></div>

  <script>
    const state = { site: null, products: [], cart: [], filter: 'Todos', couponInput: '', cep: '', selectedBanner: 0 };
    const formatBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const api = {
      async load() {
        const [siteRes, prodRes] = await Promise.all([
          fetch('./data/site.json'),
          fetch('./data/produtos.json')
        ]);
        if (!siteRes.ok || !prodRes.ok) throw new Error('Dados não encontrados');
        state.site = await siteRes.json();
        state.products = await prodRes.json();
      }
    };

    const allCategories = () => ['Todos', ...new Set(state.products.map(p => p.categoria))];
    const currentCoupon = () => (state.site?.cupons || []).find(c => c.codigo.toUpperCase() === (state.couponInput || '').trim().toUpperCase() && c.ativo);

    const cartItems = () => state.cart.map(item => ({ ...item, subtotal: item.preco * item.qty }));
    const subtotal = () => cartItems().reduce((sum, item) => sum + item.subtotal, 0);
    const shipping = () => {
      const total = subtotal();
      if (!state.cep) return 0;
      const regras = state.site?.frete?.regras || [];
      if (state.site?.frete?.gratisAcima && total >= state.site.frete.gratisAcima) return 0;
      const cepDigits = state.cep.replace(/\D/g, '');
      for (const regra of regras) {
        for (const faixa of regra.cep || []) {
          const [inicio, fim] = faixa.split(' a ');
          if (inicio && fim) {
            const i = Number(inicio.replace(/\D/g, ''));
            const f = Number(fim.replace(/\D/g, ''));
            if (cepDigits >= i && cepDigits <= f) return Number(regra.valor || 0);
          }
        }
      }
      return 0;
    };

    const discount = () => {
      const coupon = currentCoupon();
      if (!coupon) return 0;
      if (coupon.tipo === 'percentual') return subtotal() * (coupon.valor / 100);
      return Math.min(coupon.valor, subtotal());
    };

    const total = () => Math.max(0, subtotal() + shipping() - discount());

    function addToCart(product) {
      const existing = state.cart.find(i => i.id === product.id);
      if (existing) existing.qty += 1;
      else state.cart.push({ ...product, qty: 1, selectedSize: product.tamanhos?.[0] || 'Único' });
      render();
    }

    function changeQty(id, delta) {
      const item = state.cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) state.cart = state.cart.filter(i => i.id !== id);
      render();
    }

    function checkout() {
      if (!state.cart.length) return alert('Carrinho vazio.');
      const message = [
        'Olá! Quero fechar o pedido:',
        ...state.cart.map(item => `- ${item.nome} (${item.selectedSize}) x${item.qty} - ${formatBRL(item.preco * item.qty)}`),
        `Subtotal: ${formatBRL(subtotal())}`,
        `Frete: ${formatBRL(shipping())}`,
        `Desconto: -${formatBRL(discount())}`,
        `Total: ${formatBRL(total())}`,
        `CEP: ${state.cep || 'não informado'}`,
        'Obrigado!'
      ].join('\n');
      const url = `https://wa.me/${state.site.whatsapp}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function renderBanner() {
      const banner = state.site.banners[state.selectedBanner];
      if (!banner) return '';
      return `
        <section class="relative h-[420px] overflow-hidden">
          <img src="${banner.imagem}" class="absolute inset-0 w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-r from-black/60 to-black/20"></div>
          <div class="relative z-10 flex h-full items-center px-6 md:px-16">
            <div class="max-w-xl text-white">
              <p class="text-xs uppercase tracking-[0.35em] mb-4 text-[#C5A99A]">MAUY</p>
              <h1 class="text-4xl md:text-6xl font-semibold leading-tight">${banner.titulo}</h1>
              <p class="mt-4 text-lg md:text-xl text-white/90">${banner.texto}</p>
              <button class="mt-6 rounded-full bg-[#59283B] px-6 py-3 text-sm font-medium text-[#F5F1EB]">${banner.cta}</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderProducts() {
      const categories = allCategories();
      const visible = state.products.filter(product => state.filter === 'Todos' || product.categoria === state.filter);
      return `
        <section class="max-w-7xl mx-auto px-4 py-10 md:px-8">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-[#C5A99A]">Coleção</p>
              <h2 class="text-3xl font-semibold text-[#59283B]">Produtos</h2>
            </div>
            <div class="flex gap-2 overflow-x-auto hide-scrollbar">
              ${categories.map(cat => `
                <button data-filter="${cat}" class="rounded-full border px-4 py-2 text-sm ${state.filter === cat ? 'bg-[#59283B] text-white border-[#59283B]' : 'border-[#59283B] text-[#59283B]'}">
                  ${cat}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
            ${visible.map(product => `
              <article class="overflow-hidden rounded-3xl bg-white shadow-sm border border-black/5">
                <img src="${product.imagem}" class="h-72 w-full object-cover" />
                <div class="p-5">
                  <div class="flex items-start justify-between gap-3">
                    <div>
                      <p class="text-xs uppercase tracking-[0.18em] text-[#C5A99A]">${product.categoria}</p>
                      <h3 class="mt-2 text-xl font-semibold text-[#29292B]">${product.nome}</h3>
                    </div>
                    <span class="text-lg font-semibold text-[#59283B]">${formatBRL(product.preco)}</span>
                  </div>
                  <p class="mt-3 text-sm text-black/60">Estoque: ${product.estoque}</p>
                  <div class="mt-5 flex items-center justify-between">
                    <select data-size="${product.id}" class="rounded-full border border-[#C5A99A] bg-[#F5F1EB] px-3 py-2 text-sm">
                      ${(product.tamanhos || ['Único']).map(size => `<option value="${size}">${size}</option>`).join('')}
                    </select>
                    <button data-add="${product.id}" class="rounded-full bg-[#59283B] px-5 py-2.5 text-sm font-medium text-white">Adicionar</button>
                  </div>
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderCart() {
      const items = cartItems();
      const coupon = currentCoupon();
      return `
        <aside class="lg:w-[420px] bg-white border-l border-black/10 p-5 lg:sticky lg:top-0 lg:h-screen lg:overflow-y-auto">
          <div class="flex items-center justify-between">
            <h2 class="text-2xl font-semibold text-[#59283B]">Carrinho</h2>
            <span class="rounded-full bg-[#F5F1EB] px-3 py-1 text-xs font-medium text-[#59283B]">${items.length} itens</span>
          </div>

          <div class="mt-5 space-y-3">
            ${items.length ? items.map(item => `
              <div class="rounded-2xl border border-black/5 p-3">
                <div class="flex gap-3">
                  <img src="${item.imagem}" class="h-16 w-16 rounded-xl object-cover" />
                  <div class="flex-1">
                    <div class="flex items-center justify-between gap-3">
                      <p class="font-medium">${item.nome}</p>
                      <button data-remove="${item.id}" class="text-xs text-red-600">remover</button>
                    </div>
                    <p class="text-xs text-black/60">Tamanho: ${item.selectedSize}</p>
                    <div class="mt-2 flex items-center justify-between">
                      <div class="flex items-center gap-2 rounded-full border border-[#C5A99A] px-2 py-1">
                        <button data-qty="${item.id},-1" class="text-lg leading-none">−</button>
                        <span class="text-sm min-w-6 text-center">${item.qty}</span>
                        <button data-qty="${item.id},1" class="text-lg leading-none">+</button>
                      </div>
                      <strong>${formatBRL(item.subtotal)}</strong>
                    </div>
                  </div>
                </div>
              </div>
            `).join('') : '<p class="text-sm text-black/60">Seu carrinho está vazio.</p>'}
          </div>

          <div class="mt-6 rounded-2xl bg-[#F5F1EB] p-4">
            <label class="text-xs uppercase tracking-[0.2em] text-[#C5A99A]">CEP</label>
            <input id="cepInput" value="${state.cep || ''}" placeholder="Digite seu CEP" class="mt-2 w-full rounded-xl border border-[#C5A99A] bg-white px-3 py-2 outline-none" />
            <button id="calcShipping" class="mt-3 w-full rounded-full bg-[#59283B] px-4 py-2 text-sm text-white">Calcular frete</button>
          </div>

          <div class="mt-6 space-y-3 rounded-2xl border border-black/5 p-4">
            <div class="flex gap-2">
              <input id="couponInput" value="${state.couponInput}" placeholder="Cupom" class="flex-1 rounded-full border border-[#C5A99A] px-3 py-2 text-sm" />
              <button id="applyCoupon" class="rounded-full bg-[#59283B] px-4 py-2 text-sm text-white">Aplicar</button>
            </div>
            ${coupon ? `<p class="text-xs text-green-700">Cupom ${coupon.codigo} aplicado.</p>` : '<p class="text-xs text-black/50">Use MAUY10 ou FRETE20.</p>'}
            <div class="space-y-2 text-sm">
              <div class="flex justify-between"><span>Subtotal</span><strong>${formatBRL(subtotal())}</strong></div>
              <div class="flex justify-between"><span>Frete</span><strong>${formatBRL(shipping())}</strong></div>
              <div class="flex justify-between"><span>Desconto</span><strong>-${formatBRL(discount())}</strong></div>
              <div class="flex justify-between text-base font-semibold text-[#59283B]"><span>Total</span><strong>${formatBRL(total())}</strong></div>
            </div>
            <button id="checkoutBtn" class="w-full rounded-full bg-[#59283B] px-4 py-3 text-sm font-medium text-white">Finalizar pedido no WhatsApp</button>
          </div>
        </aside>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      root.innerHTML = `
        <div class="min-h-screen bg-[#F5F1EB]">
          <header class="sticky top-0 z-30 border-b border-black/5 bg-[#F5F1EB]/90 backdrop-blur">
            <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 md:px-8">
              <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-[#59283B] text-sm font-bold text-white">M</div>
                <div>
                  <div class="text-xl font-bold tracking-[0.2em] text-[#59283B]">MAUY</div>
                  <div class="text-[10px] uppercase tracking-[0.25em] text-[#C5A99A]">fitness</div>
                </div>
              </div>
              <nav class="hidden items-center gap-6 text-sm md:flex">
                <a href="#colecao" class="text-[#29292B]">Coleção</a>
                <a href="#frete" class="text-[#29292B]">Frete</a>
                <a href="/admin/" class="text-[#59283B] underline">Painel</a>
              </nav>
              <a href="https://wa.me/${state.site?.whatsapp || '5547992708359'}" target="_blank" class="rounded-full border border-[#59283B] px-4 py-2 text-sm font-medium text-[#59283B]">WhatsApp</a>
            </div>
          </header>

          ${renderBanner()}

          <section id="colecao" class="max-w-7xl mx-auto px-4 py-10 md:px-8">
            <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_420px]">
              <div>
                ${renderProducts()}
              </div>
              ${renderCart()}
            </div>
          </section>

          <section id="frete" class="max-w-7xl mx-auto px-4 pb-16 md:px-8">
            <div class="rounded-3xl bg-white p-6 shadow-sm border border-black/5">
              <h3 class="text-2xl font-semibold text-[#59283B]">Frete e retirada</h3>
              <div class="mt-4 grid gap-4 md:grid-cols-2">
                <div>
                  <p class="text-sm text-black/60">Frete grátis acima de ${formatBRL(state.site?.frete?.gratisAcima || 0)}.</p>
                  <ul class="mt-3 space-y-2 text-sm">
                    ${(state.site?.frete?.regras || []).map(rule => `
                      <li><strong>${rule.nome}</strong>: ${rule.prazo} • ${formatBRL(rule.valor)}</li>
                    `).join('')}
                  </ul>
                </div>
                ${state.site?.frete?.retirada?.ativo ? `<div class="rounded-2xl bg-[#F5F1EB] p-4 text-sm"><strong>Retirada:</strong> ${state.site.frete.retirada.texto}</div>` : ''}
              </div>
            </div>
          </section>
        </div>
      `;

      document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
        state.filter = btn.dataset.filter;
        render();
      }));

      document.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => {
        const product = state.products.find(p => p.id === btn.dataset.add);
        if (product) addToCart(product);
      }));

      document.querySelectorAll('[data-size]').forEach(select => {
        select.addEventListener('change', (e) => {
          const cartItem = state.cart.find(i => i.id === select.dataset.size);
          if (cartItem) cartItem.selectedSize = e.target.value;
        });
      });

      document.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
        state.cart = state.cart.filter(item => item.id !== btn.dataset.remove);
        render();
      }));

      document.querySelectorAll('[data-qty]').forEach(btn => btn.addEventListener('click', () => {
        const [id, delta] = btn.dataset.qty.split(',');
        changeQty(id, Number(delta));
      }));

      const cepInput = document.getElementById('cepInput');
      const couponInput = document.getElementById('couponInput');
      if (cepInput) {
        cepInput.addEventListener('input', (e) => {
          state.cep = e.target.value;
        });
      }
      document.getElementById('calcShipping')?.addEventListener('click', () => {
        render();
      });
      document.getElementById('applyCoupon')?.addEventListener('click', () => {
        state.couponInput = couponInput.value.trim();
        render();
      });
      document.getElementById('checkoutBtn')?.addEventListener('click', checkout);
      document.querySelectorAll('.banner-dot')?.forEach(...);
    }

    async function init() {
      try {
        await api.load();
        render();
      } catch (error) {
        document.getElementById('app').innerHTML = '<div class="p-10 text-center">Não foi possível carregar os dados do site.</div>';
      }
    }
    init();
  </script>
</body>
</html>
