<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#59283B">
<title>Painel MAUY · Administração</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#29292b;--mut:#7b7275;--line:#ebe4de;--brand:#59283b;--acc:#59283b;--acc-t:#fff;--nude:#c5a99a;--soft:#f3ebe6;--ok:#2f7a58;--err:#a94446;--warn:#b7791f;--sh:0 10px 30px #3a1f2c12;--r:12px}
[data-theme=dark]{--bg:#161214;--card:#211b1e;--ink:#efe9e6;--mut:#a39a9d;--line:#33292e;--brand:#e3b9cb;--acc:#a8587a;--acc-t:#fff;--soft:#2b2226;--sh:0 10px 30px #0006}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 Poppins,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#3e1b2b;color:#f5f1eb;padding:24px 14px;display:flex;flex-direction:column}
[data-theme=dark] .side{background:#100c0e;border-right:1px solid var(--line)}
.logo{font-size:24px;font-weight:600;letter-spacing:.16em;padding:0 12px;color:#fff;text-decoration:none}.logo small{display:block;font-size:10px;font-weight:300;letter-spacing:.08em;color:#d9b8a8;margin-top:2px}
.nav{display:grid;gap:3px;margin-top:30px}.nav button{border:0;background:none;text-align:left;color:#f5f1ebc4;padding:11px 14px;border-radius:9px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.on{background:#ffffff17;color:#fff}.nav button.on{box-shadow:inset 3px 0 var(--nude)}
.side-b{margin-top:auto;padding:14px 12px 0;border-top:1px solid #ffffff22;font-size:11px;color:#f5f1ebaa;display:grid;gap:8px}
.side-b a{color:#fff;text-decoration:none}.side-b select{background:#ffffff14;border:1px solid #ffffff2a;border-radius:7px;padding:6px;color:#fff}.side-b option{color:#222}
.main{min-width:0;padding:0 clamp(16px,3.5vw,48px) 70px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.d{background:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(22px,2.6vw,30px);font-weight:500;color:var(--brand);margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.btn{border:0;border-radius:9px;background:var(--acc);color:var(--acc-t);padding:10px 16px;font-weight:500;font-size:12px;transition:.15s}.btn:hover{filter:brightness(1.12)}
.btn.sec{background:none;border:1px solid var(--acc);color:var(--brand)}.btn.ghost{background:none;color:var(--mut);padding:8px}.btn.dan{background:none;border:1px solid #e9c3c4;color:var(--err)}.btn.sm{padding:6px 10px;font-size:11px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--nude);outline-offset:2px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{font-size:16px;font-weight:500;color:var(--brand);margin:0 0 4px}.card>.sub{margin-bottom:14px;font-size:12px}
.stat b{display:block;font-size:24px;font-weight:500;color:var(--brand)}.stat span{color:var(--mut);font-size:12px}
.f{display:grid;gap:5px;min-width:0;align-content:start}.f.full{grid-column:1/-1}.f label{font-size:11.5px;font-weight:500;color:var(--mut)}.f small{color:var(--mut);font-size:11px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],input[type=search],input[type=password],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;font-weight:500;color:var(--mut);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--brand);font-size:11px;margin:1px}.pill.ok{background:#e4f3ea;color:var(--ok)}.pill.er{background:#f8e5e5;color:var(--err)}.pill.wa{background:#fbf0d9;color:var(--warn)}
[data-theme=dark] .pill.ok{background:#1d3a2c}[data-theme=dark] .pill.er{background:#3b2224}[data-theme=dark] .pill.wa{background:#3a2f17}
.th{width:44px;height:52px;border-radius:6px;object-fit:cover;background:var(--soft);flex:none}.pc{display:flex;gap:11px;align-items:center}.pc small{display:block;color:var(--mut)}
.lk{border:0;background:none;color:var(--brand);text-decoration:underline;padding:4px;font-size:12px}.lk.r{color:var(--err)}
.up{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.up img{max-height:54px;max-width:130px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}.ph{color:var(--mut);font-size:11px;padding:14px;border:1px dashed var(--line);border-radius:8px}
.bn{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--card)}.bn.over{border-color:var(--acc);background:var(--soft)}.bn-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hdl{cursor:grab;font-size:18px;color:var(--mut);user-select:none}
.pv{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;color:#29292b}.pv .tb{padding:6px;text-align:center;font-size:11px;color:#fff}.pv .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #eee}
.ban{position:relative;background:#e9ddd3 center/cover;display:grid;align-items:center;padding:24px;min-height:150px;color:#fff}.ban.m{max-width:300px;margin:auto;min-height:260px}.ban h3{margin:0 0 6px;font-size:22px;font-weight:500;text-shadow:0 1px 10px #0006}.ban p{margin:0 0 10px;text-shadow:0 1px 8px #0006}.ban span.cta{display:inline-block;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:none;padding:6px 12px;font-size:11.5px;color:var(--mut)}.seg button.on{background:var(--acc);color:var(--acc-t)}
.modal{position:fixed;inset:0;z-index:30;background:#150d11c4;display:none;place-items:center;padding:16px;overflow:auto}.modal.open{display:grid}
.mb{width:min(1060px,100%);max-height:94vh;overflow:auto;background:var(--bg);border-radius:16px;padding:24px;box-shadow:0 30px 90px #0008}.mh{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.mh h2{margin:0;color:var(--brand);font-weight:500;font-size:21px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.stick{position:sticky;top:0;align-self:start}
.rte{min-height:110px;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px;background:var(--card);overflow:auto}.rt{display:flex;gap:4px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:5px;background:var(--soft)}.rt button{border:0;background:none;padding:4px 9px;border-radius:5px;font-size:12px}.rt button:hover{background:var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.gi{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}.gi img{width:100%;height:92px;object-fit:cover;display:block;cursor:pointer}.gi i{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:#000a;color:#fff;font-style:normal}.gi button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:#000b;color:#fff}
.ce{display:grid;grid-template-columns:1fr 50px 28px;gap:6px;margin-bottom:6px}.chip{border:1px solid var(--line);background:none;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut)}.chip:hover{border-color:var(--acc);color:var(--brand)}
.pcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:#29292b}.pcard img,.pcard .ni{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9ddd3;display:block}.pcard div{padding:10px}
.bars{display:flex;align-items:end;gap:5px;height:130px}.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars i:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:5px;font-size:10px;white-space:nowrap}
.alert{background:#fbf0d9;color:#7a5412;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px}[data-theme=dark] .alert{background:#3a2f17;color:#f0d49a}
.log{font-size:11.5px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:grid;gap:8px}.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;border-left:4px solid var(--nude);box-shadow:var(--sh);font-size:12.5px;animation:in .2s}.toast.ok{border-color:#3fae7e}.toast.err{border-color:#d9696b}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:12px 14px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.side-b{display:none}.g4{grid-template-columns:repeat(2,1fr)}.g3,.split{grid-template-columns:1fr}.stick{position:static}}
@media(max-width:560px){.fg,.fg3,.g2{grid-template-columns:1fr}.mb{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="app">
<aside class="side"><a class="logo" href="../">MAUY<small>Painel administrativo</small></a><nav class="nav" id="nav"></nav>
<div class="side-b"><label>Perfil de acesso<select id="role"><option value="admin">Administrador</option><option value="operador">Operador</option></select></label><a href="../">← Ver loja</a></div></aside>
<main class="main"><div class="top"><div class="sync"><span class="dot" id="dot"></span><span id="stat">Carregando…</span></div>
<div class="row"><button class="btn ghost" id="theme" title="Alternar modo claro/escuro">◐ Tema</button><button class="btn sec" id="pull">↻ Atualizar da loja</button><button class="btn" id="pub">Publicar alterações</button></div></div>
<div id="view"></div></main></div>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div><div class="toasts" id="toasts" aria-live="polite"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Armazenamento do navegador cheio. Use imagens menores.','err');return false}}};
const K={db:'mauy_admin_db',gh:'mauy_gh',theme:'mauy_theme',role:'mauy_role',dirty:'mauy_dirty',secret:'mauy_secret'};
const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const FONTS=['Poppins','Montserrat','Inter','DM Sans','Playfair Display','Lora','Cormorant Garamond'];
const TROCAS='Arrependimento: 7 dias corridos após o recebimento, com frete de ida e volta pago pela MAUY.\nDefeito ou erro de envio: 30 dias, sem custo para você.\nTroca por motivo pessoal após 7 dias: frete por conta do cliente.\nEntrega não concluída: reenvio com novo frete ou cancelamento com estorno menos o frete original.\nA peça deve estar sem uso, com etiqueta e embalagem original.';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let db,gh=LS.g(K.gh,{branch:'main',pSite:'site.json',pProd:'produtos.json'}),role=LS.g(K.role,'admin'),tab='dash',dirty=LS.g(K.dirty,false),dev='d',P=null,pq='',cq='',ctag='';
const TABS=[['dash','Dashboard','◧',['admin','operador']],['vis','Conteúdo e marca','✦',['admin']],['prod','Produtos','▤',['admin','operador']],['log','Logística e vendas','⇄',['admin']],['crm','Clientes (CRM)','☺',['admin','operador']],['ped','Pedidos','✓',['admin','operador']],['seo','SEO e redes sociais','⌕',['admin']],['sis','Sistema e sincronização','⚙',['admin']]];

/* ---------- util ---------- */
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
const val=p=>p.split('.').reduce((o,k)=>o?.[k],db);
function setPath(o,p,v){const k=p.split('.');let c=o;k.slice(0,-1).forEach(x=>c=c[x]??={});c[k.at(-1)]=v}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const digits=s=>String(s||'').replace(/\D/g,'');
const wa=(n,m)=>{n=digits(n);if(n.length<=11)n='55'+n;return `https://wa.me/${n}?text=${encodeURIComponent(m||'')}`};
function sanitize(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name)}));return t.innerHTML}
function toData(f,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{if(/svg|gif|icon/.test(f.type))return res(r.result);const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(f.type==='image/png'&&max<=800?'image/png':'image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)})}
function embed(u){u=typeof u==='object'?u?.src:u;if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return`<iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allowfullscreen></iframe>`;m=u.match(/vimeo\.com\/(\d+)/);if(m)return`<iframe src="https://player.vimeo.com/video/${m[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allowfullscreen></iframe>`;return`<video src="${esc(u)}" controls muted playsinline style="width:100%;border-radius:8px"></video>`}
function csv(rows){return rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n')}
function dl(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const log=m=>{db.logs.unshift({t:new Date().toLocaleString('pt-BR'),u:role==='admin'?'Admin':'Operador',m});db.logs=db.logs.slice(0,200)};

/* ---------- dados ---------- */
function ensure(){db=db||{};db.products=db.products||[];db.customers=db.customers||[];db.orders=db.orders||[];db.logs=db.logs||[];db.meta=db.meta||{visitas:0};
const s=db.site=Object.assign({nome:'MAUY',whatsapp:'',cupons:[]},db.site||{});s.frete=Object.assign({gratisAcima:400,postagem:2},s.frete);s.tema=s.tema||{};s.banners=s.banners||[];
s.marca=Object.assign({logoClaro:'',logoEscuro:'',favicon:'',cor1:s.tema.wine||'#59283B',cor2:s.tema.nude||'#C5A99A',fonte:'Poppins'},s.marca);
s.avisos=Object.assign({ativo:true,texto:'Frete grátis acima de R$ 400 · 3x sem juros',cor:'#59283B'},s.avisos);
s.textos=Object.assign({rodape:'MAUY Fitness · Moda fitness para o dia a dia.',sobre:'',trocas:TROCAS,cookiesAtivo:true,cookies:'Usamos cookies para melhorar sua experiência. Ao continuar, você concorda com nossa Política de Privacidade (LGPD).'},s.textos);
s.freteEstados=s.freteEstados||[];s.integracoes=Object.assign({pixTipo:'CPF/CNPJ',pix:'',whatsappMsg:'Olá! Gostaria de finalizar meu pedido:'},s.integracoes);
s.seo=Object.assign({},s.seo);s.seo.paginas=s.seo.paginas||[['Home','/'],['Moda feminina','/feminina'],['Acessórios','/acessorios'],['Moda masculina','/masculina']].map(([pagina,slug])=>({pagina,slug,title:'',desc:''}));s.seo.og=Object.assign({titulo:'',desc:'',imagem:''},s.seo.og);
s.cupons.forEach(c=>{c.limiteCpf??=0;c.validade??=''})}
function persist(now){clearTimeout(persist.t);const go=()=>{log('Alterações salvas');dirty=true;LS.s(K.dirty,true);LS.s(K.db,db);status()};now?go():persist.t=setTimeout(go,500)}
function status(){$('#dot').className='dot'+(dirty?' d':'');$('#stat').textContent=dirty?'Alterações salvas neste aparelho · ainda não publicadas':(gh.repo?'Sincronizado com a loja':'Sem sincronização configurada')}
function siteOut(){const s=JSON.parse(JSON.stringify(db.site));s.tema={...s.tema,wine:s.marca.cor1,nude:s.marca.cor2};return s}
function prodOut(){return db.products.map(p=>({...p,imagem:p.fotos?.[0]||p.imagem||'',tamanhos:p.tamanhos?.length?p.tamanhos:['Único']}))}

/* ---------- GitHub ---------- */
const gReq=(path,o={})=>fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}${o.raw!==undefined||o.q?'?ref='+gh.branch:''}`,{method:o.m||'GET',headers:{Authorization:'Bearer '+gh.token,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json','Content-Type':'application/json'},body:o.body});
const gOk=()=>gh.repo&&gh.token&&gh.branch;
async function gGet(path){const r=await gReq(path,{raw:1});if(r.status===404)return null;if(!r.ok)throw Error(`GitHub ${r.status}: verifique repositório, branch e token`);return r.json()}
async function gPut(path,obj,msg){let sha;const m=await gReq(path,{raw:undefined,q:1});if(m.ok)sha=(await m.json()).sha;else if(m.status!==404)throw Error(`GitHub ${m.status}: sem acesso a ${path}`);const r=await gReq(path,{m:'PUT',body:JSON.stringify({message:msg,content:b64(JSON.stringify(obj,null,1)),branch:gh.branch,sha})});if(!r.ok)throw Error(`Falha ao publicar ${path} (${r.status}). O token precisa de permissão Contents: leitura e escrita.`)}
async function pull(silent){try{let s,p;if(gOk()){[s,p]=await Promise.all([gGet(gh.pSite),gGet(gh.pProd)])}else{const [a,b]=await Promise.all([fetch('../'+gh.pSite),fetch('../'+gh.pProd)]);if(!a.ok||!b.ok)throw Error('Não encontrei site.json e produtos.json');[s,p]=await Promise.all([a.json(),b.json()])}
db=db||{};if(s)db.site=s;if(p)db.products=p;ensure();LS.s(K.db,db);dirty=false;LS.s(K.dirty,false);status();if(!silent)toast('Dados atualizados a partir da loja');render()}catch(e){if(!silent)toast(e.message,'err');else{ensure();render()}}}
async function publish(){if(!gOk())return toast('Configure o GitHub em Sistema e sincronização.','err');const b=$('#pub');b.disabled=true;b.textContent='Publicando…';try{await gPut(gh.pSite,siteOut(),'Painel MAUY: atualiza configurações do site');await gPut(gh.pProd,prodOut(),'Painel MAUY: atualiza catálogo');log('Publicou site.json e produtos.json');dirty=false;LS.s(K.dirty,false);LS.s(K.db,db);status();toast('Publicado! A loja atualiza em instantes.')}catch(e){toast(e.message,'err')}b.disabled=false;b.textContent='Publicar alterações'}

/* ---------- helpers de formulário ---------- */
const inp=(l,p,o={})=>`<div class="f ${o.full?'full':''}"><label>${l}</label>${o.t==='ta'?`<textarea data-b="${p}" rows="${o.rows||3}">${esc(val(p))}</textarea>`:`<input data-b="${p}" type="${o.t||'text'}" value="${esc(val(p))}" placeholder="${esc(o.ph||'')}" ${o.a||''}>`}${o.h?`<small>${o.h}</small>`:''}</div>`;
const sel=(l,p,opts)=>`<div class="f"><label>${l}</label><select data-b="${p}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${val(p)==v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const chk=(l,p)=>`<label class="row" style="gap:8px"><input type="checkbox" data-b="${p}" ${val(p)?'checked':''}> ${l}</label>`;
const upl=(l,p,max,h)=>{const v=val(p);return`<div class="f"><label>${l}</label><div class="up">${v?`<img src="${esc(v)}" alt="">`:'<span class="ph">Sem imagem</span>'}<label class="btn sec sm">Enviar<input type="file" accept="image/*,.svg,.ico" hidden data-up="${p}" data-max="${max}"></label>${v?`<button class="btn ghost sm" data-act="clr" data-p="${p}">Remover</button>`:''}</div>${h?`<small>${h}</small>`:''}</div>`};
const head=(t,s,x='')=>`<div class="row" style="justify-content:space-between;align-items:end"><div><h1>${t}</h1><p class="sub">${s}</p></div>${x}</div>`;

/* ---------- métricas ---------- */
const okOrders=()=>db.orders.filter(o=>o.status!=='cancelado');
const cOrders=c=>okOrders().filter(o=>o.cliente===c.id),ltv=c=>cOrders(c).reduce((n,o)=>n+o.total,0);
const rec=c=>{const l=cOrders(c).map(o=>o.data).sort().pop();return l?Math.floor((Date.now()-new Date(l+'T12:00'))/864e5):null};
const stockOf=p=>Number(p.estoque||0),isLow=p=>p.ativo!==false&&stockOf(p)<=Number(p.estoqueMinimo??3);

/* ---------- views ---------- */

dash(){const o=okOrders(),t=today(),m=t.slice(0,7),sum=a=>a.reduce((n,x)=>n+x.total,0),mo=o.filter(x=>x.data.startsWith(m)),days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);return[d,sum(o.filter(x=>x.data===d))]}),mx=Math.max(1,...days.map(d=>d[1])),top={};o.forEach(x=>(x.itens||[]).forEach(i=>top[i.nome]=(top[i.nome]||0)+i.qtd));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),low=db.products.filter(isLow),vis=Number(db.meta.visitas)||0;
return head('Dashboard','Resumo das vendas e do estoque.')+`<div class="grid g4" style="margin-bottom:16px"><div class="card stat"><span>Faturamento hoje</span><b>${brl(sum(o.filter(x=>x.data===t)))}</b></div><div class="card stat"><span>Faturamento do mês</span><b>${brl(sum(mo))}</b></div><div class="card stat"><span>Ticket médio</span><b>${brl(mo.length?sum(mo)/mo.length:0)}</b></div><div class="card stat"><span>Taxa de conversão</span><b>${vis?(mo.length/vis*100).toFixed(1)+'%':'—'}</b><span>${vis?'sobre '+vis+' visitas':'informe as visitas do mês em Sistema'}</span></div></div>

<section class="card"><h2>Produtos mais vendidos</h2><p class="sub">Pelos itens registrados nos pedidos.</p>${tp.length?tp.map(([n,q])=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><b>${q} un.</b></div>`).join(''):'<p class="muted">Registre pedidos com itens para ver o ranking.</p>'}</section></div>
<section class="card"><h2>Alertas de estoque baixo</h2><p class="sub">Produtos com estoque igual ou abaixo do mínimo definido em cada um.</p>${low.length?low.map(p=>`<div class="alert"><b>${esc(p.nome)}</b> · ${stockOf(p)} un. (mínimo ${p.estoqueMinimo??3}) <button class="lk" data-act="editProd" data-i="${db.products.indexOf(p)}">Repor</button></div>`).join(''):'<p class="muted">Nenhum produto com estoque baixo.</p>'}</section>`},

if(P&&t.closest('#pf')){if(t.dataset.cn!==undefined){P.cores[+t.dataset.cn].nome=t.value;drawMx()}else if(t.dataset.ch!==undefined)P.cores[+t.dataset.ch].hex=t.value;else if(t.name==='tamanhos'){readForm();drawMx()}drawPV()}
if(P&&t.dataset.v)P.variantes[t.dataset.v]=Number(t.value)||0;if(t.id==='rte')drawPV()});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.up){const f=t.files[0];if(!f)return;try{setPath(db,t.dataset.up,await toData(f,+t.dataset.max||1200));persist(1);toast('Imagem enviada');render()}catch{toast('Não consegui ler esta imagem.','err')}}
if(t.id==='ctag'){ctag=t.value;drawCrm()}if(t.dataset.ost){db.orders.find(o=>o.id===t.dataset.ost).status=t.value;persist(1);toast('Status atualizado')}
if(t.id==='pimg'){const fs=[...t.files];if(P.fotos.length+fs.length>8)return toast('O limite é de 8 fotos por produto.','err');for(const f of fs)try{P.fotos.push(await toData(f,1200))}catch{toast(f.name+': arquivo inválido','err')}t.value='';drawGal();drawPV()}
if(t.id==='imp'){try{db=JSON.parse(await t.files[0].text());ensure();persist(1);toast('Backup restaurado com sucesso!');render()}catch{toast('Arquivo de backup inválido.','err')}}
if(t.id==='role')switchRole(t.value)});
document.addEventListener('submit',e=>{if(e.target.id==='pf')saveProd(e)});
let dr=null;document.addEventListener('dragstart',e=>{const b=e.target.closest?.('[data-drag]');if(b)dr=+b.dataset.drag});document.addEventListener('dragover',e=>{const b=e.target.closest?.('[data-drag]');if(b&&dr!==null){e.preventDefault();$$('.bn').forEach(x=>x.classList.remove('over'));b.classList.add('over')}});
document.addEventListener('drop',e=>{const b=e.target.closest?.('[data-drag]');if(!b||dr===null)return;e.preventDefault();const j=+b.dataset.drag,[x]=db.site.banners.splice(dr,1);db.site.banners.splice(j,0,x);dr=null;persist(1);render();toast('Ordem dos banners atualizada')});
document.addEventListener('dragend',()=>{dr=null;$$('.bn').forEach(x=>x.classList.remove('over'))});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;LS.s(K.theme,d)};
$('#pub').onclick=publish;$('#pull').onclick=()=>{if(dirty&&!confirm('Há alterações não publicadas neste aparelho. Atualizar vai substituí-las. Continuar?'))return;pull()};
function switchRole(r){if(r==='admin'&&role!=='admin'){const pin=LS.g('mauy_pin','');if(pin&&prompt('Informe o PIN do administrador')!==pin){$('#role').value=role;return toast('PIN incorreto.','err')}}role=r;LS.s(K.role,r);render()}
$('#modal').addEventListener('submit',e=>{});

/* ---------- render ---------- */
function render(){const T=TABS.filter(t=>t[3].includes(role));if(!T.find(t=>t[0]===tab))tab=T[0][0];$('#role').value=role;$('#nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':''}" data-nav="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join('');$$('[data-nav]').forEach(b=>b.onclick=()=>{tab=b.dataset.nav;render();scrollTo(0,0)});$('#view').innerHTML=V[tab]();if(tab==='prod')drawProds();if(tab==='crm')drawCrm();if(tab==='vis')drawBrand();status()}

/* ---------- início ---------- */
(async()=>{document.documentElement.dataset.theme=LS.g(K.theme,matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');db=LS.g(K.db,null);
if(!db){const old={site:LS.g('mauy_site',null),products:LS.g('mauy_produtos',null),orders:LS.g('mauy_pedidos',null)};if(old.site||old.products){db={site:old.site||{},products:old.products||[],orders:[]};ensure();render()}else{ensure();render();await pull(true)}}
else{ensure();render();if(gOk()&&!dirty)await pull(true)}})();
</script></body></html>
