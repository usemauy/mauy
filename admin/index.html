<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#29292b;--mut:#7b7275;--line:#ebe4de;--brand:#59283b;--acc:#59283b;--acc-t:#fff;--nude:#c5a99a;--soft:#f3ebe6;--ok:#2f7a58;--err:#a94446;--warn:#b7791f;--sh:0 10px 30px #3a1f2c12;--r:12px}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--brand);font-size:11px;margin:1px}.pill.ok{background:#e4f3ea;color:var(--ok)}.pill.er{background:#f8e5e5;color:var(--err)}.pill.wa{background:#fbf0d9;color:var(--warn)}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.gi{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}.gi img{width:100%;height:92px;object-fit:cover;display:block;cursor:pointer}.gi i{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:#000a;color:#fff;font-style:normal}.gi button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:#000b;color:#fff}
.ce{display:grid;grid-template-columns:1fr 50px 28px;gap:6px;margin-bottom:6px}.chip{border:1px solid var(--line);background:none;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut)}.chip:hover{border-color:var(--acc);color:var(--brand)}
.pcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:#29292b}.pcard img,.pcard .ni{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9ddd3;display:block}.pcard div{padding:10px}
.bars{display:flex;align-items:end;gap:5px;height:130px}.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars i:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:5px;font-size:10px;white-space:nowrap}
.alert{background:#fbf0d9;color:#7a5412;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px}[data-theme=dark] .alert{background:#3a2f17;color:#f0d49a}
.log{font-size:11.5px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:grid;gap:8px}.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;border-left:4px solid var(--nude);box-shadow:var(--sh);font-size:12.5px;animation:in .2s}.toast.ok{border-color:#3fae7e}.toast.err{border-color:#d9696b}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:12px 14px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.side-b{display:none}.g4{grid-template-columns:repeat(2,1fr)}.g3,.split{grid-template-columns:1fr}.stick{position:static}}
@media(max-width:560px){.fg,.fg3,.g2{grid-template-columns:1fr}.mb{padding:16px}}
.pvc{position:relative}.pvt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.pvt::-webkit-scrollbar{display:none}.pvn{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:#0006;color:#fff;font-size:16px;line-height:1}.pvn.l{left:8px}.pvn.r{right:8px}.pvd{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:5px;justify-content:center}.pvd i{width:6px;height:6px;border-radius:50%;background:#fff9}.pvd i:first-child{background:#fff}.pvi{font-size:10.5px;color:#777;text-align:center;padding:4px;background:#faf7f4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="app">
<aside class="side"><a class="logo" href="../">MAUY<small>Painel administrativo</small></a><nav class="nav" id="nav"></nav>
<div class="side-b"><label>Perfil de acesso<select id="role"><option value="admin">Administrador</option><option value="operador">Operador</option></select></label><a href="../">← Ver loja</a></div></aside>
<main class="main"><div class="top"><div class="sync"><span class="dot" id="dot"></span><span id="stat">Carregando…</span></div>
<div class="row"><button class="btn ghost" id="theme" title="Alternar modo claro/escuro">◐ Tema</button><button class="btn sec" id="pull">↻ Atualizar da loja</button><button class="btn" id="pub">Publicar alterações</button></div></div>
<div id="view"></div></main></div>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div><div class="toasts" id="toasts" aria-live="polite"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Armazenamento do navegador cheio. Use imagens menores.','err');return false}}};
const K={db:'mauy_admin_db',gh:'mauy_gh',theme:'mauy_theme',role:'mauy_role',dirty:'mauy_dirty',secret:'mauy_secret'};
const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const FONTS=['Poppins','Montserrat','Inter','DM Sans','Playfair Display','Lora','Cormorant Garamond'];
const TROCAS='Arrependimento: 7 dias corridos após o recebimento, com frete de ida e volta pago pela MAUY.\nDefeito ou erro de envio: 30 dias, sem custo para você.\nTroca por motivo pessoal após 7 dias: frete por conta do cliente.\nEntrega não concluída: reenvio com novo frete ou cancelamento com estorno menos o frete original.\nA peça deve estar sem uso, com etiqueta e embalagem original.';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let db,gh=LS.g(K.gh,{branch:'main',pSite:'site.json',pProd:'produtos.json'}),role=LS.g(K.role,'admin'),tab='dash',dirty=LS.g(K.dirty,false),dev='d',P=null,pq='',ps='',cq='',ctag='';
try{if(!gh.token)gh.token=sessionStorage.getItem('mauy_tok')||''}catch{}
const TABS=[['dash','Dashboard','◧',['admin','operador']],['vis','Conteúdo e marca','✦',['admin']],['prod','Produtos','▤',['admin','operador']],['log','Logística e vendas','⇄',['admin']],['crm','Clientes (CRM)','☺',['admin','operador']],['ped','Pedidos','✓',['admin','operador']],['seo','SEO e redes sociais','⌕',['admin']],['sis','Sistema e sincronização','⚙',['admin']]];

/* ---------- util ---------- */
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
const val=p=>p.split('.').reduce((o,k)=>o?.[k],db);
function setPath(o,p,v){const k=p.split('.');let c=o;k.slice(0,-1).forEach(x=>c=c[x]??={});c[k.at(-1)]=v}
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const digits=s=>String(s||'').replace(/\D/g,'');
const wa=(n,m)=>{n=digits(n);if(n.length<=11)n='55'+n;return `https://wa.me/${n}?text=${encodeURIComponent(m||'')}`};
function sanitize(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name)}));return t.innerHTML}
function toData(f,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{if(/svg|gif|icon/.test(f.type))return res(r.result);const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(f.type==='image/png'&&max<=800?'image/png':'image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)})}
function embed(u){u=typeof u==='object'?u?.src:u;if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return`<iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allowfullscreen></iframe>`;m=u.match(/vimeo\.com\/(\d+)/);if(m)return`<iframe src="https://player.vimeo.com/video/${m[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allowfullscreen></iframe>`;return`<video src="${esc(u)}" controls muted playsinline style="width:100%;border-radius:8px"></video>`}
function csv(rows){return rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n')}
function dl(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const log=m=>{db.logs.unshift({t:new Date().toLocaleString('pt-BR'),u:role==='admin'?'Admin':'Operador',m});db.logs=db.logs.slice(0,200)};

/* ---------- dados ---------- */
function ensure(){db=db||{};db.products=db.products||[];db.customers=db.customers||[];db.orders=db.orders||[];db.logs=db.logs||[];db.meta=db.meta||{visitas:0};
const s=db.site=Object.assign({nome:'MAUY',whatsapp:'',cupons:[]},db.site||{});s.frete=Object.assign({gratisAcima:400,postagem:2},s.frete);s.tema=s.tema||{};s.banners=s.banners||[];s.galeria=s.galeria||[];
s.marca=Object.assign({logoClaro:'',logoEscuro:'',favicon:'',cor1:s.tema.wine||'#59283B',cor2:s.tema.nude||'#C5A99A',fonte:'Poppins'},s.marca);
s.avisos=Object.assign({ativo:true,texto:'Frete grátis acima de R$ 400 · 3x sem juros',cor:'#59283B'},s.avisos);if(!Array.isArray(s.avisos.itens)||!s.avisos.itens.length)s.avisos.itens=[{texto:s.avisos.texto||'',link:'',ativo:true,inicio:'',fim:''}];s.avisos.intervalo??=5;s.carrossel=Object.assign({intervalo:6,transicao:'slide'},s.carrossel);s.pix??=5;s.frete.base??=24.9;
s.textos=Object.assign({rodape:'MAUY Fitness · Moda fitness para o dia a dia.',sobre:'',trocas:TROCAS,cookiesAtivo:true,cookies:'Usamos cookies para melhorar sua experiência. Ao continuar, você concorda com nossa Política de Privacidade (LGPD).'},s.textos);
s.freteEstados=s.freteEstados||[];s.integracoes=Object.assign({pixTipo:'CPF/CNPJ',pix:'',whatsappMsg:'Olá! Gostaria de finalizar meu pedido:'},s.integracoes);
s.seo=Object.assign({},s.seo);s.seo.paginas=s.seo.paginas||[['Home','/'],['Moda feminina','/feminina'],['Acessórios','/acessorios'],['Moda masculina','/masculina']].map(([pagina,slug])=>({pagina,slug,title:'',desc:''}));s.seo.og=Object.assign({titulo:'',desc:'',imagem:''},s.seo.og);
s.cupons.forEach(c=>{c.limiteCpf??=0;c.validade??=''})}
function persist(now){clearTimeout(persist.t);const go=()=>{dirty=true;LS.s(K.dirty,true);LS.s(K.db,db);status()};now?go():persist.t=setTimeout(go,500)}
function status(){$('#dot').className='dot'+(dirty?' d':'');$('#stat').textContent=dirty?'Alterações salvas neste aparelho · ainda não publicadas':(gh.repo?'Sincronizado com a loja':'Sem sincronização configurada')}
function siteOut(){const s=JSON.parse(JSON.stringify(db.site));s.tema={...s.tema,wine:s.marca.cor1,nude:s.marca.cor2};return s}
const ALLOWED=new Set(['P','B','STRONG','I','EM','U','UL','OL','LI','H3','BR']);
function cleanHtml(h){const t=document.createElement('template');t.innerHTML=String(h||'');const go=n=>[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}go(c);const g=c.tagName;if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(g)){c.remove();return}if(g==='DIV'){const q=document.createElement('p');while(c.firstChild)q.append(c.firstChild);c.replaceWith(q);return}if(!ALLOWED.has(g)){c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(a=>c.removeAttribute(a.name))});go(t.content);return t.innerHTML.replace(/<p><\/p>/g,'')}
const LINKMAP={'/':'#loja','/feminina':'#categoria=Feminina','/masculina':'#categoria=Masculina','/acessorios':'#categoria=Acessórios'};
const linkOut=l=>{l=String(l||'').trim();if(!l)return'#loja';return LINKMAP[(l.toLowerCase().replace(/\/$/,''))||'/']||l};
function fillVars(t,S){const c=(S.cupons||[]).find(x=>x.ativo!==false&&(!x.validade||x.validade>=today()));if(/\{cupom\}/.test(t)&&!c)return'';return String(t||'').replace(/\{frete\}/g,brl(S.frete?.gratisAcima)).replace(/\{cupom\}/g,c?c.codigo:'').trim()}
function prodOut(){return db.products.map(p=>({...p,descricao:cleanHtml(p.descricao),imagem:p.fotos?.[0]||p.imagem||'',tamanhos:p.tamanhos?.length?p.tamanhos:['Único']}))}

const fnv=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+s.length.toString(36)};

function walk(o,f,l=''){for(const k of Object.keys(o||{})){const v=o[k],n=l?l+'-'+k:k;if(typeof v==='string'){const r=f(v,n);if(r!==undefined)o[k]=r}else if(v&&typeof v==='object')walk(v,f,n)}}

let w=digits(s.whatsapp);if(w){if(w.length<=11)w='55'+w;if(w.length<12||w.length>13)return'WhatsApp inválido: use 55 + DDD + número (ex.: 5547999999999).';s.whatsapp=w}

async function gj(path,o={}){const r=await fetch(`https://api.github.com/repos/${gh.repo}${path}`,{method:o.m||'GET',headers:{Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:o.b&&JSON.stringify(o.b)});if(!r.ok){let m='';try{m=(await r.json()).message}catch{}throw Error(`GitHub ${r.status}${m?': '+m:''}`)}return r.status===204?null:r.json()}
const gReq=(path,o={})=>fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}${o.raw!==undefined||o.q?'?ref='+gh.branch:''}`,{method:o.m||'GET',headers:{Authorization:'Bearer '+gh.token,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json','Content-Type':'application/json'},body:o.body});
const gOk=()=>gh.repo&&gh.token&&gh.branch;
async function gGet(path){const r=await gReq(path,{raw:1});if(r.status===404)return null;if(!r.ok)throw Error(`GitHub ${r.status}: verifique repositório, branch e token`);return r.json()}

av=Array.isArray(s.avisos)&&s.avisos.length?s.avisos.map(a=>({texto:a.t||a.texto||'',link:a.link||'',ativo:true,inicio:a.ini||'',fim:a.fim||''})):(s.aviso?[{texto:s.aviso,link:'',ativo:true,inicio:'',fim:''}]:[]);
const site={nome:s.nome,whatsapp:s.whatsapp||'',frase:s.frase,pix:s.pix,frete:{gratisAcima:Number(s.gratis||0),postagem:s.fretePostagem??2,base:s.freteBase},freteEstados:s.freteEstados||[],marca:s.marca||{},
avisos:{ativo:av.length>0,texto:av[0]?.texto||'',cor:s.avisoCor||s.marca?.cor1||'#59283B',itens:av,intervalo:s.avisoIntervalo?s.avisoIntervalo/1000:5},
carrossel:{intervalo:s.intervalo?s.intervalo/1000:6,transicao:s.transicao||'slide'},textos:{...s.textos,rodape:s.textos?.rodape||s.rodape||''},integracoes:{whatsappMsg:s.whatsappMsg},seo:s.seo||{},
cupons:(s.cupons||[]).map(cp),layout:d?.layout||[],
banners:(d?.banners||[]).map(b=>({ativo:true,desktop:b.imagem||'',mobile:b.imagemMobile||'',titulo:b.titulo||'',sub:b.texto||'',link:b.link||'',cta:b.cta||'',corCta:b.corCta||'#59283B',alt:b.alt||'',inicio:b.inicio||'',fim:b.fim||''})),galeria:d?.galeria||[]};

async function pull(silent){try{let s=null,p=null;if(gOk()){try{[s,p]=await Promise.all([gGet(gh.pSite),gGet(gh.pProd)])}catch{const d=await gGet('dados.json');if(!d)throw Error('Não encontrei dados.json nem os arquivos configurados.');const x=importStorefrontData(d);s=x.site;p=x.products}}else{const [a,b]=await Promise.all([fetch('./'+gh.pSite),fetch('./'+gh.pProd)]);if(a.ok&&b.ok){[s,p]=await Promise.all([a.json(),b.json()])}else{const r=await fetch('./dados.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Não encontrei dados.json, site.json ou produtos.json.');const x=importStorefrontData(await r.json());s=x.site;p=x.products}}

const b=$('#pub');b.disabled=true;
try{
const files=new Map(),map=new Map(),S=siteOut(),Pd=JSON.parse(JSON.stringify(prodOut()));

const head=(await gj('/git/ref/heads/'+gh.branch)).object.sha,base=(await gj('/git/commits/'+head)).tree.sha,tree=[],blob=async(c,enc)=>(await gj('/git/blobs',{m:'POST',b:{content:c,encoding:enc}})).sha;

}catch(e){toast(e.message,'err')}

'use strict';
/* =====================================================================
   MÓDULOS MAUY v2 — camada adicional sobre o painel (não altera o núcleo)
   1) Importação em lote (CSV/XLSX)   2) Construtor de seções da home
   3) Produtividade: Ctrl+S, Ctrl+Z (undo), alerta de conflito no GitHub
   ===================================================================== */

/* ---------- utilidades locais ---------- */
const clean = s => String(s ?? '').replace(/<[^>]*>/g, '').trim();          // remove tags (anti-XSS na entrada)
const col   = (x, d) => /^#[0-9a-f]{3,8}$/i.test(x || '') ? x : d;           // só aceita cor hex válida
const num   = s => {                                                          // "R$ 1.299,90" | "99.9" → número
  s = String(s ?? '').replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
};

/* Decodificação automática: tenta UTF-8 estrito; se falhar, ISO-8859-1 */
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('iso-8859-1').decode(buf); }
}
/* Parser CSV com aspas, quebras de linha em células e delimitador ; ou , detectado */
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0];
  const d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
/* SheetJS carregado sob demanda (versão fixa, CDN permitido) */
async function loadXLSX() {
  if (window.XLSX) return;
  await new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = () => no(Error('Não consegui carregar a biblioteca de Excel. Use um arquivo .csv.'));
    document.head.append(s);
  });
}
async function readSheet(f) {
  if (!f) return;
  try {
    const buf = await f.arrayBuffer();
    let aoa;
    if (/\.xlsx?$/i.test(f.name)) {
      await loadXLSX();
      const wb = XLSX.read(buf, { type: 'array' });
      aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    } else aoa = parseCSV(decode(buf));
    aoa = aoa.filter(r => r.some(c => String(c).trim()));
    if (aoa.length < 2) throw Error('A planilha precisa ter o cabeçalho e ao menos uma linha.');
    IM.headers = aoa[0].map(h => String(h).trim());
    IM.rows = aoa.slice(1, 2001);
    if (aoa.length > 2001) toast('Lidas as primeiras 2.000 linhas.', 'err');
    IM.map = autoMap();
    drawImp();
  } catch (e) { toast(e.message, 'err'); }
}
/* Mapeamento automático por nome de coluna (exato primeiro, depois "contém") */
function autoMap() {
  const H = IM.headers.map(nz), m = {};
  FIELDS[IM.kind].forEach(([k, , syn]) => {
    let i = H.findIndex(h => syn.includes(h));
    if (i < 0) i = H.findIndex(h => syn.some(s => s.length > 3 && h.includes(s)));
    m[k] = i;
  });
  return m;
}
/* Reconstrói variantes ("Cor|Tam" → qtd) e o estoque total */
function rebuild(p, total) {
  const cs = (p.cores?.length ? p.cores : [{ nome: 'Único' }]).map(c => c.nome);
  const sz = p.tamanhos?.length ? p.tamanhos : ['Único'];
  const keys = cs.flatMap(c => sz.map(s => c + '|' + s)), old = p.variantes || {}, v = {};
  if (total == null) keys.forEach(k => v[k] = old[k] || 0);
  else { const b = Math.floor(total / keys.length); let r = total - b * keys.length; keys.forEach(k => v[k] = b + (r-- > 0 ? 1 : 0)); }
  p.variantes = v;
  p.estoque = Object.values(v).reduce((a, b) => a + b, 0);
}

/* ---- análise / validação (não altera o db) ---- */
const cell = (r, f) => IM.map[f] == null || IM.map[f] < 0 ? '' : String(r[IM.map[f]] ?? '').trim();

function analyzeProdutos() {
  const idx = new Map(db.products.map((p, i) => [String(p.sku || '').toUpperCase(), i])), seen = new Set();
  return IM.rows.map((r, n) => {
    const it = { n: n + 2, errs: [], warns: [], patch: {} }, P = it.patch;
    const sku = clean(cell(r, 'sku')).toUpperCase();
    if (sku) { P.sku = sku; if (seen.has(sku)) it.errs.push('SKU duplicado na planilha'); seen.add(sku); }
    it.ex = sku ? idx.get(sku) : undefined;
    ['nome', 'categoria', 'subcategoria'].forEach(f => { const v = clean(cell(r, f)); if (v) P[f] = v; });
    let raw = cell(r, 'preco');
    if (raw) { const v = num(raw); v > 0 ? P.preco = v : it.errs.push('Preço inválido: ' + raw); }
    raw = cell(r, 'precoAntigo');
    if (raw) { const v = num(raw); v > 0 ? P.precoAntigo = v : it.errs.push('Preço antigo inválido: ' + raw); }
    raw = cell(r, 'estoque');
    if (raw) { const v = num(raw); Number.isInteger(v) && v >= 0 ? P.estoque = v : it.errs.push('Estoque inválido: ' + raw); }
    raw = cell(r, 'tamanhos'); if (raw) P.tamanhos = list(raw).map(s => s.toUpperCase());
    raw = cell(r, 'cores');
    if (raw) P.cores = list(raw, /[|;]/).map(c => { const [nome, hex] = c.split(':'); return { nome: clean(nome), hex: col((hex || '').trim(), '#cccccc') }; });
    raw = cell(r, 'ativo');
    if (raw) {
      if (/^(sim|s|1|true|ativo|visivel|visível)$/i.test(raw)) P.ativo = true;
      else if (/^(nao|não|n|0|false|oculto|inativo)$/i.test(raw)) P.ativo = false;
      else it.warns.push('Valor de “Ativo” não reconhecido');
    }
    const ex = it.ex !== undefined ? db.products[it.ex] : null, preco = P.preco ?? ex?.preco;
    if (!ex) {
      if (!P.nome) it.errs.push('Nome obrigatório');
      if (P.preco == null && !it.errs.some(e => e.startsWith('Preço inv'))) it.errs.push('Preço obrigatório');
      if (!sku) it.warns.push('SKU será gerado automaticamente');
    }
    if (P.precoAntigo && preco && P.precoAntigo <= preco) it.errs.push('Preço antigo deve ser maior que o preço');
    it.status = it.errs.length ? 'erro' : ex ? (IM.mode === 'novos' ? 'ignorado' : 'atualiza') : 'novo';
    return it;
  });
}
function analyzeClientes() {
  const keyOf = c => digits(c.whatsapp) || String(c.email || '').toLowerCase();
  const idx = new Map(db.customers.map((c, i) => [keyOf(c), i])), seen = new Set();
  return IM.rows.map((r, n) => {
    const it = { n: n + 2, errs: [], warns: [], patch: {} }, P = it.patch;
    ['nome', 'tamanhos', 'pref'].forEach(f => { const v = clean(cell(r, f)); if (v) P[f] = v; });
    const wa = digits(cell(r, 'whatsapp')), em = clean(cell(r, 'email')).toLowerCase();
    if (wa) { wa.length >= 10 && wa.length <= 13 ? P.whatsapp = wa : it.errs.push('WhatsApp inválido'); }
    if (em) { /^\S+@\S+\.\S+$/.test(em) ? P.email = em : it.errs.push('E-mail inválido'); }
    const t = cell(r, 'tags'); if (t) P.tags = list(t);
    const key = wa || em;
    if (key) { if (seen.has(key)) it.errs.push('Cliente duplicado na planilha'); seen.add(key); }
    it.ex = key ? idx.get(key) : undefined;
    if (it.ex === undefined && !P.nome) it.errs.push('Nome obrigatório');
    it.status = it.errs.length ? 'erro' : it.ex !== undefined ? (IM.mode === 'novos' ? 'ignorado' : 'atualiza') : 'novo';
    return it;
  });
}
const analyze = () => IM.kind === 'produtos' ? analyzeProdutos() : analyzeClientes();

    bannerDuplo: b => box(`<div style="display:grid;grid-template-columns:${m ? '1fr' : '1fr 1fr'};gap:6px">${[1, 2].map(n => `<div style="height:80px;border-radius:8px;background:${b['imagem' + n] ? `center/cover url('${esc(u(b['imagem' + n]))}')` : cd};color:#fff;display:flex;align-items:end;padding:8px">${esc(b['titulo' + n] || '')}</div>`).join('')}</div>`, b.titulo),
    video: b => box(`<div style="aspect-ratio:16/9;background:#222;color:#fff;border-radius:8px;display:grid;place-items:center;font-size:28px">▶</div>`, b.titulo),
    depoimentos: b => box(`<i>“${esc((ln(b)[0] || 'Nome|Depoimento').split('|').pop())}”</i>`, b.titulo)
  };
  $('#laypv').innerHTML = `<div style="width:${m ? '360px' : '100%'};max-width:100%;margin:auto;background:#f5f1eb;color:#29292b;font-family:${esc(s.marca.fonte)},sans-serif;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px">
    <div style="background:${col(s.avisos?.cor, ac)};color:#fff;text-align:center;padding:6px;font-size:11px">${esc(avMsgs()[0] || '')}</div>
    ${lay().filter(b => b.ativo !== false).map(b => PV[b.tipo]?.(b) || '').join('')}</div>`;
}
Object.assign(A, {
  sadd() { const t = $('#lnew').value; lay().push({ id: bid(), tipo: t, ativo: true, titulo: t === 'produtos' ? 'Novidades' : '', ...(t === 'galeria' ? { fotos: [] } : {}), ...(t === 'produtos' ? { quantidade: 8 } : {}) }); persist(1); render(); },
  stog(d) { const b = lay()[+d.i]; b.ativo = b.ativo === false; persist(1); render(); },
  sdup(d) { const b = JSON.parse(JSON.stringify(lay()[+d.i])); b.id = bid(); lay().splice(+d.i + 1, 0, b); persist(1); render(); },
  sdel(d) { if (confirm('Excluir este bloco?')) { lay().splice(+d.i, 1); persist(1); render(); } },
  smove(d) { const a = lay(), i = +d.i, j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; persist(1); render(); },
  sfrm(d) { lay()[+d.i].fotos.splice(+d.j, 1); persist(1); render(); },
  sgoto() { tab = 'vis'; render(); scrollTo(0, 0); },
  tplCsv() { dl(`modelo-${IM.kind}.csv`, csv(TPL[IM.kind]), 'text/csv'); },
  async tplXlsx() {
    try { await loadXLSX(); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(TPL[IM.kind]), 'Modelo'); XLSX.writeFile(wb, `modelo-${IM.kind}.xlsx`); }
    catch (e) { toast(e.message, 'err'); }
  },
  impOk() {
    const ok = (IM._items || []).filter(i => i.status === 'novo' || i.status === 'atualiza');
    if (!ok.length) return;
    ok.forEach(IM.kind === 'produtos' ? applyProduto : applyCliente);
    log(`Importou ${ok.length} ${IM.kind} via planilha`);
    persist(1); IM.rows = []; IM.headers = [];
    toast(`${ok.length} registro(s) importados. Revise e publique.`); render();
  },
  undo() { undo(); }
});
document.addEventListener('change', async e => {
  const t = e.target; if (t.dataset.sgal === undefined) return;
  const b = lay()[+t.dataset.sgal], fs = [...t.files];
  for (const f of fs) try { b.fotos.push({ img: await toData(f, 1400), legenda: '' }); } catch { toast(f.name + ': arquivo inválido', 'err'); }
  t.value = ''; persist(1); render(); toast('Fotos adicionadas. Clique em Publicar alterações.');
});

/* Drag & drop das seções (independente do drag dos banners) */
let ldr = null;
document.addEventListener('dragstart', e => { const b = e.target.closest?.('[data-ldrag]'); if (b) ldr = +b.dataset.ldrag; });
document.addEventListener('dragover', e => { const b = e.target.closest?.('[data-ldrag]'); if (b && ldr !== null) { e.preventDefault(); $$('[data-ldrag]').forEach(x => x.classList.remove('over')); b.classList.add('over'); } });
document.addEventListener('drop', e => {
  const b = e.target.closest?.('[data-ldrag]'); if (!b || ldr === null) return;
  e.preventDefault(); const j = +b.dataset.ldrag, [x] = lay().splice(ldr, 1); lay().splice(j, 0, x); ldr = null; persist(1); render();
});
document.addEventListener('dragend', () => { ldr = null; });
document.addEventListener('input', e => { if (tab === 'lay' && e.target.dataset.b) layPV(); });   // preview ao vivo, sem perder foco
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.imp === 'kind') { IM.kind = t.value; IM.map = IM.rows.length ? autoMap() : {}; drawImp(); }
  else if (t.dataset.imp === 'mode') { IM.mode = t.value; if (IM.rows.length) drawImpPV(); }
  else if (t.dataset.impMap) { IM.map[t.dataset.impMap] = +t.value; drawImpPV(); }
  else if (t.id === 'impf') { await readSheet(t.files[0]); t.value = ''; }
});

/* =====================================================================
   3. PRODUTIVIDADE: undo em memória, atalhos e conflito de commit
   ===================================================================== */
const snap = () => JSON.stringify(db), undoStack = []; let lastSnap = null, lastPush = 0, snapTimer = 0, headSha = null;
const _persist = persist;
persist = function (now) {
  if (lastSnap && Date.now() - lastPush > 1200) { undoStack.push(lastSnap); if (undoStack.length > 25) undoStack.shift(); lastPush = Date.now(); }  // agrupa digitação rápida
  _persist(now);
  clearTimeout(snapTimer); snapTimer = setTimeout(() => { lastSnap = snap(); }, 1300);
};
function undo() {
  if (!undoStack.length) return toast('Nada para desfazer.', 'err');
  db = JSON.parse(undoStack.pop()); ensure(); lastSnap = snap();
  dirty = true; LS.s(K.dirty, true); LS.s(K.db, db); render(); toast('Última alteração desfeita');
}
async function readHead() { if (!gOk()) return null; try { return (await gj('/git/ref/heads/' + gh.branch)).object.sha; } catch { return null; } }
/* Publica avisando se o branch remoto mudou desde que o painel foi aberto/atualizado */
async function publishSafe() {
  if (gOk()) {
    const h = await readHead();
    if (headSha && h && h !== headSha && !confirm('⚠ O repositório recebeu outro commit desde que você abriu o painel. Publicar agora pode sobrescrever essas mudanças em site.json/produtos.json. Continuar mesmo assim?')) return;
  }
  await publish();
  if (!dirty) headSha = await readHead();
}
const _pull = pull;
pull = async function (silent) { await _pull(silent); headSha = await readHead(); };
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); publishSafe(); }
  else if (mod && k === 'z' && !e.shiftKey && !e.target.closest('input,textarea,[contenteditable]')) { e.preventDefault(); undo(); }
});

/* ---------- integração com o núcleo ---------- */
const _ensure = ensure;
ensure = function () {
  _ensure(); const s = db.site;
  s.banners.forEach(b => { if (!b.desktop && b.imagem) b.desktop = b.imagem; if (!b.sub && b.texto) b.sub = b.texto; if (b.ativo === undefined) b.ativo = true; });
  if (!Array.isArray(s.layout) || !s.layout.length) s.layout = defaultLayout(s);
  s.layout = s.layout.map(b => b.tipo === 'destaques' ? { ...b, tipo: 'produtos', quantidade: b.quantidade || 0 } : b.tipo === 'lookbook' ? { ...b, tipo: 'galeria', fotos: [] } : b).filter(b => LT[b.tipo]);
  s.layout.forEach(b => { if (b.tipo === 'galeria' && !Array.isArray(b.fotos)) b.fotos = []; });
};
const _render = render;
render = function () { _render(); if (tab === 'imp') drawImp(); if (tab === 'lay') layPV(); };
TABS.splice(TABS.findIndex(t => t[0] === 'prod') + 1, 0, ['imp', 'Importar planilha', '⇪', ['admin', 'operador']]);
TABS.splice(TABS.findIndex(t => t[0] === 'vis') + 1, 0, ['lay', 'Layout da home', '☷', ['admin']]);
$('#pub').onclick = publishSafe;
$('#theme').insertAdjacentHTML('beforebegin', '<button class="btn ghost" data-act="undo" title="Desfazer (Ctrl+Z)">↶ Desfazer</button>');
try { localStorage.removeItem('mauy_secret'); localStorage.removeItem('mauy_draft'); } catch {}
ensure(); render();
setTimeout(() => { lastSnap = snap(); }, 1500);
readHead().then(h => { headSha ??= h; });
</script>
