<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#59283B">
  <title>Painel MAUY · Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#59283B;--sand:#F5F1EB;--ink:#29292B;--nude:#C5A99A;--pale:#E9DDD3;--white:#fff;--muted:#796f70;--serif:'Playfair Display',serif;--sans:'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--sans);line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:var(--wine);color:var(--sand);padding:30px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{color:var(--sand);text-decoration:none;font-size:26px;font-weight:700;letter-spacing:.24em;line-height:1.15}.brand small{display:block;color:var(--nude);font-size:9px;letter-spacing:.32em;margin-top:5px}.side-label{margin:44px 12px 12px;color:#d9c6bf;font-size:9px;letter-spacing:.2em;text-transform:uppercase}.nav{display:grid;gap:7px}.tab{border:0;border-radius:999px;background:transparent;color:#f5f1ebc9;text-align:left;padding:12px 15px;font-size:13px;transition:.2s}.tab:hover,.tab.on{background:#ffffff1a;color:white}.tab.on{box-shadow:inset 3px 0 var(--nude)}.side-bottom{margin-top:auto;border-top:1px solid #ffffff2a;padding-top:20px}.side-bottom p{font-size:11px;color:#f5f1ebaa;margin:0 10px 12px}.store-link{display:block;text-decoration:none;color:var(--sand);font-size:12px;padding:10px;border-radius:30px}.store-link:hover{background:#ffffff17}.main{min-width:0;padding:40px clamp(20px,5vw,68px)}.content{max-width:1180px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.crumb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9a8176}.status{border:1px solid var(--pale);background:#fff;border-radius:30px;padding:8px 13px;font-size:11px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:25px}.heading h1{font:500 clamp(32px,4vw,46px)/1.1 var(--serif);color:var(--wine);margin:0}.heading p{font-size:13px;color:var(--muted);margin:8px 0 0}.btn{border:0;border-radius:999px;background:var(--wine);color:white;padding:12px 19px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:.2s}.btn:hover{background:#44202e}.btn.secondary{border:1px solid var(--wine);background:transparent;color:var(--wine)}.btn.secondary:hover{background:var(--pale)}.btn.danger{background:#fff;color:#9b3934;border:1px solid #e8c9c6}.btn.danger:hover{background:#fbefed}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 22px}.stat{background:#fff;padding:19px 21px;border:1px solid #eadfd9}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.stat strong{display:block;font:500 27px var(--serif);color:var(--wine);margin-top:4px}.panel{background:#fff;border:1px solid #eadfd9;padding:22px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panel-title h2{font:500 23px var(--serif);color:var(--wine);margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#998a88;padding:12px;border-bottom:1px solid var(--pale)}.table td{padding:12px;border-bottom:1px solid #f0e9e5;font-size:12px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.prod-cell{display:flex;align-items:center;gap:12px;min-width:220px}.prod-cell img{width:43px;height:53px;object-fit:cover;background:var(--pale)}.prod-cell b{font-weight:500}.muted{color:var(--muted)}.text-btn{border:0;background:none;color:var(--wine);text-decoration:underline;font-size:11px;padding:4px}.text-btn.delete{color:#9b3934}.pill{display:inline-block;border-radius:30px;padding:4px 10px;background:#f3ece8;color:var(--wine);font-size:10px}.pill.off{background:#f4e7e5;color:#963c37}.notice{background:#faf6f2;border-left:2px solid var(--nude);padding:14px 16px;font-size:12px;color:#65595d;margin-bottom:20px}.empty{padding:38px;text-align:center;color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;z-index:10;background:#21171bb3;display:none;place-items:start center;padding:25px;overflow:auto}.modal.open{display:grid}.modal-box{position:relative;width:min(560px,100%);background:var(--sand);padding:30px;margin:auto}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.modal-head h2{font:500 28px var(--serif);color:var(--wine);margin:0}.x{border:0;background:transparent;color:var(--wine);font-size:24px;line-height:1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#756b6c}.field input,.field select,.field textarea{width:100%;border:1px solid var(--nude);background:#fff;padding:11px 12px;outline:none;border-radius:0;font-size:13px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--wine)}.field textarea{resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:16px 18px}.brand{font-size:22px}.brand small{display:inline;margin:0 0 0 8px;font-size:8px}.side-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:15px}.tab{white-space:nowrap;padding:9px 14px}.main{padding:28px 17px}.topline{margin-bottom:25px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.heading{align-items:start;flex-direction:column}.panel{padding:15px}.panel-title{align-items:start}.table{min-width:630px}}@media(max-width:420px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:10px}.modal-box{padding:21px}.status{font-size:10px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="../cliente/">MAUY<small>PAINEL ADMINISTRATIVO</small></a>
      <p class="side-label">Gerenciamento da loja</p>
      <nav class="nav"><button class="tab on" data-tab="prod">Produtos</button><button class="tab" data-tab="cup">Cupons</button><button class="tab" data-tab="ped">Pedidos</button><button class="tab" data-tab="dados">Dados e publicação</button></nav>
      <div class="side-bottom"><p>MAUY Fitness · administração</p><a class="store-link" href="../cliente/">← Ver loja</a></div>
    </aside>
    <main class="main"><div class="content"><div class="topline"><span class="crumb">MAUY · Administração</span><span class="status">Dados salvos neste navegador</span></div><div id="view"><p class="muted">Carregando painel…</p></div></div></main>
  </div>
  <div class="modal" id="modal"><div class="modal-box" id="modalbox"></div></div><div class="toast" id="toast"></div>
  <script>
  'use strict';
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const keys={products:'mauy_produtos',site:'mauy_site',orders:'mauy_pedidos'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const local={get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
  let products=[],site={},orders=[],tab='prod';
  function notice(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.classList.remove('show'),2200)}
  function save(){local.set(keys.products,products);local.set(keys.site,site);local.set(keys.orders,orders)}
  function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function heading(title,subtitle,extra=''){return `<div class="heading"><div><p class="crumb">MAUY · ADMIN</p><h1>${title}</h1><p>${subtitle}</p></div>${extra}</div>`}
  function productView(){const value=products.reduce((n,p)=>n+Number(p.preco||0)*Number(p.estoque||0),0);return heading('Produtos','Gerencie o catálogo que aparece na loja.',`<button id="new-product" class="btn">+ Novo produto</button>`)+`<div class="stats"><div class="stat"><span>Produtos cadastrados</span><strong>${products.length}</strong></div><div class="stat"><span>Unidades em estoque</span><strong>${products.reduce((n,p)=>n+Number(p.estoque||0),0)}</strong></div><div class="stat"><span>Valor estimado em estoque</span><strong>${brl(value)}</strong></div></div><section class="panel"><div class="panel-title"><h2>Catálogo</h2><span class="muted" style="font-size:11px">${products.length} itens</span></div>${products.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Preço</th><th></th></tr></thead><tbody>${products.map((p,i)=>`<tr><td><div class="prod-cell">${p.imagem?`<img src="${esc(p.imagem)}" alt="" onerror="this.style.display='none'">`:'<div style="width:43px;height:53px;background:var(--pale)"></div>'}<b>${esc(p.nome)}</b></div></td><td>${esc(p.categoria||'—')}</td><td>${Number(p.estoque||0)}</td><td>${brl(p.preco)}</td><td style="text-align:right;white-space:nowrap"><button class="text-btn" data-edit="${i}">Editar</button><button class="text-btn delete" data-delete="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Seu catálogo está vazio. Adicione o primeiro produto.</div>'}</section>`}
  function couponView(){const coupons=site.cupons||[];return heading('Cupons','Crie e controle ofertas para seus clientes.',`<button id="new-coupon" class="btn">+ Novo cupom</button>`)+`<section class="panel"><div class="panel-title"><h2>Cupons ativos e inativos</h2><span class="muted" style="font-size:11px">${coupons.length} cupons</span></div>${coupons.length?`<div class="table-wrap"><table class="table" style="min-width:580px"><thead><tr><th>Código</th><th>Desconto</th><th>Pedido mínimo</th><th>Status</th><th></th></tr></thead><tbody>${coupons.map((c,i)=>`<tr><td><b>${esc(c.codigo)}</b></td><td>${c.tipo==='percentual'?`${Number(c.valor)}%`:brl(c.valor)}</td><td>${brl(c.minimo)}</td><td><span class="pill ${c.ativo?'':'off'}">${c.ativo?'Ativo':'Inativo'}</span></td><td style="text-align:right;white-space:nowrap"><button class="text-btn" data-toggle-coupon="${i}">${c.ativo?'Desativar':'Ativar'}</button><button class="text-btn delete" data-delete-coupon="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum cupom cadastrado.</div>'}</section>`}
  function ordersView(){return heading('Pedidos','Acompanhe pedidos registrados neste navegador.')+`<div class="notice">O checkout da loja direciona os pedidos pelo WhatsApp. Ele não grava nem sincroniza pedidos em um servidor; portanto, esta lista pode permanecer vazia.</div><section class="panel"><div class="panel-title"><h2>Pedidos locais</h2><span class="muted" style="font-size:11px">${orders.length} pedidos</span></div>${orders.length?orders.map((o,i)=>`<div style="padding:14px 0;border-top:1px solid var(--pale)"><b>Pedido ${i+1} · ${brl(o.total)}</b><p class="muted" style="margin:5px 0;font-size:12px">${esc(o.cliente||'Cliente')} · ${esc(o.data||'')}</p></div>`).join(''):'<div class="empty">Nenhum pedido registrado neste navegador.</div>'}</section>`}
  function dataView(){return heading('Dados e publicação','Exporte as alterações do painel para publicar na loja.')+`<div class="notice"><b style="color:var(--wine)">Importante:</b> as edições são salvas apenas no localStorage deste navegador. Para atualizar a loja para todos, baixe os arquivos JSON e substitua os correspondentes no repositório.</div><section class="panel" style="max-width:700px"><div class="panel-title"><h2>Exportar dados</h2></div><p class="muted" style="font-size:13px;margin:0 0 18px">Baixe os arquivos atuais para publicar o catálogo e as configurações da MAUY.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="export-products" class="btn">Baixar produtos.json</button><button id="export-site" class="btn secondary">Baixar site.json</button></div><hr style="border:0;border-top:1px solid var(--pale);margin:24px 0"><h2 style="font:500 21px var(--serif);color:var(--wine);margin:0 0 8px">Restaurar dados originais</h2><p class="muted" style="font-size:12px">Remove as edições salvas localmente e volta a carregar os arquivos publicados.</p><button id="reset" class="btn secondary">Restaurar dados</button></section>`}
  function render(){ $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#view').innerHTML=({prod:productView,cup:couponView,ped:ordersView,dados:dataView})[tab]();$('#new-product')?.addEventListener('click',()=>editProduct());$$('[data-edit]').forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.edit)));$$('[data-delete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.delete);if(confirm(`Excluir ${products[i].nome}?`)){products.splice(i,1);save();notice('Produto excluído');render()}});$('#new-coupon')?.addEventListener('click',()=>editCoupon());$$('[data-toggle-coupon]').forEach(b=>b.onclick=()=>{const c=site.cupons[Number(b.dataset.toggleCoupon)];c.ativo=!c.ativo;save();render()});$$('[data-delete-coupon]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.deleteCoupon);if(confirm(`Excluir o cupom ${site.cupons[i].codigo}?`)){site.cupons.splice(i,1);save();render()}});$('#export-products')?.addEventListener('click',()=>download('produtos.json',products));$('#export-site')?.addEventListener('click',()=>download('site.json',site));$('#reset')?.addEventListener('click',()=>{if(confirm('Remover as alterações salvas neste navegador e restaurar os dados publicados?')){Object.values(keys).forEach(k=>localStorage.removeItem(k));location.reload()}})}
  function editProduct(index=null){const p=index===null?{nome:'',preco:'',precoAntigo:'',categoria:'Feminina',estoque:0,tamanhos:['P','M','G'],imagem:'',descricao:''}:{...products[index]};$('#modalbox').innerHTML=`<div class="modal-head"><h2>${index===null?'Novo produto':'Editar produto'}</h2><button class="x" data-cancel aria-label="Fechar">×</button></div><form id="product-form"><div class="form-grid"><div class="field full"><label>Nome do produto</label><input name="nome" required value="${esc(p.nome)}" placeholder="Ex.: Legging Sculpt"></div><div class="field"><label>Preço (R$)</label><input name="preco" type="number" min="0" step="0.01" required value="${Number(p.preco)||''}"></div><div class="field"><label>Preço anterior (opcional)</label><input name="precoAntigo" type="number" min="0" step="0.01" value="${Number(p.precoAntigo)||''}"></div><div class="field"><label>Categoria</label><input name="categoria" required value="${esc(p.categoria||'Feminina')}" placeholder="Feminina"></div><div class="field"><label>Estoque</label><input name="estoque" type="number" min="0" step="1" required value="${Number(p.estoque)||0}"></div><div class="field full"><label>Tamanhos (separados por vírgula)</label><input name="tamanhos" value="${esc((p.tamanhos||[]).join(', '))}" placeholder="P, M, G, GG"></div><div class="field full"><label>URL da imagem</label><input name="imagem" type="url" value="${esc(p.imagem||'')}" placeholder="https://"></div><div class="field full"><label>Descrição</label><textarea name="descricao" rows="3">${esc(p.descricao||'')}</textarea></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-cancel>Cancelar</button><button class="btn">Salvar produto</button></div></form>`;openModal();$$('[data-cancel]').forEach(b=>b.onclick=closeModal);$('#product-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const product={...p,nome:f.nome.trim(),preco:Number(f.preco),precoAntigo:Number(f.precoAntigo)||0,categoria:f.categoria.trim(),estoque:Number(f.estoque),tamanhos:f.tamanhos.split(',').map(s=>s.trim()).filter(Boolean),imagem:f.imagem.trim(),descricao:f.descricao.trim()};if(!product.tamanhos.length)product.tamanhos=['Único'];if(index===null){product.id=product.id||'PRD-'+Date.now().toString(36).toUpperCase();products.push(product)}else products[index]=product;save();closeModal();notice('Produto salvo');render()}}
  function editCoupon(){const coupons=site.cupons||[];$('#modalbox').innerHTML=`<div class="modal-head"><h2>Novo cupom</h2><button class="x" data-cancel aria-label="Fechar">×</button></div><form id="coupon-form"><div class="form-grid"><div class="field full"><label>Código do cupom</label><input name="codigo" required placeholder="MAUY10" maxlength="24"></div><div class="field"><label>Tipo de desconto</label><select name="tipo"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select></div><div class="field"><label>Valor</label><input name="valor" type="number" min="0.01" step="0.01" required></div><div class="field full"><label>Pedido mínimo (R$)</label><input name="minimo" type="number" min="0" step="0.01" value="0"></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-cancel>Cancelar</button><button class="btn">Criar cupom</button></div></form>`;openModal();$$('[data-cancel]').forEach(b=>b.onclick=closeModal);$('#coupon-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),code=f.codigo.trim().toUpperCase();if(coupons.some(c=>String(c.codigo).toUpperCase()===code)){notice('Esse código já existe');return}if(f.tipo==='percentual'&&Number(f.valor)>100){notice('O percentual máximo é 100%');return}site.cupons=[...coupons,{codigo:code,tipo:f.tipo,valor:Number(f.valor),minimo:Number(f.minimo)||0,ativo:true}];save();closeModal();notice('Cupom criado');render()}}
  function openModal(){$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  (async()=>{try{const [sr,pr]=await Promise.all([fetch('../site.json'),fetch('../produtos.json')]);if(!sr.ok||!pr.ok)throw Error('Arquivos JSON indisponíveis');const [baseSite,baseProducts]=await Promise.all([sr.json(),pr.json()]);site=local.get(keys.site,baseSite);products=local.get(keys.products,baseProducts);orders=local.get(keys.orders,[]);render()}catch(error){console.error(error);$('#view').innerHTML=`<section class="panel"><h1 style="font:500 32px var(--serif);color:var(--wine)">Não foi possível carregar o painel</h1><p class="muted">Confira se <code>site.json</code> e <code>produtos.json</code> estão na raiz do site.</p><a class="btn secondary" href="../cliente/">Voltar à loja</a></section>`}})();
  </script>
</body>
</html>
