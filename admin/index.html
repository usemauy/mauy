<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#59283B">
  <title>Painel MAUY · Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#59283b;--wine2:#713c51;--sand:#f5f1eb;--ink:#29292b;--nude:#c5a99a;--pale:#e9ddd3;--white:#fff;--muted:#817779;--green:#327b5b;--red:#a94446;--shadow:0 12px 35px #351b2510;--font:'Poppins',sans-serif}*{box-sizing:border-box;font-family:var(--font)}body{margin:0;background:#f8f6f3;color:var(--ink);font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:linear-gradient(160deg,#59283b,#3e1b2b);color:white;padding:28px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{color:#fff;text-decoration:none;font-size:25px;letter-spacing:.18em;font-weight:700;padding:0 12px}.brand small{display:block;color:#d9b8a8;letter-spacing:.19em;font-size:8px;margin-top:3px}.side-label{margin:44px 12px 12px;color:#d9c7c3;font-size:9px;letter-spacing:.17em;text-transform:uppercase}.nav{display:grid;gap:6px}.tab{border:0;background:transparent;color:#f5f1ebc9;text-align:left;padding:12px 14px;border-radius:10px;font-size:12px;transition:.18s}.tab:hover,.tab.on{background:#ffffff1a;color:white}.tab.on{box-shadow:inset 3px 0 #c5a99a}.side-bottom{margin-top:auto;border-top:1px solid #ffffff24;padding:18px 10px 0;color:#f5f1ebaa;font-size:10px}.store-link{display:block;color:white;text-decoration:none;padding:10px 0;font-size:12px}.main{min-width:0;padding:24px clamp(18px,4vw,58px) 60px}.content{max-width:1280px;margin:auto}.topline{height:44px;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.crumb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9a8176}.status{border:1px solid var(--pale);background:white;border-radius:30px;padding:8px 13px;color:var(--muted);font-size:10px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:23px}.heading h1{font-size:clamp(27px,3vw,38px);font-weight:500;line-height:1.2;color:var(--wine);margin:3px 0}.heading p{font-size:12px;color:var(--muted);margin:6px 0 0}.btn{border:0;border-radius:9px;background:var(--wine);color:#fff;padding:11px 17px;font-size:11px;font-weight:600;transition:.18s}.btn:hover{background:#44202e;transform:translateY(-1px)}.btn.secondary{border:1px solid var(--wine);background:transparent;color:var(--wine)}.btn.secondary:hover{background:var(--pale)}.btn.danger{border:1px solid #edcdce;background:#fff;color:var(--red)}.btn.small{padding:7px 10px;font-size:10px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 22px}.stat{background:white;border:1px solid #eee8e2;border-radius:13px;padding:18px 19px;box-shadow:var(--shadow)}.stat span{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.stat strong{display:block;font-size:24px;font-weight:500;color:var(--wine);margin-top:5px}.panel{background:white;border:1px solid #eee8e2;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-title h2{font-size:17px;font-weight:500;color:var(--wine);margin:0}.panel-title .muted{font-size:10px}.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:210px;flex:1}.search input{width:100%}.field input,.field select,.field textarea,.search input{width:100%;border:1px solid #e6ddd6;background:white;padding:10px 11px;border-radius:8px;outline:0;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:var(--wine);box-shadow:0 0 0 3px #59283b12}.field textarea{resize:vertical;min-height:84px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#998a88;padding:11px;border-bottom:1px solid var(--pale)}td{padding:11px;border-bottom:1px solid #f0e9e5;font-size:11px;vertical-align:middle}tr:last-child td{border-bottom:0}.prod-cell{display:flex;align-items:center;gap:11px;min-width:210px}.thumb{width:45px;height:53px;object-fit:cover;background:var(--pale);border-radius:6px;flex:none}.thumb-video{width:45px;height:53px;background:#23171b;color:white;display:grid;place-items:center;border-radius:6px}.prod-cell b{font-weight:500;font-size:11px}.prod-cell small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#f3ece8;color:var(--wine);font-size:9px;white-space:nowrap}.pill.green{background:#e8f4ec;color:var(--green)}.color-dots{display:flex;gap:4px}.color-dots i{width:13px;height:13px;border:1px solid #0002;border-radius:50%}.text-btn{border:0;background:none;color:var(--wine);padding:4px;font-size:10px;text-decoration:underline}.text-btn.delete{color:var(--red)}.notice{background:#faf6f2;border-left:3px solid var(--nude);padding:13px 15px;border-radius:0 8px 8px 0;font-size:11px;color:#65595d;margin:0 0 17px}.empty{padding:38px;text-align:center;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;z-index:10;background:#21171bbd;display:none;place-items:center;padding:18px;overflow:auto}.modal.open{display:grid}.modal-box{width:min(900px,100%);max-height:min(92vh,950px);overflow:auto;background:var(--sand);padding:27px;border-radius:16px;box-shadow:0 25px 90px #130a0d55}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.modal-head h2{font-size:23px;font-weight:500;color:var(--wine);margin:0}.modal-head p{margin:4px 0;color:var(--muted);font-size:11px}.x{border:0;background:none;color:var(--wine);font-size:26px;line-height:1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#756b6c;font-weight:600}.hint{font-size:10px;color:var(--muted);line-height:1.5}.media-section{border:1px solid #e8ddd6;background:#fff;padding:15px;border-radius:10px}.media-section h3{margin:0 0 4px;color:var(--wine);font-size:13px;font-weight:500}.upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.upload-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none}.upload-label{display:inline-flex;align-items:center;border:1px dashed var(--nude);border-radius:8px;padding:10px 13px;color:var(--wine);font-size:11px;cursor:pointer;background:#fbf9f7}.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px;margin-top:12px}.media-item{position:relative;min-width:0;border:1px solid #eee5df;border-radius:8px;overflow:hidden;background:var(--sand)}.media-item img,.media-item video{width:100%;height:105px;display:block;object-fit:cover;background:#251a1d}.media-item .media-name{display:block;padding:5px 6px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-item .remove-media{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:23px;height:23px;background:#21171bd9;color:white;font-size:14px}.video-duration{width:110px!important}.color-entry{display:grid;grid-template-columns:1fr 54px 30px;gap:7px;align-items:center;margin:7px 0}.color-entry input[type=color]{height:38px;padding:4px}.color-entry button{border:0;background:none;color:var(--red);font-size:18px}.color-list{margin-top:8px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:11px;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:14px 18px}.brand{font-size:21px}.brand small{display:inline-block;margin-left:8px}.side-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.tab{white-space:nowrap;padding:9px 13px}.main{padding:20px 18px 40px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.heading{align-items:flex-start;flex-direction:column}.heading .btn{width:100%}.topline{margin-bottom:20px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:20px}.panel{padding:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal-box{padding:18px}.status{font-size:9px;padding:7px 9px}.main{padding-inline:13px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"><a class="brand" href="../cliente/">MAUY<small>PAINEL ADMINISTRATIVO</small></a><p class="side-label">Gerenciamento da loja</p><nav class="nav"><button class="tab on" data-tab="prod">Produtos</button><button class="tab" data-tab="cup">Cupons</button><button class="tab" data-tab="ped">Pedidos</button><button class="tab" data-tab="dados">Dados e publicação</button></nav><div class="side-bottom"><p>MAUY Fitness · administração</p><a class="store-link" href="../cliente/">← Ver loja</a></div></aside>
    <main class="main"><div class="content"><div class="topline"><span class="crumb">MAUY · Administração</span><span class="status" id="save-status">Alterações locais neste navegador</span></div><div id="view"><p class="muted">Carregando painel…</p></div></div></main>
  </div>
  <div class="modal" id="modal"><div class="modal-box" id="modalbox"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const keys={products:'mauy_produtos',site:'mauy_site',orders:'mauy_pedidos'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const local={get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
  let products=[],site={},orders=[],tab='prod',mediaDraft={images:[],video:null},colorDraft=[];
  function notice(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.classList.remove('show'),3000)}
  function save(){try{local.set(keys.products,products);local.set(keys.site,site);local.set(keys.orders,orders);$('#save-status').textContent='Salvo neste navegador · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return true}catch(e){console.error(e);notice('Armazenamento cheio. Reduza o tamanho dos vídeos/imagens e tente novamente.');return false}}
  function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
  function heading(title,subtitle,extra=''){return `<div class="heading"><div><p class="crumb">MAUY · ADMINISTRAÇÃO</p><h1>${title}</h1><p>${subtitle}</p></div>${extra}</div>`}
  function imageFor(p){return p.imagem||(Array.isArray(p.fotos)?p.fotos[0]:'')||''}
  function productView(){const stock=products.reduce((n,p)=>n+Number(p.estoque||0),0),value=products.reduce((n,p)=>n+Number(p.preco||0)*Number(p.estoque||0),0);return heading('Produtos','Gerencie seu catálogo, variações, imagens e vídeos.',`<button id="new-product" class="btn">＋ Novo produto</button>`)+`<div class="stats"><div class="stat"><span>Produtos no catálogo</span><strong>${products.length}</strong></div><div class="stat"><span>Unidades em estoque</span><strong>${stock}</strong></div><div class="stat"><span>Valor em estoque</span><strong>${brl(value)}</strong></div><div class="stat"><span>Com mídia cadastrada</span><strong>${products.filter(p=>imageFor(p)||p.video).length}</strong></div></div><section class="panel"><div class="panel-title"><h2>Catálogo</h2><span class="muted">${products.length} itens</span></div><div class="toolbar"><div class="search"><input id="product-search" type="search" placeholder="Buscar por nome ou categoria…" aria-label="Buscar produtos"></div><button id="new-product-alt" class="btn secondary">＋ Cadastrar produto</button></div><div id="product-table"></div></section>`}
  function renderTable(filter=''){const filtered=products.map((p,i)=>({...p,_index:i})).filter(p=>`${p.nome} ${p.categoria}`.toLowerCase().includes(filter.toLowerCase()));$('#product-table').innerHTML=filtered.length?`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Variações</th><th>Estoque</th><th>Preço</th><th>Ativo</th><th></th></tr></thead><tbody>${filtered.map(p=>`<tr><td><div class="prod-cell">${imageFor(p)?`<img class="thumb" src="${esc(imageFor(p))}" alt="">`:(p.video?'<span class="thumb-video">▶</span>':'<span class="thumb"></span>')}<div><b>${esc(p.nome||'Produto sem nome')}</b><small>${(p.fotos||[]).length||(+!!imageFor(p))} imagem(ns) · ${p.video?'vídeo':'sem vídeo'}</small></div></div></td><td>${esc(p.categoria||'—')}</td><td><span class="pill">${(p.cores||[]).length} cor(es)</span></td><td>${Number(p.estoque||0)}</td><td>${brl(p.preco)}</td><td><span class="pill ${p.ativo===false?'':'green'}">${p.ativo===false?'Inativo':'Ativo'}</span></td><td style="text-align:right;white-space:nowrap"><button class="text-btn" data-edit="${p._index}">Editar</button><button class="text-btn delete" data-delete="${p._index}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum produto encontrado. Cadastre seu primeiro item para começar.</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.edit)));$$('[data-delete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.delete);if(confirm(`Excluir “${products[i].nome}” do catálogo?`)){products.splice(i,1);if(save()){notice('Produto removido');render()}}})}
  function couponView(){const coupons=site.cupons||[];return heading('Cupons','Crie e controle ofertas para seus clientes.',`<button id="new-coupon" class="btn">＋ Novo cupom</button>`)+`<section class="panel"><div class="panel-title"><h2>Cupons ativos e inativos</h2><span class="muted">${coupons.length} cupons</span></div>${coupons.length?`<div class="table-wrap"><table style="min-width:570px"><thead><tr><th>Código</th><th>Desconto</th><th>Pedido mínimo</th><th>Status</th><th></th></tr></thead><tbody>${coupons.map((c,i)=>`<tr><td><b>${esc(c.codigo)}</b></td><td>${c.tipo==='percentual'?`${Number(c.valor)}%`:brl(c.valor)}</td><td>${brl(c.minimo)}</td><td><span class="pill ${c.ativo?'green':'off'}">${c.ativo?'Ativo':'Inativo'}</span></td><td style="text-align:right"><button class="text-btn" data-toggle-coupon="${i}">${c.ativo?'Desativar':'Ativar'}</button><button class="text-btn delete" data-delete-coupon="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum cupom cadastrado.</div>'}</section>`}
  function ordersView(){return heading('Pedidos','Acompanhe os pedidos registrados localmente.')+`<div class="notice">O checkout atual da loja direciona os pedidos pelo WhatsApp. Ele não grava nem sincroniza pedidos em um servidor; esta lista só mostra registros locais, se houver.</div><section class="panel"><div class="panel-title"><h2>Pedidos locais</h2><span class="muted">${orders.length} pedidos</span></div>${orders.length?orders.map((o,i)=>`<div style="padding:13px 0;border-top:1px solid var(--pale)"><b>Pedido ${i+1} · ${brl(o.total)}</b><p class="muted" style="margin:5px 0">${esc(o.cliente||'Cliente')} · ${esc(o.data||'')}</p></div>`).join(''):'<div class="empty">Nenhum pedido registrado neste navegador.</div>'}</section>`}
  function dataView(){return heading('Dados e publicação','Exporte o catálogo e as configurações para publicar suas alterações.')+`<div class="notice"><b style="color:var(--wine)">Como funciona:</b> o painel grava as alterações no armazenamento deste navegador. Para atualizar a loja publicada, baixe os JSON abaixo e substitua os arquivos correspondentes no repositório. As imagens e vídeos carregados ficam incorporados aos dados exportados; arquivos grandes podem gerar JSON volumosos.</div><section class="panel"><div class="panel-title"><h2>Exportar dados da loja</h2></div><p class="muted">Baixe os arquivos atualizados para publicar seu catálogo e configurações.</p><div class="toolbar"><button id="export-products" class="btn">Baixar produtos.json</button><button id="export-site" class="btn secondary">Baixar site.json</button></div></section><section class="panel"><div class="panel-title"><h2>Configurações da loja</h2></div><form id="settings-form" class="form-grid"><div class="field"><label>Nome da loja</label><input name="nome" value="${esc(site.nome||'MAUY')}" required></div><div class="field"><label>WhatsApp com DDI e DDD</label><input name="whatsapp" value="${esc(site.whatsapp||'')}" placeholder="5547999999999"></div><div class="field"><label>Frete grátis a partir de (R$)</label><input name="frete" type="number" min="0" step="0.01" value="${Number(site.frete?.gratisAcima||400)}"></div><div class="field"><label>Cor principal da marca</label><input name="wine" type="color" value="${esc(site.tema?.wine||'#59283B')}" style="height:42px;padding:4px"></div><div class="field full"><button class="btn" type="submit">Salvar configurações</button></div></form></section><section class="panel"><div class="panel-title"><h2>Restaurar dados originais</h2></div><p class="muted">Apaga os dados salvos localmente e recarrega os arquivos publicados.</p><button id="reset" class="btn danger">Restaurar dados publicados</button></section>`}
  function render(){ $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#view').innerHTML=({prod:productView,cup:couponView,ped:ordersView,dados:dataView})[tab]();$('#new-product')?.addEventListener('click',()=>editProduct());$('#new-product-alt')?.addEventListener('click',()=>editProduct());if($('#product-table'))renderTable();$('#product-search')?.addEventListener('input',e=>renderTable(e.target.value));$('#new-coupon')?.addEventListener('click',editCoupon);$$('[data-toggle-coupon]').forEach(b=>b.onclick=()=>{const c=site.cupons[Number(b.dataset.toggleCoupon)];c.ativo=!c.ativo;save();render()});$$('[data-delete-coupon]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.deleteCoupon);if(confirm(`Excluir cupom ${site.cupons[i].codigo}?`)){site.cupons.splice(i,1);save();render()}});$('#export-products')?.addEventListener('click',()=>download('produtos.json',products));$('#export-site')?.addEventListener('click',()=>download('site.json',site));$('#reset')?.addEventListener('click',resetData);$('#settings-form')?.addEventListener('submit',saveSettings)}
  function setMediaDraft(p){mediaDraft.images=Array.isArray(p.fotos)&&p.fotos.length?p.fotos.map(x=>typeof x==='string'?{src:x,name:'Imagem do produto'}:{src:x.src||x.url,name:x.nome||x.name||'Imagem'}):p.imagem?[{src:p.imagem,name:'Imagem principal'}]:[];mediaDraft.video=p.video?(typeof p.video==='string'?{src:p.video,name:'Vídeo do produto',duration:p.videoDuracao||0}:{src:p.video.src||p.video.url,name:p.video.nome||p.video.name||'Vídeo',duration:Number(p.video.duracao||p.video.duration||0)}):null;colorDraft=Array.isArray(p.cores)?p.cores.map(c=>typeof c==='string'?{nome:c,hex:'#59283B'}:{nome:c.nome||'',hex:c.hex||'#59283B'}):[]}
  function renderMedia(){const list=$('#media-list');if(!list)return;list.innerHTML=mediaDraft.images.map((m,i)=>`<div class="media-item"><img src="${esc(m.src)}" alt="${esc(m.name)}"><button type="button" class="remove-media" data-remove-image="${i}" aria-label="Remover imagem">×</button><span class="media-name">${esc(m.name)}${i===0?' · Principal':''}</span></div>`).join('')+(mediaDraft.video?`<div class="media-item"><video src="${esc(mediaDraft.video.src)}" controls muted playsinline></video><button type="button" class="remove-media" id="remove-video" aria-label="Remover vídeo">×</button><span class="media-name">▶ ${esc(mediaDraft.video.name)} · ${Number(mediaDraft.video.duration).toFixed(1)}s</span></div>`:'');$$('[data-remove-image]').forEach(b=>b.onclick=()=>{mediaDraft.images.splice(Number(b.dataset.removeImage),1);renderMedia()});$('#remove-video')?.addEventListener('click',()=>{mediaDraft.video=null;renderMedia()})}
  function renderColors(){const box=$('#color-list');if(!box)return;box.innerHTML=colorDraft.map((c,i)=>`<div class="color-entry"><input data-color-name="${i}" value="${esc(c.nome)}" placeholder="Ex.: Vinho" aria-label="Nome da cor"><input type="color" data-color-hex="${i}" value="${esc(c.hex)}" aria-label="Selecionar cor"><button type="button" data-remove-color="${i}" aria-label="Remover cor">×</button></div>`).join('');$$('[data-color-name]').forEach(el=>el.oninput=()=>colorDraft[Number(el.dataset.colorName)].nome=el.value);$$('[data-color-hex]').forEach(el=>el.oninput=()=>colorDraft[Number(el.dataset.colorHex)].hex=el.value);$$('[data-remove-color]').forEach(el=>el.onclick=()=>{colorDraft.splice(Number(el.dataset.removeColor),1);renderColors()})}
  function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error(`Falha ao ler ${file.name}`));reader.readAsDataURL(file)})}
  function validImage(file){return /\.(jpe?g|png)$/i.test(file.name)||['image/jpeg','image/png'].includes(file.type)}
  function validVideo(file){return /\.(mov|mp4|avi)$/i.test(file.name)||['video/quicktime','video/mp4','video/x-msvideo','video/avi'].includes(file.type)}
  function getDuration(src){return new Promise(resolve=>{const video=document.createElement('video');video.preload='metadata';video.muted=true;video.onloadedmetadata=()=>{const d=video.duration;URL.revokeObjectURL(video.src);resolve(Number.isFinite(d)?d:null)};video.onerror=()=>{URL.revokeObjectURL(video.src);resolve(null)};video.src=src})}
  async function addImages(files){const selected=[...files];if(mediaDraft.images.length+selected.length>8){notice('O limite é de 8 imagens por produto.');return}for(const file of selected){if(!validImage(file)){notice(`${file.name}: use JPEG, JPG ou PNG.`);continue}try{mediaDraft.images.push({src:await readFile(file),name:file.name})}catch(e){notice(e.message)}}renderMedia()}
  async function addVideo(file){if(!file)return;if(!validVideo(file)){notice('Formato de vídeo inválido. Use MOV, MP4 ou AVI.');return}const src=await readFile(file);let duration=await getDuration(URL.createObjectURL(file));if(duration===null){const entered=prompt('Este navegador não conseguiu ler a duração deste arquivo. Informe a duração em segundos (máximo 20).');duration=Number(entered);if(!entered||!Number.isFinite(duration)||duration<=0||duration>20){notice('Vídeo não adicionado: a duração deve ser de até 20 segundos.');return}}if(duration>20){notice('Vídeo não adicionado: o limite é 20 segundos.');return}mediaDraft.video={src,name:file.name,duration};renderMedia();notice('Vídeo validado e adicionado')}
  function editProduct(index=null){const p=index===null?{nome:'',preco:'',precoAntigo:'',categoria:'Feminina',estoque:0,tamanhos:['P','M','G'],imagem:'',descricao:'',cores:[],ativo:true}:{...products[index]};setMediaDraft(p);$('#modalbox').innerHTML=`<div class="modal-head"><div><h2>${index===null?'Novo produto':'Editar produto'}</h2><p>Preencha os detalhes e prepare a mídia da vitrine.</p></div><button class="x" data-cancel aria-label="Fechar">×</button></div><form id="product-form"><div class="form-grid"><div class="field full"><label>Nome do produto *</label><input name="nome" required maxlength="100" value="${esc(p.nome)}" placeholder="Ex.: Legging Sculpt Cintura Alta"></div><div class="field"><label>Preço atual (R$) *</label><input name="preco" type="number" min="0" step="0.01" required value="${Number(p.preco)||''}"></div><div class="field"><label>Preço anterior (opcional)</label><input name="precoAntigo" type="number" min="0" step="0.01" value="${Number(p.precoAntigo)||''}"></div><div class="field"><label>Categoria *</label><input name="categoria" list="categories" required value="${esc(p.categoria||'Feminina')}" placeholder="Feminina, Masculina…"><datalist id="categories"><option>Feminina</option><option>Masculina</option><option>Acessórios</option></datalist></div><div class="field"><label>Estoque disponível *</label><input name="estoque" type="number" min="0" step="1" required value="${Number(p.estoque)||0}"></div><div class="field full"><label>Tamanhos / variações (separe por vírgula)</label><input name="tamanhos" value="${esc((p.tamanhos||['Único']).join(', '))}" placeholder="P, M, G, GG ou Único"><span class="hint">Para produtos sem tamanho, use “Único”.</span></div><div class="field full"><label>Cores disponíveis</label><div class="media-section"><h3>Variações de cor</h3><span class="hint">Informe o nome e selecione a cor correspondente.</span><div class="color-list" id="color-list"></div><button type="button" class="btn secondary small" id="add-color" style="margin-top:8px">＋ Adicionar cor</button></div></div><div class="field full"><label>Fotos e vídeo do produto</label><div class="media-section"><h3>Galeria de mídia</h3><span class="hint">Até 8 imagens JPEG/JPG/PNG e 1 vídeo MOV/MP4/AVI de até 20 segundos. A primeira imagem será a capa. Arquivos ficam incorporados ao JSON exportado; vídeos grandes podem exceder o espaço disponível do navegador.</span><div class="upload-row"><label class="upload-label" for="image-files">＋ Selecionar imagens</label><input class="upload-input" id="image-files" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple><label class="upload-label" for="video-file">▶ Selecionar vídeo</label><input class="upload-input" id="video-file" type="file" accept=".mov,.mp4,.avi,video/quicktime,video/mp4,video/x-msvideo"></div><div class="media-list" id="media-list"></div></div></div><div class="field full"><label>Descrição do produto</label><textarea name="descricao" rows="3" maxlength="1200" placeholder="Descreva tecido, caimento e benefícios…">${esc(p.descricao||'')}</textarea></div><div class="field full"><label><span><input name="ativo" type="checkbox" ${p.ativo===false?'':'checked'} style="width:auto;vertical-align:middle"> Exibir produto na loja</span></label></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-cancel>Cancelar</button><button type="submit" class="btn">Salvar produto</button></div></form>`;$('#modal').classList.add('open');$$('[data-cancel]').forEach(b=>b.onclick=closeModal);$('#image-files').onchange=e=>{addImages(e.target.files);e.target.value=''};$('#video-file').onchange=e=>{addVideo(e.target.files[0]);e.target.value=''};$('#add-color').onclick=()=>{colorDraft.push({nome:'',hex:'#59283B'});renderColors()};renderColors();renderMedia();$('#product-form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const sizes=String(f.tamanhos||'Único').split(',').map(s=>s.trim()).filter(Boolean);const cores=colorDraft.map(c=>({nome:c.nome.trim(),hex:c.hex})).filter(c=>c.nome);const next={...p,nome:f.nome.trim(),preco:Number(f.preco),precoAntigo:Number(f.precoAntigo)||0,categoria:f.categoria.trim(),estoque:Number(f.estoque),tamanhos:sizes.length?sizes:['Único'],cores,fotos:mediaDraft.images.map(x=>x.src),imagem:mediaDraft.images[0]?.src||'',video:mediaDraft.video?{src:mediaDraft.video.src,nome:mediaDraft.video.name,duracao:mediaDraft.video.duration}:null,descricao:String(f.descricao||'').trim(),ativo:!!e.target.elements.ativo.checked};if(index===null){next.id=next.id||`PRD-${Date.now().toString(36).toUpperCase()}`;products.push(next)}else products[index]=next;if(save()){closeModal();notice('Produto salvo. Exporte produtos.json para publicar.');render()}}}
  function editCoupon(){const coupons=site.cupons||[];$('#modalbox').innerHTML=`<div class="modal-head"><div><h2>Novo cupom</h2><p>Configure o benefício para seus clientes.</p></div><button class="x" data-cancel aria-label="Fechar">×</button></div><form id="coupon-form"><div class="form-grid"><div class="field full"><label>Código do cupom</label><input name="codigo" required maxlength="24" placeholder="MAUY10"></div><div class="field"><label>Tipo de desconto</label><select name="tipo"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select></div><div class="field"><label>Valor</label><input name="valor" type="number" min="0.01" step="0.01" required></div><div class="field full"><label>Pedido mínimo (R$)</label><input name="minimo" type="number" min="0" step="0.01" value="0"></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-cancel>Cancelar</button><button class="btn">Criar cupom</button></div></form>`;openModal();$$('[data-cancel]').forEach(b=>b.onclick=closeModal);$('#coupon-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),code=f.codigo.trim().toUpperCase();if(coupons.some(c=>String(c.codigo).toUpperCase()===code)){notice('Este código já existe.');return}if(f.tipo==='percentual'&&Number(f.valor)>100){notice('O desconto percentual máximo é 100%.');return}site.cupons=[...coupons,{codigo:code,tipo:f.tipo,valor:Number(f.valor),minimo:Number(f.minimo)||0,ativo:true}];if(save()){closeModal();notice('Cupom criado');render()}}}
  function openModal(){$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
  function saveSettings(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));site.nome=f.nome.trim();site.whatsapp=f.whatsapp.replace(/\D/g,'');site.frete={...(site.frete||{}),gratisAcima:Number(f.frete)||0};site.tema={...(site.tema||{}),wine:f.wine};if(save()){notice('Configurações salvas');render()}}
  async function resetData(){if(!confirm('Apagar as alterações locais e recarregar os arquivos JSON publicados?'))return;Object.values(keys).forEach(k=>localStorage.removeItem(k));location.reload()}
  $$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  (async()=>{try{const [sr,pr]=await Promise.all([fetch('../site.json'),fetch('../produtos.json')]);if(!sr.ok||!pr.ok)throw Error('Arquivos JSON indisponíveis');const [baseSite,baseProducts]=await Promise.all([sr.json(),pr.json()]);site=local.get(keys.site,baseSite);products=local.get(keys.products,baseProducts);orders=local.get(keys.orders,[]);render()}catch(error){console.error(error);$('#view').innerHTML='<section class="panel"><h1 style="color:var(--wine);font-weight:500">Não foi possível carregar o painel</h1><p class="muted">Confirme se <code>site.json</code> e <code>produtos.json</code> estão na raiz do site.</p><a class="btn secondary" href="../cliente/">Voltar à loja</a></section>'}})();
  </script>
