<style>
:root{--sand:#F5F1EB;--ink:#29292B;--nude:#C5A99A;--pale:#E9DDD3;--wine:#59283B;--ti:#59283B;--card:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--sand:#1c1819;--ink:#F5F1EB;--pale:#2a2325;--wine:#8A4660;--ti:#E9DDD3;--card:#252021;color-scheme:dark}.logo img.lg-l{display:none}.logo img.lg-d{display:block}}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,sans-serif}
body{background:var(--sand);color:var(--ink);line-height:1.55;font-size:14px}
a{color:inherit;text-decoration:none}button{cursor:pointer;color:inherit;background:none;border:0;font-size:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
.promo{background:var(--wine);color:#fff;text-align:center;padding:9px;font-size:11px;letter-spacing:.14em;font-weight:500}
header{position:sticky;top:0;z-index:10;background:var(--sand);border-bottom:1px solid var(--pale)}
.head{height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.logo img{height:50px;width:auto;display:block}.logo img.lg-d{display:none}
nav{display:flex;gap:18px;font-size:12px;white-space:nowrap}nav button{opacity:.8}nav button:hover{opacity:1}
.act{display:flex;gap:8px;justify-content:flex-end}
.ic{border:1px solid var(--pale);border-radius:99px;padding:7px 15px;font-size:13px}
.ic b{background:var(--wine);color:#fff;border-radius:99px;padding:0 7px;margin-left:5px;font-weight:500;font-size:12px}
.srch{display:none;padding-bottom:12px}.srch.on{display:block}
input,select,textarea{font:inherit;font-size:13px;padding:10px 14px;border:1px solid var(--nude);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.btn{display:inline-flex;justify-content:center;align-items:center;background:var(--wine);color:#fff;border-radius:30px;padding:13px 26px;font-size:12px;font-weight:600;letter-spacing:.08em;transition:opacity .2s}
.btn:hover{opacity:.88}.btn.l{background:var(--sand);color:#59283B;margin-top:22px}.btn.g{background:none;color:var(--ink);border:1px solid var(--nude)}.btn.s{padding:8px 16px;font-size:11px}
/* carrossel */
.car{position:relative;overflow:hidden;touch-action:pan-y}.trk{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}.trk>*{flex:0 0 100%;min-width:0}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#f5f1ebd9;color:#59283B;font-size:22px;z-index:3;display:grid;place-items:center}.ar.p{left:14px}.ar.n{right:14px}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}.dots button{width:9px;height:9px;border-radius:50%;background:#ffffff80;padding:0}.dots button.on{background:#fff;width:26px;border-radius:9px}
.sl{min-height:560px;display:flex;align-items:center;color:#fff;background:linear-gradient(120deg,#3e1b2b,var(--wine)) center/cover;position:relative}
.sl:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#211418c0,#21141815)}
.hc{position:relative;padding:70px 0}
.ey{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--nude);font-weight:600}
.sl h1{font-weight:600;font-size:clamp(34px,6vw,64px);line-height:1.12;max-width:700px;margin:12px 0 18px}.sl p.t{max-width:460px;opacity:.9}
.sec{padding:54px 0 10px}.sec h2,.bn h2{font-weight:600;font-size:clamp(24px,3vw,34px);color:var(--ti)}.sec p.d{opacity:.7;margin:4px 0 20px}
.gal{position:relative}.gs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}.gs::-webkit-scrollbar{display:none}
.gs figure{flex:0 0 clamp(220px,26vw,300px);scroll-snap-align:start;position:relative}
.gs .ph{aspect-ratio:4/5}.gs figcaption{position:absolute;inset:auto 0 0;padding:34px 14px 14px;color:#fff;background:linear-gradient(transparent,#171115c0);font-size:12px}
.gal .ar{background:#f5f1ee}
.fl{display:flex;gap:9px;overflow:auto;padding:6px 0 20px}.fl button{white-space:nowrap;border:1px solid var(--nude);border-radius:30px;padding:8px 18px;font-size:12px;color:var(--ti)}.fl button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 20px;padding:6px 0 76px}
.card{text-align:left;min-width:0}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,var(--pale),color-mix(in srgb,var(--nude) 55%,var(--pale)));position:relative;overflow:hidden;display:grid;place-items:center}

.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s;position:absolute;inset:0}.card:hover .ph img{transform:scale(1.04)}
.tag{position:absolute;left:12px;top:12px;background:var(--wine);color:#fff;padding:4px 10px;border-radius:22px;font-size:10px;letter-spacing:.08em;z-index:1}
.card h3{font-size:14px;font-weight:500;margin:12px 0 2px}.pr{color:var(--ti);font-weight:600}.old{text-decoration:line-through;opacity:.55;font-weight:400;margin-right:8px;font-size:12px}.px{font-size:12px;opacity:.7;font-weight:400}
.empty{grid-column:1/-1;text-align:center;padding:48px;opacity:.7}
.bn{text-align:center;background:var(--pale);padding:48px 20px;margin-bottom:70px}.bn p{opacity:.75;margin:8px 0 20px}
footer{background:#29292B;color:#F5F1EB;padding:44px 0 22px}.fi{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.fi p{font-size:12px;max-width:320px;opacity:.75}.fi a,.fi button{display:block;font-size:12px;margin:7px 0}.fi img{height:56px}
.cp{text-align:center;border-top:1px solid #ffffff22;margin-top:32px;padding-top:18px;font-size:10px;opacity:.6}
.sh{position:fixed;inset:0;background:#19121480;z-index:30;display:none}.sh.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--sand);z-index:31;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column}.dr.on{transform:none}
.dh{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--pale);font-weight:600;font-size:20px;color:var(--ti)}
.db{flex:1;overflow:auto;padding:8px 22px}.df{padding:16px 22px 22px;background:var(--card);font-size:13px}
.bar{height:5px;background:var(--pale);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--wine);transition:width .4s}
.ln{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--pale);font-size:13px}
.q{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--nude);border-radius:99px;margin-top:6px}.q button{width:26px;height:26px}
.rw{display:flex;gap:8px;margin-top:9px}.rw .btn{padding:0 16px;white-space:nowrap}.ms{font-size:12px;min-height:18px;margin-top:4px}
.sm div{display:flex;justify-content:space-between;padding:2px 0}.sm .t{font-weight:700;font-size:16px;border-top:1px solid var(--nude);margin-top:6px;padding-top:8px}
.pix{background:var(--pale);border-left:3px solid var(--nude);padding:9px 12px;font-size:12px;margin:10px 0;border-radius:3px}
.md{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:#19121480}.md.on{display:grid}
.mb{position:relative;background:var(--sand);width:min(840px,100%);max-height:92dvh;overflow:auto;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mb .car .ar{width:34px;height:34px;font-size:18px}.mb .dots{bottom:10px}
.mb h2{font-weight:600;font-size:26px;color:var(--ti)}.x{position:absolute;right:14px;top:8px;font-size:26px;z-index:4}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 22px}.pl button{min-width:44px;padding:7px 14px;border:1px solid var(--nude);border-radius:99px}.pl button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--nude);font-size:12px;margin-top:22px}.tabs button{padding:7px 0;opacity:.6}.tabs button.on{opacity:1;border-bottom:2px solid var(--wine);font-weight:600}.tc{padding:12px 0;font-size:13px}
.toast{position:fixed;z-index:80;bottom:20px;left:50%;transform:translateX(-50%);background:#29292B;color:#fff;padding:10px 20px;border-radius:30px;font-size:12px}
/* admin */
#adm{position:fixed;inset:0;z-index:60;background:var(--sand);overflow:auto}
.at{position:sticky;top:0;background:var(--sand);border-bottom:1px solid var(--pale);padding:12px 5vw;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}.at img{height:30px}.at strong{margin-right:auto;font-size:15px;color:var(--ti)}
.am{max-width:900px;margin:auto;padding:22px 5vw 80px}
.ta{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}.ta button{border:1px solid var(--nude);border-radius:30px;padding:8px 18px;font-size:12px}.ta button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.bx{background:var(--card);border:1px solid var(--pale);border-radius:12px;padding:18px;margin-bottom:16px}.bx h3{font-size:14px;margin-bottom:12px;color:var(--ti)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.f{display:block;font-size:11px;font-weight:500}.f input,.f textarea{margin-top:4px;font-weight:400}.f.w{grid-column:1/-1}.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.hint{font-size:12px;opacity:.75;margin-bottom:12px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs span{position:relative}.thumbs img{width:56px;height:70px;object-fit:cover;border-radius:6px}.thumbs button{position:absolute;top:-6px;right:-6px;background:var(--wine);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.mb{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.head{grid-template-columns:1fr auto;height:68px}.logo img{height:42px}nav{display:none}.fg{grid-template-columns:1fr}.sl{min-height:460px}.ar{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.sl.hi{background:var(--d) center/cover}
@media(max-width:560px){.sl.hi{background:var(--m,var(--d)) center/cover}}
.ben{background:var(--wine);color:#fff;padding:12px 0;font-size:12px;margin-top:30px}
.ben .wrap{display:flex;gap:10px 28px;flex-wrap:wrap;justify-content:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dv{display:flex;align-items:end;min-height:260px;padding:20px;color:#fff;font-weight:600;font-size:20px;background:var(--pale) center/cover;border-radius:4px;text-shadow:0 1px 8px #0008}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.dep{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.dep div{background:var(--card);padding:18px;border-radius:10px}
@media(max-width:560px){.duo{grid-template-columns:1fr}}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=JSON.parse($('#dados-padrao').textContent);
const S={cat:'Todos',q:'',cart:[],cup:0,frete:null,pid:null,sz:null,tab:0,ci:0},TM={};
try{S.cart=JSON.parse(localStorage.getItem('mauy_cart'))||[]}catch(e){}
const keep=()=>{try{localStorage.setItem('mauy_cart',JSON.stringify(S.cart))}catch(e){}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const prods=()=>D.produtos.filter(p=>p.ativo!==false);
const url=u=>String(u||'').replace(/["'\\()]/g,'');
const photo=(p,tag)=>{const im=(p.imagens||[])[0];return `<div class="ph${im?'':' ne'}">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.nome)}">`:''}${tag&&p.precoAntigo>p.preco?'<span class="tag">Oferta</span>':''}</div>`};

/* ---------- carrossel genérico ---------- */
function car(root,key,auto){const t=root.querySelector('.trk'),n=t.children.length;let i=0;clearInterval(TM[key]);
const go=k=>{i=(k+n)%n;t.style.transform=`translateX(-${i*100}%)`;root.querySelectorAll('.dots button').forEach((d,x)=>d.classList.toggle('on',x==i))};
const run=()=>{clearInterval(TM[key]);if(auto&&n>1)TM[key]=setInterval(()=>{if(document.contains(root))go(i+1);else clearInterval(TM[key])},auto)};
root.querySelector('.p')?.addEventListener('click',()=>{go(i-1);run()});root.querySelector('.n')?.addEventListener('click',()=>{go(i+1);run()});
root.querySelectorAll('.dots button').forEach((d,x)=>d.onclick=()=>{go(x);run()});
let x0=null;root.addEventListener('pointerdown',e=>x0=e.clientX);root.addEventListener('pointerup',e=>{if(x0!=null&&Math.abs(e.clientX-x0)>45){go(i+(e.clientX<x0?1:-1));run()}x0=null});
go(0);run()}
const ctl=n=>n>1?`<button class="ar p" aria-label="Anterior">‹</button><button class="ar n" aria-label="Próximo">›</button><div class="dots">${Array.from({length:n},(_,i)=>`<button aria-label="Slide ${i+1}"></button>`).join('')}</div>`:'';

/* ---------- seções da home (vêm de D.layout) ---------- */
let SEC=[];
const LAY=()=>{const raw=(D.layout&&D.layout.length)?D.layout:[{tipo:'banner'},{tipo:'produtos',titulo:'A coleção',quantidade:0}];
return raw.filter(b=>b&&b.ativo!==false).map(b=>({...b,tipo:({destaques:'produtos',lookbook:'galeria'})[b.tipo]||b.tipo}))};
const emb=v=>{v=String(v||'').trim();let m=v.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return `<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;m=v.match(/vimeo\.com\/(\d+)/);if(m)return `<iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy"></iframe>`;return /^(https:|img\/|\.?\/)/.test(v)?`<video src="${esc(v)}" controls playsinline></video>`:''};
const nm=c=>c=='Feminina'?'Moda Feminina':c=='Masculina'?'Moda Masculina':c;

function hero(el,key){const B=D.banners.length?D.banners:[{titulo:'',texto:'',cta:'',imagem:''}];
el.innerHTML=`<div class="car"><div class="trk">${B.map(b=>`<div class="sl${b.imagem?' hi':''}" style="${b.imagem?`--d:url('${url(b.imagem)}');--m:url('${url(b.imagemMobile||b.imagem)}')`:''}"><div class="wrap hc"><p class="ey">MAUY Fitness · Nova coleção</p><h1>${esc(b.titulo)}</h1><p class="t">${esc(b.texto)}</p>${b.cta?`<a class="btn l" href="${esc(b.link||'#loja')}">${esc(b.cta)}</a>`:''}</div></div>`).join('')}</div>${ctl(B.length)}</div>`;
car(el.querySelector('.car'),key,+D.site.intervalo||6000)}

function gal(el,b){const G=(b.fotos||[]).filter(g=>g&&g.img);
el.innerHTML=`<button class="ar p" aria-label="Anterior">‹</button><div class="gs">${G.map(g=>`<figure><div class="ph"><img loading="lazy" src="${esc(g.img)}" alt="${esc(g.legenda)}"></div>${g.legenda?`<figcaption>${esc(g.legenda)}</figcaption>`:''}</figure>`).join('')}</div><button class="ar n" aria-label="Próximo">›</button>`;
const s=el.querySelector('.gs');el.querySelector('.p').onclick=()=>s.scrollBy({left:-s.clientWidth*.8,behavior:'smooth'});el.querySelector('.n').onclick=()=>s.scrollBy({left:s.clientWidth*.8,behavior:'smooth'})}

function secs(){SEC=LAY();let first=true;
$('#secs').innerHTML=SEC.map((b,i)=>{const H=b.titulo?`<h2>${esc(b.titulo)}</h2>`:'',ln=String(b.conteudo||'').split('\n').map(x=>x.trim()).filter(Boolean);
switch(b.tipo){
case 'banner':return `<section data-s="${i}"></section>`;
case 'galeria':return (b.fotos||[]).some(f=>f&&f.img)?`<section class="wrap sec" data-s="${i}">${H}<div class="gal"></div></section>`:'';
case 'produtos':{const id=first?' id="loja"':'';first=false;return `<section class="wrap sec"${id} data-pb="${i}">${H}<div class="fl"></div><div class="grid"></div></section>`}
case 'beneficios':return `<div class="ben"><div class="wrap">${ln.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`;
case 'bannerDuplo':return `<section class="wrap sec">${H}<div class="duo">${[1,2].map(n=>b['imagem'+n]?`<a class="dv" href="${esc(b['link'+n]||'#loja')}" style="background-image:url('${url(b['imagem'+n])}')">${esc(b['titulo'+n]||'')}</a>`:'').join('')}</div></section>`;
case 'video':{const v=emb(b.conteudo);return v?`<section class="wrap sec">${H}<div class="vid">${v}</div></section>`:''}
case 'depoimentos':return ln.length?`<section class="wrap sec">${H}<div class="dep">${ln.map(x=>{const[n,...t]=x.split('|');return `<div><p>“${esc(t.length?t.join('|'):n)}”</p><b>${t.length?esc(n):''}</b></div>`}).join('')}</div></section>`:'';
default:return ''}}).join('');
SEC.forEach((b,i)=>{const el=document.querySelector(`[data-s="${i}"]`);if(!el)return;if(b.tipo=='banner')hero(el,'hero'+i);if(b.tipo=='galeria')gal(el.querySelector('.gal'),b)})}

function head(){const s=D.site;$('#promo').textContent=s.aviso||'';$('#promo').hidden=!s.aviso;$('#fr').textContent=s.frase||'';$('#ft').textContent=s.rodape||'';$('#wl').href='https://wa.me/'+String(s.whatsapp).replace(/\D/g,'');const m=s.marca||{},root=document.documentElement;if(m.cor1){root.style.setProperty('--wine',m.cor1);root.style.setProperty('--ti',m.cor1)}if(m.cor2)root.style.setProperty('--nude',m.cor2);if(m.logoClaro){document.querySelectorAll('.logo img.lg-l,footer .fi img').forEach(i=>i.src=m.logoClaro)}if(m.logoEscuro)document.querySelectorAll('.logo img.lg-d').forEach(i=>i.src=m.logoEscuro);
const cats=[['Novidades','Novidades'],['Feminina','Moda Feminina'],['Masculina','Moda Masculina'],['Acessórios','Acessórios'],['Ofertas','Ofertas']];
$('#nav').innerHTML=cats.map(([c,label])=>`<button data-c="${esc(c)}">${esc(label)}</button>`).join('')}

function grid(){const all=prods(),cats=['Todos','Novidades','Feminina','Masculina','Acessórios','Ofertas'];
const isNew=p=>{const tags=(p.badges||[]).join(' ').toLowerCase();return /novidade|novo/.test(tags)||all.slice(-8).includes(p)};
const matches=p=>S.cat==='Todos'||(S.cat==='Novidades'?isNew(p):S.cat==='Ofertas'?p.precoAntigo>p.preco:p.categoria===S.cat);
document.querySelectorAll('[data-pb]').forEach(sec=>{const b=SEC[+sec.dataset.pb]||{},q=+b.quantidade||0;
sec.querySelector('.fl').innerHTML=q?'':cats.map(c=>`<button data-c="${esc(c)}" class="${c==S.cat?'on':''}">${esc(nm(c))}</button>`).join('');
let l=all.filter(p=>(q||matches(p))&&p.nome.toLowerCase().includes(S.q.toLowerCase()));if(q)l=l.slice(0,q);
sec.querySelector('.grid').innerHTML=l.length?l.map(p=>`<button class="card" data-p="${esc(p.id)}">${photo(p,1)}<h3>${esc(p.nome)}</h3><div class="pr">${p.precoAntigo>p.preco?`<span class="old">${brl(p.precoAntigo)}</span>`:''}${brl(p.preco)} <span class="px">· ${brl(p.preco*(1-D.site.pix/100))} no Pix</span></div></button>`).join(''):'<p class="empty">Nenhum produto encontrado.</p>'})}

function store(){$('#yr').textContent=new Date().getFullYear();head();secs();grid();cart()}
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){S.cat=c.dataset.c;head();grid();if(c.closest('nav'))$('#loja')?.scrollIntoView()}
const p=e.target.closest('[data-p]');if(p&&p.classList.contains('card'))openP(p.dataset.p)});
$('#sb').onclick=()=>{$('#sw').classList.toggle('on');$('#si').focus()};$('#si').oninput=e=>{S.q=e.target.value;grid()};

/* produto */
function openP(id){if(!D.produtos.find(x=>x.id==id))return;S.pid=id;S.sz=null;S.tab=0;S.ci=0;prodView();$('#md').classList.add('on');$('#sh').classList.add('on')}
function prodView(){const p=D.produtos.find(x=>x.id==S.pid),im=p.imagens||[],T=['Descrição','Guia de medidas','Trocas'];
const tc=[`<p>${esc(p.descricao)}</p>`,'<p>Consulte a tabela de medidas com o atendimento pelo WhatsApp antes de escolher o tamanho.</p>','<p>Troca garantida em até 7 dias após o recebimento, com a peça sem uso e com etiqueta.</p>'];
$('#mb').innerHTML=`<button class="x" data-close aria-label="Fechar">×</button>${im.length>1?`<div class="car" id="pcar"><div class="trk">${im.map(u=>`<div class="ph"><img src="${esc(u)}" alt="${esc(p.nome)}"></div>`).join('')}</div>${ctl(im.length)}</div>`:photo(p)}<div><p class="ey" style="color:var(--wine)">${esc(p.categoria)}</p><h2>${esc(p.nome)}</h2><div class="pr" style="font-size:20px;margin-top:4px">${p.precoAntigo>p.preco?`<span class="old">${brl(p.precoAntigo)}</span>`:''}${brl(p.preco)}</div><p style="font-size:12px;opacity:.75">${brl(p.preco*(1-D.site.pix/100))} no Pix · ${Math.max(1,+D.site.parcelas||3)}x de ${brl(p.preco/Math.max(1,+D.site.parcelas||3))} sem juros</p><p style="font-weight:500;margin-top:18px">Tamanho</p><div class="pl">${p.tamanhos.map(t=>`<button data-z="${esc(t)}" class="${t==S.sz?'on':''}">${esc(t)}</button>`).join('')}</div><button class="btn" style="width:100%" data-add>${S.sz?'Adicionar à sacola':'Escolha um tamanho'}</button><div class="tabs">${T.map((t,i)=>`<button data-t="${i}" class="${i==S.tab?'on':''}">${t}</button>`).join('')}</div><div class="tc">${tc[S.tab]}</div></div>`;
if(im.length>1){const r=$('#pcar');car(r,'prod',0);r.querySelectorAll('.dots button').forEach((d,x)=>d.addEventListener('click',()=>S.ci=x));r.querySelector('.p')?.addEventListener('click',()=>S.ci=(S.ci-1+im.length)%im.length);r.querySelector('.n')?.addEventListener('click',()=>S.ci=(S.ci+1)%im.length);if(S.ci)r.querySelectorAll('.dots button')[S.ci]?.click()}}
$('#mb').onclick=e=>{const t=e.target.closest('button');if(!t||t.closest('#pcar'))return;
if('close' in t.dataset)return shut();if(t.dataset.z)S.sz=t.dataset.z;else if(t.dataset.t)S.tab=+t.dataset.t;
else if('add' in t.dataset){if(!S.sz)return;const f=S.cart.find(i=>i.id==S.pid&&i.size==S.sz);f?f.qty++:S.cart.push({id:S.pid,size:S.sz,qty:1});keep();cart();shut();return openCart()}
prodView()};

/* sacola */
const lines=()=>S.cart.map(i=>({...i,p:D.produtos.find(x=>x.id==i.id)})).filter(i=>i.p);
const sub=()=>lines().reduce((s,i)=>s+i.p.preco*i.qty,0);
function cart(){const L=lines(),s=sub(),q=L.reduce((n,i)=>n+i.qty,0),free=+D.site.gratis||0;$('#cc').textContent=q;
$('#it').innerHTML=L.length?L.map((i,x)=>`<div class="ln">${photo(i.p)}<div><strong style="font-weight:500">${esc(i.p.nome)}</strong><br><span style="opacity:.7">Tam. ${esc(i.size)}</span><br><span class="q"><button data-q="${x}" data-d="-1" aria-label="Diminuir">−</button>${i.qty}<button data-q="${x}" data-d="1" aria-label="Aumentar">+</button></span></div><div>${brl(i.p.preco*i.qty)}</div></div>`).join(''):'<p class="empty" style="padding:30px 0">Sua sacola está vazia.</p>';
const d=s*S.cup,fr=S.frete==null?null:(s>=free?0:S.frete),tot=s-d+(fr||0);
$('#cf').innerHTML=`<div style="font-size:12px">${s==0?`Frete grátis acima de ${brl(free)}`:s>=free?'Você ganhou frete grátis':`Faltam ${brl(free-s)} para o frete grátis`}</div><div class="bar"><i style="width:${Math.min(100,free?s/free*100:0)}%"></i></div>
<div class="rw"><input id="cep" placeholder="CEP (00000-000)" inputmode="numeric" maxlength="9" value="${esc(S.cep||'')}"><button class="btn g s" id="cepb">Calcular</button></div><div class="ms">${esc(S.cm||'')}</div>
<div class="rw"><input id="cup" placeholder="Cupom de desconto" value="${esc(S.cn||'')}"><button class="btn g s" id="cupb">Aplicar</button></div><div class="ms">${esc(S.um||'')}</div>
<div class="sm" style="margin-top:8px"><div><span>Subtotal</span><span>${brl(s)}</span></div>${d?`<div><span>Cupom</span><span>− ${brl(d)}</span></div>`:''}<div><span>Frete</span><span>${fr==null?'a calcular':fr==0?'Grátis':brl(fr)}</span></div><div class="t"><span>Total</span><span>${brl(tot)}</span></div></div>
<div class="pix"><b>Pix: ${brl(tot*(1-D.site.pix/100))}</b><br>${D.site.pix}% de desconto no pagamento à vista.</div><button class="btn" style="width:100%" id="co">Finalizar pedido via WhatsApp</button>`}
$('#it').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const i=S.cart[+b.dataset.q];i.qty+=+b.dataset.d;if(i.qty<1)S.cart.splice(+b.dataset.q,1);keep();cart()};
$('#cf').onclick=e=>{const id=e.target.id;
if(id=='cepb'){const v=$('#cep').value.replace(/\D/g,'');S.cep=$('#cep').value;if(v.length!=8)S.cm='Digite um CEP com 8 números.';else{const d=+v[0];S.frete=Math.round(D.site.freteBase*(1+d*.05)*10)/10;S.cm=`Entrega em ${3+Math.ceil(d/2)} a ${6+Math.ceil(d/2)} dias úteis.`}cart()}
if(id=='cupb'){const v=$('#cup').value.trim().toUpperCase(),c=D.site.cupons.find(x=>String(x.c).toUpperCase()==v);S.cn=v;S.cup=c?c.p/100:0;S.um=c?`Cupom ${v} aplicado: ${c.p}% de desconto.`:'Cupom inválido. Confira o código.';cart()}
if(id=='co'){const L=lines();if(!L.length)return;const s=sub(),free=+D.site.gratis||0,d=s*S.cup,fr=S.frete==null?null:(s>=free?0:S.frete),tot=s-d+(fr||0),pixTot=tot*(1-(+D.site.pix||0)/100);const m=['Olá, MAUY! Quero finalizar meu pedido:','',...L.map(i=>`• ${i.p.nome} | Tam. ${i.size} | Qtd. ${i.qty} — ${brl(i.p.preco*i.qty)}`),'',`Subtotal: ${brl(s)}`];if(S.cup)m.push(`Cupom (${S.cn}): − ${brl(d)}`);if(S.cep)m.push(`CEP: ${S.cep}`);m.push(`Frete: ${fr==null?'A calcular':fr==0?'Grátis':brl(fr)}`);m.push(`*Total: ${brl(tot)}*`);if(+D.site.pix>0)m.push(`Total no Pix (${D.site.pix}% off): *${brl(pixTot)}*`);open('https://wa.me/'+String(D.site.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(m.join('\n')),'_blank','noopener')}};

const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Armazenamento cheio. Use imagens menores ou links de imagem.');return false}}};
let A={tab:'b',dirty:false,gh:LS.g('mauy_gh',{o:'',r:'',b:'main',p:'dados.json',t:''})};
const get=p=>p.split('.').reduce((o,k)=>o?.[k],D),sp=(p,v)=>{const k=p.split('.');let o=D;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=v};
const F=(l,p,t='',w='')=>{const v=get(p);return `<label class="f ${w}">${l}<input data-p="${p}" ${t=='n'?'type="number" step="any" data-n':t=='l'?'data-l':'type="text"'} value="${esc(t=='l'?(v||[]).join(', '):v)}"></label>`};
const TA=(l,p)=>`<label class="f w">${l}<textarea rows="3" data-p="${p}">${esc(get(p))}</textarea></label>`;

function toData(f,max=1400){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{if(/svg|gif/.test(f.type))return res(r.result);const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)})}
function thumbs(arr,p){return arr.length?`<div class="thumbs">${arr.map((u,j)=>`<span><img src="${esc(u)}" alt=""><button data-a="rmimg" data-p="${p}" data-i="${j}" aria-label="Remover foto">×</button></span>`).join('')}</div>`:''}

async function ghPub(btn){const g=A.gh;if(!g.o||!g.r||!g.t){toast('Preencha usuário, repositório e token.');return}btn.disabled=true;btn.textContent='Publicando…';
try{const api=`https://api.github.com/repos/${encodeURIComponent(g.o)}/${encodeURIComponent(g.r)}/contents/${g.p.split('/').map(encodeURIComponent).join('/')}`,h={Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'};
let sha;const r=await fetch(api+'?ref='+encodeURIComponent(g.b),{headers:h});if(r.ok)sha=(await r.json()).sha;else if(r.status!=404)throw Error('Acesso negado ou repositório não encontrado ('+r.status+').');
const body={message:'Atualiza vitrine MAUY',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1)))),branch:g.b};if(sha)body.sha=sha;
const w=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!w.ok)throw Error('Falha ao gravar ('+w.status+'). Confira o token e a permissão.');
A.dirty=false;localStorage.removeItem('mauy_draft');toast('Publicado. A loja atualiza em instantes.')}catch(e){toast(e.message||'Não foi possível publicar.')}btn.disabled=false;btn.textContent='Publicar no GitHub';admin()}

D.site=D.site||{};D.site.cupons=D.site.cupons||[];D.banners=D.banners||[];D.galeria=D.galeria||[];D.produtos=(D.produtos||[]).map(p=>({...p,imagens:p.imagens||(p.imagem?[p.imagem]:[]),tamanhos:p.tamanhos?.length?p.tamanhos:['Único']}));
route()})();

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn.sec{background:none;border:1px solid var(--acc);color:var(--brand)}.btn.ghost{background:none;color:var(--mut);padding:8px}.btn.dan{background:none;border:1px solid #e9c3c4;color:var(--err)}.btn.sm{padding:6px 10px;font-size:11px}

.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

function ensure(){db=db||{};db.products=db.products||[];db.customers=db.customers||[];db.orders=db.orders||[];db.logs=db.logs||[];db.meta=db.meta||{visitas:0};

</script><script id="mauy-modulos">
'use strict';
/* =====================================================================
   MÓDULOS MAUY v2 — camada adicional sobre o painel (não altera o núcleo)
   1) Importação em lote (CSV/XLSX)   2) Construtor de seções da home
   3) Produtividade: Ctrl+S, Ctrl+Z (undo), alerta de conflito no GitHub
   ===================================================================== */

/* ---------- utilidades locais ---------- */
const clean = s => String(s ?? '').replace(/<[^>]*>/g, '').trim();          // remove tags (anti-XSS na entrada)
const col   = (x, d) => /^#[0-9a-f]{3,8}$/i.test(x || '') ? x : d;           // só aceita cor hex válida
const num   = s => {                                                          // "R$ 1.299,90" | "99.9" → número
  s = String(s ?? '').replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
};
const list = (s, sep = /[|;,\/]/) => String(s).split(sep).map(clean).filter(Boolean);

/* =====================================================================
   1. IMPORTAÇÃO EM LOTE
   ===================================================================== */
const FIELDS = {
  produtos: [
    ['sku', 'SKU', ['sku', 'codigo', 'cod', 'referencia', 'ref']],
    ['nome', 'Nome', ['nome', 'produto', 'titulo']],

  ],
  clientes: [
    ['nome', 'Nome', ['nome', 'cliente']],
    ['whatsapp', 'WhatsApp', ['whatsapp', 'telefone', 'celular', 'fone']],
    ['email', 'E-mail', ['email', 'e-mail']],
    ['tamanhos', 'Tamanhos', ['tamanhos', 'tamanho']],
    ['pref', 'Preferências', ['preferencias', 'pref', 'obs']],
    ['tags', 'Tags', ['tags', 'tag', 'segmento']]
  ]
};
const TPL = {
  produtos: [
    ['SKU', 'Nome', 'Categoria', 'Subcategoria', 'Preço', 'Preço antigo', 'Estoque', 'Tamanhos', 'Cores', 'Ativo'],
    ['FEM-TOP-001', 'Top Essencial Fio', 'Feminina', 'Top', '99,90', '129,90', '10', 'PP,P,M,G,GG', 'Preto:#000000|Branco:#ffffff', 'sim'],
    ['ACE-LUV-001', 'Luva MAUY', 'Acessórios', 'Luva', '59,90', '', '1', 'U', 'Rosé:#ffdbd8', 'sim']
  ],
  clientes: [
    ['Nome', 'WhatsApp', 'E-mail', 'Tamanhos', 'Preferências', 'Tags'],
    ['Maria Souza', '47999998888', 'maria@email.com', 'M', 'Gosta de tons neutros', 'VIP,Nova'],
    ['Ana Lima', '47988887777', '', 'P', '', 'Atacado']
  ]
};
const IM = { kind: 'produtos', mode: 'upsert', headers: [], rows: [], map: {} };

/* Decodificação automática: tenta UTF-8 estrito; se falhar, ISO-8859-1 */
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('iso-8859-1').decode(buf); }
}
/* Parser CSV com aspas, quebras de linha em células e delimitador ; ou , detectado */
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0];
  const d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
/* SheetJS carregado sob demanda (versão fixa, CDN permitido) */
async function loadXLSX() {
  if (window.XLSX) return;
  await new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = () => no(Error('Não consegui carregar a biblioteca de Excel. Use um arquivo .csv.'));
    document.head.append(s);
  });
}
async function readSheet(f) {
  if (!f) return;
  try {
    const buf = await f.arrayBuffer();
    let aoa;
    if (/\.xlsx?$/i.test(f.name)) {
      await loadXLSX();
      const wb = XLSX.read(buf, { type: 'array' });
      aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    } else aoa = parseCSV(decode(buf));
    aoa = aoa.filter(r => r.some(c => String(c).trim()));
    if (aoa.length < 2) throw Error('A planilha precisa ter o cabeçalho e ao menos uma linha.');
    IM.headers = aoa[0].map(h => String(h).trim());
    IM.rows = aoa.slice(1, 2001);
    if (aoa.length > 2001) toast('Lidas as primeiras 2.000 linhas.', 'err');
    IM.map = autoMap();
    drawImp();
  } catch (e) { toast(e.message, 'err'); }
}
/* Mapeamento automático por nome de coluna (exato primeiro, depois "contém") */
function autoMap() {
  const H = IM.headers.map(nz), m = {};
  FIELDS[IM.kind].forEach(([k, , syn]) => {
    let i = H.findIndex(h => syn.includes(h));
    if (i < 0) i = H.findIndex(h => syn.some(s => s.length > 3 && h.includes(s)));
    m[k] = i;
  });
  return m;
}
/* Reconstrói variantes ("Cor|Tam" → qtd) e o estoque total */
function rebuild(p, total) {
  const cs = (p.cores?.length ? p.cores : [{ nome: 'Único' }]).map(c => c.nome);
  const sz = p.tamanhos?.length ? p.tamanhos : ['Único'];
  const keys = cs.flatMap(c => sz.map(s => c + '|' + s)), old = p.variantes || {}, v = {};
  if (total == null) keys.forEach(k => v[k] = old[k] || 0);
  else { const b = Math.floor(total / keys.length); let r = total - b * keys.length; keys.forEach(k => v[k] = b + (r-- > 0 ? 1 : 0)); }
  p.variantes = v;
  p.estoque = Object.values(v).reduce((a, b) => a + b, 0);
}

/* ---- análise / validação (não altera o db) ---- */
const cell = (r, f) => IM.map[f] == null || IM.map[f] < 0 ? '' : String(r[IM.map[f]] ?? '').trim();

function analyzeProdutos() {
  const idx = new Map(db.products.map((p, i) => [String(p.sku || '').toUpperCase(), i])), seen = new Set();
  return IM.rows.map((r, n) => {
    const it = { n: n + 2, errs: [], warns: [], patch: {} }, P = it.patch;
    const sku = clean(cell(r, 'sku')).toUpperCase();
    if (sku) { P.sku = sku; if (seen.has(sku)) it.errs.push('SKU duplicado na planilha'); seen.add(sku); }
    it.ex = sku ? idx.get(sku) : undefined;
    ['nome', 'categoria', 'subcategoria'].forEach(f => { const v = clean(cell(r, f)); if (v) P[f] = v; });
    let raw = cell(r, 'preco');
    if (raw) { const v = num(raw); v > 0 ? P.preco = v : it.errs.push('Preço inválido: ' + raw); }
    raw = cell(r, 'precoAntigo');
    if (raw) { const v = num(raw); v > 0 ? P.precoAntigo = v : it.errs.push('Preço antigo inválido: ' + raw); }
    raw = cell(r, 'estoque');
    if (raw) { const v = num(raw); Number.isInteger(v) && v >= 0 ? P.estoque = v : it.errs.push('Estoque inválido: ' + raw); }
    raw = cell(r, 'tamanhos'); if (raw) P.tamanhos = list(raw).map(s => s.toUpperCase());
    raw = cell(r, 'cores');
    if (raw) P.cores = list(raw, /[|;]/).map(c => { const [nome, hex] = c.split(':'); return { nome: clean(nome), hex: col((hex || '').trim(), '#cccccc') }; });
    raw = cell(r, 'ativo');
    if (raw) {
      if (/^(sim|s|1|true|ativo|visivel|visível)$/i.test(raw)) P.ativo = true;
      else if (/^(nao|não|n|0|false|oculto|inativo)$/i.test(raw)) P.ativo = false;
      else it.warns.push('Valor de “Ativo” não reconhecido');
    }
    const ex = it.ex !== undefined ? db.products[it.ex] : null, preco = P.preco ?? ex?.preco;
    if (!ex) {
      if (!P.nome) it.errs.push('Nome obrigatório');
      if (P.preco == null && !it.errs.some(e => e.startsWith('Preço inv'))) it.errs.push('Preço obrigatório');
      if (!sku) it.warns.push('SKU será gerado automaticamente');
    }
    if (P.precoAntigo && preco && P.precoAntigo <= preco) it.errs.push('Preço antigo deve ser maior que o preço');
    it.status = it.errs.length ? 'erro' : ex ? (IM.mode === 'novos' ? 'ignorado' : 'atualiza') : 'novo';
    return it;
  });
}
function analyzeClientes() {
  const keyOf = c => digits(c.whatsapp) || String(c.email || '').toLowerCase();
  const idx = new Map(db.customers.map((c, i) => [keyOf(c), i])), seen = new Set();
  return IM.rows.map((r, n) => {
    const it = { n: n + 2, errs: [], warns: [], patch: {} }, P = it.patch;
    ['nome', 'tamanhos', 'pref'].forEach(f => { const v = clean(cell(r, f)); if (v) P[f] = v; });
    const wa = digits(cell(r, 'whatsapp')), em = clean(cell(r, 'email')).toLowerCase();
    if (wa) { wa.length >= 10 && wa.length <= 13 ? P.whatsapp = wa : it.errs.push('WhatsApp inválido'); }
    if (em) { /^\S+@\S+\.\S+$/.test(em) ? P.email = em : it.errs.push('E-mail inválido'); }
    const t = cell(r, 'tags'); if (t) P.tags = list(t);
    const key = wa || em;
    if (key) { if (seen.has(key)) it.errs.push('Cliente duplicado na planilha'); seen.add(key); }
    it.ex = key ? idx.get(key) : undefined;
    if (it.ex === undefined && !P.nome) it.errs.push('Nome obrigatório');
    it.status = it.errs.length ? 'erro' : it.ex !== undefined ? (IM.mode === 'novos' ? 'ignorado' : 'atualiza') : 'novo';
    return it;
  });
}
const analyze = () => IM.kind === 'produtos' ? analyzeProdutos() : analyzeClientes();

/* ---- aplicação no estado (db) ---- */
function applyProduto(it) {
  const q = it.patch;
  if (it.ex !== undefined) {
    const p = db.products[it.ex], { estoque, ...rest } = q;
    Object.assign(p, rest);
    if (estoque != null || rest.tamanhos || rest.cores) rebuild(p, estoque);
    return;
  }
  const p = {
    id: 'PRD-' + Math.random().toString(36).slice(2, 10).toUpperCase(), nome: q.nome, sku: q.sku || '',
    categoria: q.categoria || '', subcategoria: q.subcategoria || '', preco: q.preco, tamanhos: q.tamanhos || [],
    cores: q.cores || [], fotos: [], variantes: {}, badges: [], estoqueMinimo: 3, ativo: q.ativo ?? true,
    descricao: '', tecido: '', guia: '', video: '', slug: slug(q.nome), metaTitle: '', metaDesc: '', estoque: 0, imagem: ''
  };
  if (q.precoAntigo) p.precoAntigo = q.precoAntigo;
  if (!p.sku) p.sku = genSku(p);
  rebuild(p, q.estoque ?? 0);
  db.products.push(p);
}
function applyCliente(it) {
  if (it.ex !== undefined) return void Object.assign(db.customers[it.ex], it.patch);
  db.customers.push({ id: 'CLI-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nome: '', whatsapp: '', email: '', tamanhos: '', pref: '', tags: [], ...it.patch });
}

/* ---- telas ---- */
V.imp = () => head('Importar planilha', 'Importe produtos ou clientes em lote a partir de .csv ou .xlsx, com validação antes de salvar.') +
  `<section class="card"><div class="fg">
    <div class="f"><label>O que importar</label><select data-imp="kind"><option value="produtos">Produtos</option><option value="clientes">Clientes</option></select></div>
    <div class="f"><label>Modo de operação</label><select data-imp="mode"><option value="upsert">Atualizar existentes (por SKU/contato) e criar novos</option><option value="novos">Apenas adicionar novos</option></select></div>
    <div class="f"><label>Arquivo (.csv, .xlsx)</label><input type="file" id="impf" accept=".csv,.txt,.xlsx,.xls"></div>
    <div class="f"><label>Planilha modelo com exemplos</label><div class="row"><button class="btn sec sm" data-act="tplCsv">Baixar .csv</button><button class="btn sec sm" data-act="tplXlsx">Baixar .xlsx</button></div></div>
  </div></section><div id="impbody"></div>`;

function drawImp() {
  $('[data-imp=kind]').value = IM.kind; $('[data-imp=mode]').value = IM.mode;
  if (!IM.rows.length) { $('#impbody').innerHTML = '<p class="muted">Escolha um arquivo para começar. Campos em branco não apagam dados existentes.</p>'; return; }
  const opts = s => `<option value="-1">— ignorar —</option>` + IM.headers.map((h, i) => `<option value="${i}" ${s === i ? 'selected' : ''}>${esc(h || 'Coluna ' + (i + 1))}</option>`).join('');
  $('#impbody').innerHTML = `<section class="card"><h2>1. Mapeamento de colunas</h2><p class="sub">Vincule cada campo do sistema a uma coluna da planilha (${IM.rows.length} linhas lidas).</p>
    <div class="fg fg3">${FIELDS[IM.kind].map(([k, l]) => `<div class="f"><label>${l}</label><select data-imp-map="${k}">${opts(IM.map[k])}</select></div>`).join('')}</div></section>
    <section class="card" id="imppv"></section>`;
  drawImpPV();
}
function drawImpPV() {
  const items = IM._items = analyze(), cnt = s => items.filter(i => i.status === s).length, ok = cnt('novo') + cnt('atualiza');
  const cols = FIELDS[IM.kind].filter(([k]) => IM.map[k] >= 0).slice(0, 6);
  const pill = { novo: 'ok', atualiza: 'wa', ignorado: '', erro: 'er' }, lbl = { novo: 'Novo', atualiza: 'Atualiza', ignorado: 'Ignorado', erro: 'Erro' };
  $('#imppv').innerHTML = `<h2>2. Pré-visualização</h2><p class="sub">
    <span class="pill ok">${cnt('novo')} novos</span><span class="pill wa">${cnt('atualiza')} atualizações</span><span class="pill">${cnt('ignorado')} ignorados</span><span class="pill er">${cnt('erro')} com erro</span></p>
    <div class="tw"><table><thead><tr><th>Linha</th><th>Situação</th>${cols.map(([, l]) => `<th>${l}</th>`).join('')}<th>Avisos</th></tr></thead><tbody>
    ${items.slice(0, 300).map(it => `<tr ${it.status === 'erro' ? 'style="background:color-mix(in srgb,var(--err) 12%,transparent)"' : ''}><td>${it.n}</td><td><span class="pill ${pill[it.status]}">${lbl[it.status]}</span></td>
      ${cols.map(([k]) => `<td>${esc(Array.isArray(it.patch[k]) ? it.patch[k].map(x => x.nome || x).join(', ') : it.patch[k] ?? '—')}</td>`).join('')}
      <td>${esc([...it.errs, ...it.warns].join(' · '))}</td></tr>`).join('')}</tbody></table></div>
    ${items.length > 300 ? `<p class="muted">Mostrando 300 de ${items.length} linhas (todas serão processadas).</p>` : ''}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="impOk" ${ok ? '' : 'disabled'}>Importar ${ok} linha(s) válida(s)</button><span class="muted">Linhas com erro nunca são importadas. Você ainda poderá desfazer (Ctrl+Z) e precisará publicar.</span></div>`;
}

/* =====================================================================
   2. CONSTRUTOR DE SEÇÕES DA HOME  →  site.layout[]
   Schema de cada bloco: { id, tipo, ativo, titulo, quantidade?, conteudo? }
   ===================================================================== */
const LT = {
  banner: ['Banner principal', '🖼', 'Carrossel grande no topo da loja.'],

  beneficios: ['Faixa de benefícios', '✔', 'Barra colorida com frases curtas (frete grátis, troca…).'],

  video: ['Vídeo', '▶', 'Um vídeo do YouTube ou Vimeo.'],
  depoimentos: ['Depoimentos', '❝', 'Frases de clientes satisfeitas.']
};
const bid = () => 'sec-' + Math.random().toString(36).slice(2, 8);
const defaultLayout = s => [
  { id: bid(), tipo: 'banner', ativo: true },
  { id: bid(), tipo: 'galeria', ativo: true, titulo: '', fotos: (s.galeria || []).filter(g => g.img).map(g => ({ img: g.img, legenda: g.legenda || '' })) },

  { id: bid(), tipo: 'beneficios', ativo: true, conteudo: `Frete grátis acima de ${brl(s.frete?.gratisAcima)}\nTroca em até 7 dias\n3x sem juros` }
];
const lay = () => db.site.layout;
const MUTED = 'color:var(--mut);font-size:12px';
const BODY = {
  banner: () => `<p class="sub">Imagem, título e botão dos slides ficam em “Conteúdo e marca”. Só os slides marcados como Ativos aparecem.</p><button class="btn sec sm" data-act="sgoto">Editar os slides →</button>`,
  galeria: (b, i, p) => `<div class="fg">${inp('Título do bloco (opcional)', p + 'titulo')}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0">${(b.fotos || []).map((f, j) =>
      `<div class="gi"><img src="${esc(u(f.img))}" alt=""><button type="button" data-act="sfrm" data-i="${i}" data-j="${j}" aria-label="Remover">×</button><input data-b="${p}fotos.${j}.legenda" value="${esc(f.legenda)}" placeholder="Legenda" style="border-radius:0;font-size:11px"></div>`).join('') || `<span style="${MUTED}">Nenhuma foto ainda.</span>`}</div>
    <label class="btn sec sm">＋ Adicionar fotos<input type="file" accept="image/*" multiple hidden data-sgal="${i}"></label>`,
  produtos: (b, i, p) => `<div class="fg">${inp('Título do bloco', p + 'titulo')}${inp('Quantos produtos mostrar', p + 'quantidade', { t: 'number', a: 'min=0 max=48', h: 'Deixe 0 para mostrar todos, com filtro por categoria.' })}</div>`,
  beneficios: (b, i, p) => inp('Frases (uma por linha)', p + 'conteudo', { t: 'ta', rows: 3, full: 1 }),
  bannerDuplo: (b, i, p) => `<div class="fg">${upl('Imagem 1', p + 'imagem1', 1200)}${upl('Imagem 2', p + 'imagem2', 1200)}${inp('Texto da imagem 1', p + 'titulo1')}${inp('Texto da imagem 2', p + 'titulo2')}${inp('Link da imagem 1', p + 'link1', { ph: '#loja' })}${inp('Link da imagem 2', p + 'link2', { ph: '#loja' })}</div>`,
  video: (b, i, p) => `<div class="fg">${inp('Título do bloco (opcional)', p + 'titulo')}${inp('Link do vídeo (YouTube ou Vimeo)', p + 'conteudo')}</div>`,
  depoimentos: (b, i, p) => `<div class="fg">${inp('Título do bloco', p + 'titulo')}</div>${inp('Depoimentos (um por linha: Nome|Texto)', p + 'conteudo', { t: 'ta', rows: 3, full: 1 })}`
};
const blockCard = (b, i) => { const T = LT[b.tipo], on = b.ativo !== false, p = `site.layout.${i}.`;
  return `<div class="bn" draggable="true" data-ldrag="${i}" style="${on ? '' : 'opacity:.6'}"><div class="bn-h"><span class="hdl">⋮⋮</span>
    <div><b>${T[1]} ${T[0]}</b><br><span style="${MUTED}">${T[2]}</span></div>
    <span class="row" style="margin-left:auto"><button class="btn ghost sm" data-act="smove" data-i="${i}" data-d="-1" title="Subir">↑</button><button class="btn ghost sm" data-act="smove" data-i="${i}" data-d="1" title="Descer">↓</button>
    <button class="btn sec sm" data-act="stog" data-i="${i}">${on ? 'Ocultar' : 'Mostrar'}</button><button class="btn ghost sm" data-act="sdup" data-i="${i}">Duplicar</button><button class="btn dan sm" data-act="sdel" data-i="${i}">Excluir</button></span></div>
    ${BODY[b.tipo](b, i, p)}</div>`;
};
V.lay = () => head('Layout da home', 'A home é montada em blocos, de cima para baixo. Mude a ordem com ↑ ↓ e clique em “Publicar alterações” no fim.',
  `<div class="seg"><button data-act="dev" data-v="d" class="${dev === 'd' ? 'on' : ''}">Desktop</button><button data-act="dev" data-v="m" class="${dev === 'm' ? 'on' : ''}">Mobile</button></div>`) +
  `<section class="card"><h2>Como a home ficará</h2><div id="laypv"></div></section>
  <section class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Blocos da home</h2>
  <div class="row"><select id="lnew">${Object.entries(LT).map(([k, v]) => `<option value="${k}">${v[1]} ${v[0]}</option>`).join('')}</select><button class="btn" data-act="sadd">＋ Adicionar bloco</button></div></div>
  ${lay().map(blockCard).join('') || '<p style="' + MUTED + '">Nenhum bloco. Adicione o primeiro.</p>'}</section>`;

function layPV() {
  const s = db.site, ac = col(s.marca.cor1, '#59283b'), cd = '#ece5db', m = dev === 'm',
    ban = s.banners.find(b => b.ativo !== false), img = m ? (ban?.mobile || ban?.desktop) : (ban?.desktop || ban?.mobile),
    grid = n => `<div style="display:grid;grid-template-columns:repeat(${m ? 2 : 4},1fr);gap:6px">${Array.from({ length: n }, () => `<div style="aspect-ratio:3/4;background:${cd};border-radius:6px"></div>`).join('')}</div>`,
    box = (h, t) => `<div style="padding:12px">${t ? `<b style="display:block;margin-bottom:8px">${esc(t)}</b>` : ''}${h}</div>`,
    ln = b => String(b.conteudo || '').split('\n').filter(x => x.trim());
  const PV = {
    banner: () => `<div style="height:${m ? 200 : 160}px;background:${img ? `center/cover url('${esc(u(img))}')` : ac};color:#fff;display:flex;align-items:end;padding:14px;font-weight:600;text-shadow:0 1px 6px #0008">${esc(ban?.titulo || 'Banner principal')}</div>`,
    galeria: b => box(`<div style="display:flex;gap:6px;overflow:hidden">${(b.fotos || []).slice(0, 4).map(f => `<img src="${esc(u(f.img))}" alt="" style="height:90px;border-radius:6px">`).join('') || '<span>Adicione fotos</span>'}</div>`, b.titulo),
    produtos: b => box(grid(Math.min(+b.quantidade || 4, 4)), b.titulo),
    beneficios: b => `<div style="background:${ac};color:#fff;padding:10px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11px">${ln(b).map(x => `<span>${esc(x)}</span>`).join('')}</div>`,
    bannerDuplo: b => box(`<div style="display:grid;grid-template-columns:${m ? '1fr' : '1fr 1fr'};gap:6px">${[1, 2].map(n => `<div style="height:80px;border-radius:8px;background:${b['imagem' + n] ? `center/cover url('${esc(u(b['imagem' + n]))}')` : cd};color:#fff;display:flex;align-items:end;padding:8px">${esc(b['titulo' + n] || '')}</div>`).join('')}</div>`, b.titulo),
    video: b => box(`<div style="aspect-ratio:16/9;background:#222;color:#fff;border-radius:8px;display:grid;place-items:center;font-size:28px">▶</div>`, b.titulo),
    depoimentos: b => box(`<i>“${esc((ln(b)[0] || 'Nome|Depoimento').split('|').pop())}”</i>`, b.titulo)
  };
  $('#laypv').innerHTML = `<div style="width:${m ? '360px' : '100%'};max-width:100%;margin:auto;background:#f5f1eb;color:#29292b;font-family:${esc(s.marca.fonte)},sans-serif;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px">
    <div style="background:${col(s.avisos?.cor, ac)};color:#fff;text-align:center;padding:6px;font-size:11px">${esc(s.avisos?.texto || '')}</div>
    ${lay().filter(b => b.ativo !== false).map(b => PV[b.tipo]?.(b) || '').join('')}</div>`;
}
Object.assign(A, {
  sadd() { const t = $('#lnew').value; lay().push({ id: bid(), tipo: t, ativo: true, titulo: t === 'produtos' ? 'Novidades' : '', ...(t === 'galeria' ? { fotos: [] } : {}), ...(t === 'produtos' ? { quantidade: 8 } : {}) }); persist(1); render(); },
  stog(d) { const b = lay()[+d.i]; b.ativo = b.ativo === false; persist(1); render(); },
  sdup(d) { const b = JSON.parse(JSON.stringify(lay()[+d.i])); b.id = bid(); lay().splice(+d.i + 1, 0, b); persist(1); render(); },
  sdel(d) { if (confirm('Excluir este bloco?')) { lay().splice(+d.i, 1); persist(1); render(); } },
  smove(d) { const a = lay(), i = +d.i, j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; persist(1); render(); },
  sfrm(d) { lay()[+d.i].fotos.splice(+d.j, 1); persist(1); render(); },
  sgoto() { tab = 'vis'; render(); scrollTo(0, 0); },
  tplCsv() { dl(`modelo-${IM.kind}.csv`, csv(TPL[IM.kind]), 'text/csv'); },
  async tplXlsx() {
    try { await loadXLSX(); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(TPL[IM.kind]), 'Modelo'); XLSX.writeFile(wb, `modelo-${IM.kind}.xlsx`); }
    catch (e) { toast(e.message, 'err'); }
  },
  impOk() {
    const ok = (IM._items || []).filter(i => i.status === 'novo' || i.status === 'atualiza');
    if (!ok.length) return;
    ok.forEach(IM.kind === 'produtos' ? applyProduto : applyCliente);
    log(`Importou ${ok.length} ${IM.kind} via planilha`);
    persist(1); IM.rows = []; IM.headers = [];
    toast(`${ok.length} registro(s) importados. Revise e publique.`); render();
  },
  undo() { undo(); }
});
document.addEventListener('change', async e => {
  const t = e.target; if (t.dataset.sgal === undefined) return;
  const b = lay()[+t.dataset.sgal], fs = [...t.files];
  for (const f of fs) try { b.fotos.push({ img: await toData(f, 1400), legenda: '' }); } catch { toast(f.name + ': arquivo inválido', 'err'); }
  t.value = ''; persist(1); render(); toast('Fotos adicionadas. Clique em Publicar alterações.');
});

/* Drag & drop das seções (independente do drag dos banners) */
let ldr = null;
document.addEventListener('dragstart', e => { const b = e.target.closest?.('[data-ldrag]'); if (b) ldr = +b.dataset.ldrag; });
document.addEventListener('dragover', e => { const b = e.target.closest?.('[data-ldrag]'); if (b && ldr !== null) { e.preventDefault(); $$('[data-ldrag]').forEach(x => x.classList.remove('over')); b.classList.add('over'); } });
document.addEventListener('drop', e => {
  const b = e.target.closest?.('[data-ldrag]'); if (!b || ldr === null) return;
  e.preventDefault(); const j = +b.dataset.ldrag, [x] = lay().splice(ldr, 1); lay().splice(j, 0, x); ldr = null; persist(1); render();
});
document.addEventListener('dragend', () => { ldr = null; });
document.addEventListener('input', e => { if (tab === 'lay' && e.target.dataset.b) layPV(); });   // preview ao vivo, sem perder foco
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.imp === 'kind') { IM.kind = t.value; IM.map = IM.rows.length ? autoMap() : {}; drawImp(); }
  else if (t.dataset.imp === 'mode') { IM.mode = t.value; if (IM.rows.length) drawImpPV(); }
  else if (t.dataset.impMap) { IM.map[t.dataset.impMap] = +t.value; drawImpPV(); }
  else if (t.id === 'impf') { await readSheet(t.files[0]); t.value = ''; }
});

/* =====================================================================
   3. PRODUTIVIDADE: undo em memória, atalhos e conflito de commit
   ===================================================================== */
const snap = () => JSON.stringify(db), undoStack = []; let lastSnap = null, lastPush = 0, snapTimer = 0, headSha = null;
const _persist = persist;
persist = function (now) {
  if (lastSnap && Date.now() - lastPush > 1200) { undoStack.push(lastSnap); if (undoStack.length > 25) undoStack.shift(); lastPush = Date.now(); }  // agrupa digitação rápida
  _persist(now);
  clearTimeout(snapTimer); snapTimer = setTimeout(() => { lastSnap = snap(); }, 1300);
};
function undo() {
  if (!undoStack.length) return toast('Nada para desfazer.', 'err');
  db = JSON.parse(undoStack.pop()); ensure(); lastSnap = snap();
  dirty = true; LS.s(K.dirty, true); LS.s(K.db, db); render(); toast('Última alteração desfeita');
}
async function readHead() { if (!gOk()) return null; try { return (await gj('/git/ref/heads/' + gh.branch)).object.sha; } catch { return null; } }
/* Publica avisando se o branch remoto mudou desde que o painel foi aberto/atualizado */
async function publishSafe() {
  if (gOk()) {
    const h = await readHead();
    if (headSha && h && h !== headSha && !confirm('⚠ O repositório recebeu outro commit desde que você abriu o painel. Publicar agora pode sobrescrever essas mudanças em site.json/produtos.json. Continuar mesmo assim?')) return;
  }
  await publish();
  if (!dirty) headSha = await readHead();
}
const _pull = pull;
pull = async function (silent) { await _pull(silent); headSha = await readHead(); };
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); publishSafe(); }
  else if (mod && k === 'z' && !e.shiftKey && !e.target.closest('input,textarea,[contenteditable]')) { e.preventDefault(); undo(); }
});

/* ---------- integração com o núcleo ---------- */
const _ensure = ensure;
ensure = function () {
  _ensure(); const s = db.site;
  s.banners.forEach(b => { if (!b.desktop && b.imagem) b.desktop = b.imagem; if (!b.sub && b.texto) b.sub = b.texto; if (b.ativo === undefined) b.ativo = true; });
  if (!Array.isArray(s.layout) || !s.layout.length) s.layout = defaultLayout(s);
  s.layout = s.layout.map(b => b.tipo === 'destaques' ? { ...b, tipo: 'produtos', quantidade: b.quantidade || 0 } : b.tipo === 'lookbook' ? { ...b, tipo: 'galeria', fotos: [] } : b).filter(b => LT[b.tipo]);
  s.layout.forEach(b => { if (b.tipo === 'galeria' && !Array.isArray(b.fotos)) b.fotos = []; });
};
const _render = render;
render = function () { _render(); if (tab === 'imp') drawImp(); if (tab === 'lay') layPV(); };
TABS.splice(TABS.findIndex(t => t[0] === 'prod') + 1, 0, ['imp', 'Importar planilha', '⇪', ['admin', 'operador']]);
TABS.splice(TABS.findIndex(t => t[0] === 'vis') + 1, 0, ['lay', 'Layout da home', '☷', ['admin']]);
$('#pub').onclick = publishSafe;
$('#theme').insertAdjacentHTML('beforebegin', '<button class="btn ghost" data-act="undo" title="Desfazer (Ctrl+Z)">↶ Desfazer</button>');
ensure(); render();
setTimeout(() => { lastSnap = snap(); }, 1500);
readHead().then(h => { headSha ??= h; });
</script>

</body></html>

</template>
<script id="mauy-panel-loader">
(()=>{const shell=document.getElementById('mauy-panel-shell'),frame=document.getElementById('mauy-panel-frame'),src=document.getElementById('mauy-panel-source');let loaded=false;
function open(){if(!loaded){frame.srcdoc=src.innerHTML;loaded=true}shell.classList.add('on');document.body.style.overflow='hidden'}
function close(){shell.classList.remove('on');document.body.style.overflow=''}
document.getElementById('mauy-panel-launch').addEventListener('click',open);window.addEventListener('message',e=>{if(e.data==='mauy-close-panel')close()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&shell.classList.contains('on'))close()});
})();
</script>
