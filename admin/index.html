<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel MAUY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>body{font-family:'DM Sans',sans-serif}.serif{font-family:'Playfair Display',serif}.on{background:#59283B;color:#F5F1EB}</style>
</head>
<body class="min-h-screen bg-[#F5F1EB] text-[#29292B]">
<div class="min-h-screen md:flex">
  <aside class="bg-white p-5 md:flex md:w-60 md:flex-col md:border-r md:border-black/10">
    <a href="../" class="mb-5 block text-center text-[#59283B] md:text-left"><span class="block text-2xl font-semibold tracking-[.25em]">MAUY</span><span class="text-[9px] tracking-[.45em] text-[#C5A99A]">PAINEL ADMINISTRATIVO</span></a>
    <nav class="flex gap-2 overflow-x-auto md:flex-col">
      <button data-tab="prod" class="tab on rounded-full px-4 py-2 text-left text-sm whitespace-nowrap">Produtos</button>
      <button data-tab="cup" class="tab rounded-full px-4 py-2 text-left text-sm whitespace-nowrap">Cupons</button>
      <button data-tab="ped" class="tab rounded-full px-4 py-2 text-left text-sm whitespace-nowrap">Pedidos</button>
      <button data-tab="dados" class="tab rounded-full px-4 py-2 text-left text-sm whitespace-nowrap">Dados</button>
    </nav>
    <a href="../" class="mt-5 text-sm text-[#59283B] underline md:mt-auto">← Ver loja</a>
  </aside>
  <main class="min-w-0 flex-1 p-5 sm:p-8"><div class="mx-auto max-w-6xl"><div id="view"><p class="text-sm text-black/60">Carregando painel…</p></div></div></main>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50 p-4"><div class="mx-auto mt-10 max-w-lg rounded-2xl bg-white p-6" id="modalbox"></div></div>
<div id="toast" class="fixed bottom-5 left-1/2 z-[60] hidden -translate-x-1/2 rounded-full bg-[#59283B] px-5 py-3 text-sm text-white shadow-xl"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const keys={products:'mauy_produtos',site:'mauy_site',orders:'mauy_pedidos'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const local={get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let products=[],site={},orders=[],tab='prod';
const button='rounded-full bg-[#59283B] px-4 py-2 text-sm text-white hover:bg-[#44202E]';
const outline='rounded-full border border-[#59283B] px-4 py-2 text-sm text-[#59283B] hover:bg-[#F5F1EB]';
const input='w-full rounded-xl border border-[#C5A99A] bg-white px-3 py-2 text-sm outline-none focus:border-[#59283B]';
function notice(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}
function save(){local.set(keys.products,products);local.set(keys.site,site);local.set(keys.orders,orders)}
function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function heading(title,subtitle,extra=''){return `<div class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><p class="text-[10px] uppercase tracking-[.25em] text-[#9A8176]">MAUY • ADMIN</p><h1 class="serif mt-1 text-3xl text-[#59283B]">${title}</h1><p class="mt-1 text-sm text-black/55">${subtitle}</p></div>${extra}</div>`}
function productView(){return heading('Produtos','Gerencie o catálogo da loja.',`<button id="new-product" class="${button}">+ Novo produto</button>`)+`<div class="overflow-x-auto rounded-2xl bg-white"><table class="w-full min-w-[650px] text-left text-sm"><thead class="text-[10px] uppercase tracking-wider text-[#92796F]"><tr><th class="p-4">Produto</th><th class="p-4">Categoria</th><th class="p-4">Estoque</th><th class="p-4">Preço</th><th class="p-4 text-right">Ações</th></tr></thead><tbody>${products.map((p,i)=>`<tr class="border-t border-black/5"><td class="p-4"><div class="flex items-center gap-3"><img src="${esc(p.imagem)}" alt="" class="h-14 w-12 object-cover" onerror="this.style.visibility='hidden'"><span class="font-medium">${esc(p.nome)}</span></div></td><td class="p-4">${esc(p.categoria)}</td><td class="p-4">${Number(p.estoque)||0}</td><td class="p-4">${brl(p.preco)}</td><td class="p-4 text-right whitespace-nowrap"><button data-edit="${i}" class="mr-3 underline text-[#59283B]">Editar</button><button data-delete="${i}" class="underline text-red-700">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function couponView(){return heading('Cupons','Cupons que aparecem na loja.',`<button id="new-coupon" class="${button}">+ Novo cupom</button>`)+`<div class="overflow-x-auto rounded-2xl bg-white"><table class="w-full min-w-[560px] text-left text-sm"><thead class="text-[10px] uppercase tracking-wider text-[#92796F]"><tr><th class="p-4">Código</th><th class="p-4">Desconto</th><th class="p-4">Pedido mínimo</th><th class="p-4">Status</th><th class="p-4 text-right">Ações</th></tr></thead><tbody>${(site.cupons||[]).map((c,i)=>`<tr class="border-t border-black/5"><td class="p-4 font-semibold">${esc(c.codigo)}</td><td class="p-4">${c.tipo==='percentual'?`${c.valor}%`:brl(c.valor)}</td><td class="p-4">${brl(c.minimo)}</td><td class="p-4"><button data-toggle-coupon="${i}" class="rounded-full px-3 py-1 text-xs ${c.ativo?'bg-[#59283B] text-white':'bg-black/10 text-black/60'}">${c.ativo?'Ativo':'Inativo'}</button></td><td class="p-4 text-right"><button data-delete-coupon="${i}" class="underline text-red-700">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function ordersView(){return heading('Pedidos','Pedidos criados por este navegador.')+`<div class="rounded-2xl bg-white p-5"><p class="text-sm text-black/55">O checkout atual encaminha os pedidos pelo WhatsApp e não grava pedidos em um servidor. Os pedidos podem não aparecer aqui; esta área não é um sistema centralizado de vendas.</p>${orders.length?`<div class="mt-5 space-y-3">${orders.map((o,i)=>`<div class="border-t border-black/10 pt-3"><strong>Pedido ${i+1} • ${brl(o.total)}</strong><p class="mt-1 text-xs text-black/60">${esc(o.cliente||'')}</p></div>`).join('')}</div>`:''}</div>`}
function dataView(){return heading('Dados e publicação','Edições do painel ficam apenas neste navegador.')+`<div class="max-w-2xl space-y-5 rounded-2xl bg-white p-5"><div class="border-l-2 border-[#C5A99A] pl-4 text-sm leading-6 text-black/65"><b class="text-[#59283B]">Atenção:</b> salvar alterações aqui usa o localStorage deste navegador; elas não são publicadas para todos os clientes nem compartilhadas entre dispositivos. Para alterar a versão pública, exporte os arquivos abaixo e atualize os JSON no GitHub.</div><div class="flex flex-wrap gap-2"><button id="export-products" class="${button}">Baixar produtos.json</button><button id="export-site" class="${button}">Baixar site.json</button></div><hr><button id="reset" class="${outline}">Restaurar dados originais neste navegador</button></div>`}
function render(){ $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#view').innerHTML=({prod:productView,cup:couponView,ped:ordersView,dados:dataView})[tab]();
  $('#new-product')?.addEventListener('click',()=>editProduct());$$('[data-edit]').forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.edit)));$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(`Excluir ${products[Number(b.dataset.delete)].nome}?`)){products.splice(Number(b.dataset.delete),1);save();notice('Produto excluído');render()}});
  $('#new-coupon')?.addEventListener('click',()=>editCoupon());$$('[data-toggle-coupon]').forEach(b=>b.onclick=()=>{const c=site.cupons[Number(b.dataset.toggleCoupon)];c.ativo=!c.ativo;save();render()});$$('[data-delete-coupon]').forEach(b=>b.onclick=()=>{if(confirm('Excluir cupom?')){site.cupons.splice(Number(b.dataset.deleteCoupon),1);save();render()}});
  $('#export-products')?.addEventListener('click',()=>download('produtos.json',products));$('#export-site')?.addEventListener('click',()=>download('site.json',site));$('#reset')?.addEventListener('click',()=>{if(confirm('Remover as alterações salvas neste navegador?')){Object.values(keys).forEach(k=>localStorage.removeItem(k));location.reload()}})
}
function editProduct(index=null){const p=index===null?{nome:'',preco:'',categoria:'Feminina',estoque:0,tamanhos:['P','M','G'],imagem:'',descricao:''}:products[index];$('#modalbox').innerHTML=`<form id="product-form" class="space-y-3"><h2 class="serif text-2xl text-[#59283B]">${index===null?'Novo produto':'Editar produto'}</h2><input class="${input}" name="nome" required placeholder="Nome" value="${esc(p.nome)}"><div class="grid grid-cols-2 gap-3"><input class="${input}" name="preco" type="number" min="0" step="0.01" required placeholder="Preço" value="${Number(p.preco)||''}"><input class="${input}" name="estoque" type="number" min="0" step="1" required placeholder="Estoque" value="${Number(p.estoque)||0}"></div><input class="${input}" name="categoria" required placeholder="Categoria" value="${esc(p.categoria)}"><input class="${input}" name="tamanhos" placeholder="Tamanhos separados por vírgula" value="${esc((p.tamanhos||[]).join(', '))}"><input class="${input}" name="imagem" placeholder="URL da imagem" value="${esc(p.imagem)}"><textarea class="${input}" name="descricao" rows="3" placeholder="Descrição">${esc(p.descricao)}</textarea><div class="flex justify-end gap-2"><button type="button" data-cancel class="${outline}">Cancelar</button><button class="${button}">Salvar produto</button></div></form>`;$('#modal').classList.remove('hidden');$('[data-cancel]').onclick=()=>$('#modal').classList.add('hidden');$('#product-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const product={...p,nome:f.nome.trim(),preco:Number(f.preco),estoque:Number(f.estoque),categoria:f.categoria.trim(),tamanhos:f.tamanhos.split(',').map(s=>s.trim()).filter(Boolean),imagem:f.imagem.trim(),descricao:f.descricao.trim()};if(!product.tamanhos.length)product.tamanhos=['Único'];if(index===null){product.id='PRD-'+Date.now().toString(36).toUpperCase();products.push(product)}else products[index]=product;save();$('#modal').classList.add('hidden');notice('Produto salvo neste navegador');render()}}
function editCoupon(){const coupons=site.cupons||[];$('#modalbox').innerHTML=`<form id="coupon-form" class="space-y-3"><h2 class="serif text-2xl text-[#59283B]">Novo cupom</h2><input class="${input}" name="codigo" required placeholder="CÓDIGO"><select class="${input}" name="tipo"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select><input class="${input}" name="valor" type="number" min="0.01" step="0.01" required placeholder="Desconto"><input class="${input}" name="minimo" type="number" min="0" step="0.01" value="0" placeholder="Pedido mínimo"><div class="flex justify-end gap-2"><button type="button" data-cancel class="${outline}">Cancelar</button><button class="${button}">Criar cupom</button></div></form>`;$('#modal').classList.remove('hidden');$('[data-cancel]').onclick=()=>$('#modal').classList.add('hidden');$('#coupon-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const code=f.codigo.trim().toUpperCase();if(coupons.some(c=>c.codigo.toUpperCase()===code)){notice('Esse código já existe');return}if(f.tipo==='percentual'&&Number(f.valor)>100){notice('O percentual máximo é 100%');return}site.cupons=[...coupons,{codigo:code,tipo:f.tipo,valor:Number(f.valor),minimo:Number(f.minimo)||0,ativo:true}];save();$('#modal').classList.add('hidden');notice('Cupom salvo neste navegador');render()}}
$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')});
(async()=>{try{const [siteRes,productsRes]=await Promise.all([fetch('../site.json'),fetch('../produtos.json')]);if(!siteRes.ok||!productsRes.ok)throw new Error('JSON files unavailable');const baseSite=await siteRes.json(),baseProducts=await productsRes.json();site=local.get(keys.site,baseSite);products=local.get(keys.products,baseProducts);orders=local.get(keys.orders,[]);render()}catch(error){console.error(error);$('#view').innerHTML=`<div class="rounded-2xl bg-white p-6"><h1 class="serif text-2xl text-[#59283B]">Não foi possível carregar o painel</h1><p class="mt-2 text-sm text-black/60">Confira se <code>site.json</code> e <code>produtos.json</code> estão na raiz do site.</p><a class="mt-4 inline-block underline text-[#59283B]" href="../">Voltar à loja</a></div>`}})();
</script>
</body>
</html>
