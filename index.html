<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#59283B">
  <meta name="description" content="MAUY Fitness — activewear clean e sofisticado, do treino à rotina.">
  <title>MAUY Fitness — vista sua força</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#59283B;--sand:#F5F1EB;--nude:#C5A99A;--ink:#29292B}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--sand);color:var(--ink);font-family:'DM Sans',sans-serif}
    .serif{font-family:'Playfair Display',serif}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
    .hero-image{background-position:center;background-size:cover}.product-image{transition:transform .65s cubic-bezier(.2,.7,.2,1)}.product-card:hover .product-image{transform:scale(1.045)}
    .overlay{background:linear-gradient(90deg,rgba(28,18,22,.58),rgba(28,18,22,.08) 80%)}
    .drawer-backdrop{background:rgba(25,18,20,.48);backdrop-filter:blur(3px)}
    @media(max-width:640px){.hero-image{background-position:58% center}}
  </style>
</head>
<body>
  <div id="app"><div class="min-h-screen grid place-items-center text-[#59283B]">Carregando MAUY…</div></div>
  <script>
  'use strict';
  const state={site:null,products:[],cart:[],category:'Todos',query:'',cartOpen:false,couponCode:'',couponApplied:'',cep:'',bannerIndex:0};
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const imgFallback='https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1000&q=80';
  async function loadData(){
    const [s,p]=await Promise.all([fetch('./site.json'),fetch('./produtos.json')]);
    if(!s.ok||!p.ok)throw new Error('Não foi possível encontrar site.json e produtos.json na raiz do site.');
    state.site=await s.json();state.products=await p.json();
    try{state.cart=JSON.parse(localStorage.getItem('mauy_carrinho')||'[]')}catch{state.cart=[]}
  }
  const categories=()=>['Todos',...new Set(state.products.map(p=>p.categoria).filter(Boolean))];
  const cartCount=()=>state.cart.reduce((n,i)=>n+i.qty,0);
  const subtotal=()=>state.cart.reduce((n,i)=>n+i.preco*i.qty,0);
  const coupon=()=>state.site.cupons?.find(c=>c.ativo&&c.codigo.toUpperCase()===state.couponApplied.toUpperCase()&&subtotal()>=Number(c.minimo||0));
  const discount=()=>{const c=coupon();if(!c)return 0;return c.tipo==='percentual'?subtotal()*Number(c.valor)/100:Math.min(subtotal(),Number(c.valor));};
  const shipping=()=>{if(!state.cep)return 0;const digits=state.cep.replace(/\D/g,'');if(!digits)return 0;if(subtotal()>=Number(state.site.frete?.gratisAcima||Infinity))return 0;for(const rule of state.site.frete?.regras||[])for(const range of rule.cep||[]){const [a,b]=range.split(' a ').map(x=>Number(x.replace(/\D/g,'')));if(a&&b&&Number(digits)>=a&&Number(digits)<=b)return Number(rule.valor||0)}return 0};
  const total=()=>Math.max(0,subtotal()+shipping()-discount());
  function persistCart(){localStorage.setItem('mauy_carrinho',JSON.stringify(state.cart))}
  function addProduct(product,size){const found=state.cart.find(i=>i.id===product.id&&i.size===size);if(found)found.qty++;else state.cart.push({id:product.id,nome:product.nome,preco:Number(product.preco),imagem:product.imagem,size,qty:1});persistCart();state.cartOpen=true;render()}
  function qty(id,size,delta){const item=state.cart.find(i=>i.id===id&&i.size===size);if(!item)return;item.qty+=delta;if(item.qty<1)state.cart=state.cart.filter(i=>i!==item);persistCart();render()}
  function validCoupon(code){return state.site.cupons?.find(c=>c.ativo&&c.codigo.toUpperCase()===code.trim().toUpperCase()&&subtotal()>=Number(c.minimo||0))}
  function productCard(p,index){const sizes=p.tamanhos?.length?p.tamanhos:['Único'];const photo=p.imagem||imgFallback;return `<article class="product-card group min-w-0"><div class="relative overflow-hidden bg-[#E8DED7]"><a href="#produto-${esc(p.id)}" aria-label="Ver ${esc(p.nome)}"><img class="product-image aspect-[4/5] w-full object-cover" src="${esc(photo)}" alt="${esc(p.nome)}" loading="lazy" onerror="this.src='${imgFallback}'"></a>${index===0?'<span class="absolute left-3 top-3 bg-[#F5F1EB] px-3 py-1 text-[10px] uppercase tracking-[.18em] text-[#59283B]">Favorito</span>':''}<button data-quick-add="${esc(p.id)}" data-size="${esc(sizes[0])}" aria-label="Adicionar ${esc(p.nome)} ao carrinho" class="absolute bottom-3 right-3 grid h-11 w-11 place-items-center rounded-full bg-[#F5F1EB] text-xl text-[#59283B] shadow transition hover:bg-[#59283B] hover:text-white">+</button></div><div class="pt-4"><p class="text-[10px] uppercase tracking-[.2em] text-[#8F756B]">${esc(p.categoria||'MAUY')}</p><h3 class="mt-1 text-[15px] font-medium">${esc(p.nome)}</h3><div class="mt-2 flex items-center justify-between gap-2"><p class="font-semibold text-[#59283B]">${brl(p.preco)}</p><span class="text-[11px] text-black/50">ou em até 3x</span></div><label class="mt-3 flex items-center gap-2 text-xs text-black/60"><span>Tamanho</span><select data-size-select="${esc(p.id)}" class="rounded-full border border-[#C5A99A] bg-transparent px-3 py-1.5 text-[#29292B]">${sizes.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label></div></article>`}
  function cartMarkup(){const freeAt=Number(state.site.frete?.gratisAcima||0);const toFree=Math.max(0,freeAt-subtotal());return `<div class="fixed inset-0 z-50 ${state.cartOpen?'':'pointer-events-none invisible'}"><button aria-label="Fechar sacola" data-close-cart class="drawer-backdrop absolute inset-0 w-full ${state.cartOpen?'opacity-100':'opacity-0'} transition-opacity"></button><aside class="absolute right-0 top-0 flex h-full w-full max-w-[470px] flex-col bg-[#F5F1EB] shadow-2xl transition-transform ${state.cartOpen?'translate-x-0':'translate-x-full'}"><div class="flex items-center justify-between border-b border-[#C5A99A]/50 px-6 py-5"><div><p class="text-[10px] uppercase tracking-[.25em] text-[#92796F]">Sua seleção</p><h2 class="serif text-2xl text-[#59283B]">Sacola <span class="font-sans text-sm">(${cartCount()})</span></h2></div><button data-close-cart class="grid h-10 w-10 place-items-center rounded-full border border-[#C5A99A] text-xl" aria-label="Fechar">×</button></div><div class="flex-1 overflow-y-auto px-6 py-5">${freeAt?`<div class="mb-5 bg-white p-4"><p class="text-xs">${toFree?`Faltam <b>${brl(toFree)}</b> para ganhar frete grátis.`:'Você ganhou frete grátis!'}</p><div class="mt-2 h-1 bg-[#E6DCD5]"><div class="h-full bg-[#59283B]" style="width:${Math.min(100,subtotal()/freeAt*100)}%"></div></div></div>`:''}${state.cart.length?state.cart.map(i=>`<div class="flex gap-4 border-b border-[#C5A99A]/40 py-4"><img src="${esc(i.imagem||imgFallback)}" class="h-24 w-20 object-cover" alt="${esc(i.nome)}"><div class="flex min-w-0 flex-1 flex-col"><div class="flex justify-between gap-3"><div><h3 class="text-sm font-medium">${esc(i.nome)}</h3><p class="mt-1 text-xs text-black/55">Tamanho: ${esc(i.size)}</p></div><strong class="text-sm text-[#59283B]">${brl(i.preco*i.qty)}</strong></div><div class="mt-auto flex items-center gap-3 pt-3"><button data-qty="-1" data-id="${esc(i.id)}" data-item-size="${esc(i.size)}" class="h-7 w-7 rounded-full border border-[#C5A99A]">−</button><span class="text-xs">${i.qty}</span><button data-qty="1" data-id="${esc(i.id)}" data-item-size="${esc(i.size)}" class="h-7 w-7 rounded-full border border-[#C5A99A]">+</button><button data-remove="${esc(i.id)}" data-item-size="${esc(i.size)}" class="ml-auto text-xs underline">Remover</button></div></div></div>`).join(''):'<div class="py-16 text-center"><p class="serif text-2xl text-[#59283B]">Sua sacola está esperando</p><p class="mt-2 text-sm text-black/55">Descubra peças feitas para acompanhar seu movimento.</p><button data-close-cart class="mt-6 border-b border-[#59283B] pb-1 text-sm text-[#59283B]">Continuar comprando</button></div>'}<div class="mt-6 grid grid-cols-[1fr_auto] gap-2"><input id="coupon-field" value="${esc(state.couponCode)}" placeholder="Cupom de desconto" class="min-w-0 border border-[#C5A99A] bg-white px-3 py-2 text-sm outline-none"><button data-apply-coupon class="bg-[#59283B] px-4 text-xs text-white">APLICAR</button></div>${state.couponApplied?`<p class="mt-2 text-xs ${coupon()?'text-green-800':'text-red-700'}">${coupon()?`Cupom ${esc(state.couponApplied)} aplicado.`:'Cupom inválido ou valor mínimo não atingido.'}</p>`:''}<div class="mt-5"><label for="cep-field" class="text-[10px] uppercase tracking-[.18em] text-black/60">Calcular frete • CEP</label><div class="mt-2 grid grid-cols-[1fr_auto] gap-2"><input id="cep-field" inputmode="numeric" value="${esc(state.cep)}" placeholder="00000-000" class="border border-[#C5A99A] bg-white px-3 py-2 text-sm outline-none"><button data-calc-cep class="border border-[#59283B] px-4 text-xs text-[#59283B]">CALCULAR</button></div></div></div><div class="border-t border-[#C5A99A]/50 bg-white px-6 py-5"><div class="space-y-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><span>${brl(subtotal())}</span></div><div class="flex justify-between"><span>Frete</span><span>${state.cep?brl(shipping()):'Informe o CEP'}</span></div><div class="flex justify-between"><span>Desconto</span><span>−${brl(discount())}</span></div><div class="flex justify-between border-t border-[#C5A99A]/40 pt-3 text-base font-semibold text-[#59283B]"><span>Total</span><span>${brl(total())}</span></div></div><button data-checkout class="mt-4 w-full bg-[#59283B] px-5 py-4 text-xs font-semibold tracking-[.12em] text-white transition hover:bg-[#44202E] ${state.cart.length?'':'opacity-50'}">FINALIZAR PELO WHATSAPP</button><p class="mt-3 text-center text-[10px] text-black/50">Compra segura • Atendimento direto pelo WhatsApp</p></div></aside></div>`}
  function render(){const banner=state.site.banners?.[state.bannerIndex]||state.site.banners?.[0]||{};const filtered=state.products.filter(p=>(state.category==='Todos'||p.categoria===state.category)&&p.nome.toLowerCase().includes(state.query.toLowerCase()));const firstName=(state.site.nome||'MAUY').toUpperCase();$('#app').innerHTML=`<div class="min-h-screen"><div class="bg-[#59283B] px-3 py-2 text-center text-[10px] tracking-[.12em] text-[#F5F1EB] sm:text-xs">${brl(state.site.frete?.gratisAcima||0)} EM COMPRAS: FRETE GRÁTIS • USE MAUY10 NA PRIMEIRA COMPRA</div><header class="sticky top-0 z-40 border-b border-[#59283B]/10 bg-[#F5F1EB]/95 backdrop-blur"><div class="mx-auto flex h-[76px] max-w-[1440px] items-center justify-between gap-4 px-4 md:px-8"><button data-mobile-menu class="grid h-10 w-10 place-items-center text-2xl md:hidden" aria-label="Abrir menu">☰</button><a href="#inicio" class="text-center text-[#59283B]"><span class="block text-[25px] font-semibold tracking-[.25em]">${esc(firstName)}</span><span class="block text-[8px] tracking-[.55em] text-[#9A8176]">FITNESS</span></a><nav class="hidden items-center gap-7 text-[11px] uppercase tracking-[.12em] md:flex"><a href="#colecao" class="hover:text-[#8D6672]">Novidades</a><a href="#colecao" data-nav-category="Feminina" class="hover:text-[#8D6672]">Feminina</a><a href="#colecao" data-nav-category="Acessórios" class="hover:text-[#8D6672]">Acessórios</a><a href="#campanha" class="hover:text-[#8D6672]">Nossa essência</a></nav><div class="flex items-center gap-2"><label class="hidden items-center gap-2 border-b border-[#C5A99A] px-2 py-1 sm:flex"><span>⌕</span><input id="search" value="${esc(state.query)}" placeholder="Buscar" class="w-24 bg-transparent text-xs outline-none focus:w-36 transition-all"></label><button data-open-cart aria-label="Abrir sacola" class="relative grid h-10 w-10 place-items-center text-xl">♧<span class="absolute right-0 top-0 grid h-4 min-w-4 place-items-center rounded-full bg-[#59283B] px-1 text-[9px] text-white">${cartCount()}</span></button></div></div><div id="mobile-nav" class="${state.mobileOpen?'':'hidden'} border-t border-[#59283B]/10 px-5 py-4 md:hidden"><div class="flex flex-wrap gap-5 text-xs uppercase tracking-wider"><a href="#colecao">Novidades</a><a href="#colecao" data-nav-category="Feminina">Feminina</a><a href="#colecao" data-nav-category="Acessórios">Acessórios</a><a href="#campanha">Nossa essência</a></div><input id="mobile-search" value="${esc(state.query)}" placeholder="Buscar produtos" class="mt-4 w-full border-b border-[#C5A99A] bg-transparent py-2 text-sm outline-none"></div></header><main id="inicio"><section class="relative min-h-[510px] overflow-hidden bg-[#4A2937] sm:min-h-[590px]"><div class="hero-image absolute inset-0" style="background-image:url('${esc(banner.imagem||imgFallback)}')"></div><div class="overlay absolute inset-0"></div><div class="relative mx-auto flex min-h-[510px] max-w-[1440px] items-center px-6 py-16 sm:min-h-[590px] md:px-16"><div class="max-w-[570px] text-white"><p class="mb-5 text-[10px] uppercase tracking-[.35em] text-[#E2CFC5]">MAUY FITNESS • MOVA-SE DO SEU JEITO</p><h1 class="serif text-5xl leading-[1.08] sm:text-6xl md:text-7xl">${esc(banner.titulo||'Vista sua força.')}</h1><p class="mt-5 max-w-md text-sm leading-6 text-white/85 sm:text-base">${esc(banner.texto||'Peças que acompanham você em cada movimento.')}</p><a href="#colecao" class="mt-8 inline-flex items-center gap-5 border border-white px-6 py-4 text-[10px] font-semibold tracking-[.18em] transition hover:bg-white hover:text-[#59283B]">${esc(banner.cta||'COMPRE AGORA')} <span>→</span></a><div class="mt-10 flex gap-2">${(state.site.banners||[]).map((_,i)=>`<button data-banner="${i}" aria-label="Banner ${i+1}" class="h-[3px] w-9 ${i===state.bannerIndex?'bg-white':'bg-white/35'}"></button>`).join('')}</div></div></div></section><section class="grid grid-cols-2 border-b border-[#59283B]/10 bg-white sm:grid-cols-4"><div class="px-3 py-5 text-center text-[9px] uppercase tracking-[.15em] text-[#59283B] sm:text-[10px]">Feito para acompanhar você</div><div class="border-l border-[#59283B]/10 px-3 py-5 text-center text-[9px] uppercase tracking-[.15em] text-[#59283B] sm:text-[10px]">Conforto em movimento</div><div class="border-t border-[#59283B]/10 px-3 py-5 text-center text-[9px] uppercase tracking-[.15em] text-[#59283B] sm:border-l sm:border-t-0 sm:text-[10px]">Pagamento facilitado</div><div class="border-l border-t border-[#59283B]/10 px-3 py-5 text-center text-[9px] uppercase tracking-[.15em] text-[#59283B] sm:border-t-0 sm:text-[10px]">Atendimento próximo</div></section><section id="colecao" class="mx-auto max-w-[1440px] px-4 py-14 md:px-8 md:py-20"><div class="flex flex-col justify-between gap-6 sm:flex-row sm:items-end"><div><p class="text-[10px] uppercase tracking-[.28em] text-[#9A8176]">ESCOLHAS MAUY</p><h2 class="serif mt-2 text-4xl text-[#59283B] sm:text-5xl">Feitas para você.</h2><p class="mt-3 max-w-md text-sm text-black/55">Do primeiro alongamento ao último compromisso do dia.</p></div><a href="#colecao" class="hidden border-b border-[#59283B] pb-2 text-[10px] uppercase tracking-[.16em] text-[#59283B] sm:block">Descubra a coleção →</a></div><div class="no-scrollbar mt-8 flex gap-2 overflow-x-auto border-b border-[#59283B]/15 pb-3">${categories().map(c=>`<button data-category="${esc(c)}" class="whitespace-nowrap px-4 py-2 text-[10px] uppercase tracking-[.16em] ${state.category===c?'bg-[#59283B] text-white':'text-[#59283B] hover:bg-[#E9DED7]'}">${esc(c)}</button>`).join('')}</div><div class="mt-6 grid grid-cols-2 gap-x-3 gap-y-8 sm:gap-x-5 sm:gap-y-12 lg:grid-cols-3 xl:grid-cols-4">${filtered.length?filtered.map(productCard).join(''):'<p class="col-span-full py-16 text-center text-sm text-black/55">Não encontramos produtos com essa busca.</p>'}</div></section><section id="campanha" class="relative mx-4 mb-14 overflow-hidden bg-[#E5D8D0] md:mx-8"><div class="grid min-h-[330px] md:grid-cols-2"><div class="flex flex-col justify-center px-7 py-12 md:px-14"><p class="text-[10px] uppercase tracking-[.25em] text-[#856A61]">MAUY • MOVIMENTO COM INTENÇÃO</p><h2 class="serif mt-4 text-4xl leading-tight text-[#59283B]">Seu ritmo.<br>Seu espaço.</h2><p class="mt-4 max-w-sm text-sm leading-6 text-[#51454A]">Uma curadoria para vestir sua rotina com conforto, confiança e personalidade.</p><a href="#colecao" class="mt-7 w-fit border-b border-[#59283B] pb-2 text-[10px] uppercase tracking-[.18em] text-[#59283B]">Encontre sua peça →</a></div><div class="min-h-[240px] bg-cover bg-center" style="background-image:url('${esc(state.site.banners?.[1]?.imagem||imgFallback)}')"></div></div></section><section class="mx-auto max-w-[1440px] px-5 pb-16 text-center"><p class="text-[10px] uppercase tracking-[.25em] text-[#9A8176]">UM PRESENTE PARA COMEÇAR</p><h2 class="serif mt-3 text-3xl text-[#59283B]">10% na primeira compra</h2><p class="mt-2 text-sm text-black/55">Use o cupom <b class="text-[#59283B]">MAUY10</b> no carrinho.</p></section></main><footer class="bg-[#59283B] px-5 py-10 text-[#F5F1EB]"><div class="mx-auto flex max-w-[1440px] flex-col justify-between gap-8 sm:flex-row sm:items-end"><div><div class="text-2xl tracking-[.25em]">${esc(firstName)}</div><p class="mt-2 text-xs tracking-[.3em] text-[#D4BEB2]">FITNESS</p><p class="mt-4 max-w-sm text-xs leading-5 text-white/65">Activewear clean e sofisticado, do treino à rotina.</p></div><div class="flex flex-col gap-3 text-xs"><a href="https://wa.me/${esc(state.site.whatsapp||'5547992708359')}" target="_blank" rel="noopener">Fale com a MAUY pelo WhatsApp ↗</a><a href="#frete">Frete e retirada</a><a href="./admin/" class="text-white/65">Acesso administrativo</a></div></div><div id="frete" class="mx-auto mt-8 max-w-[1440px] border-t border-white/20 pt-5 text-[10px] text-white/55">© ${new Date().getFullYear()} MAUY FITNESS • Feito para acompanhar seu movimento.</div></footer>${cartMarkup()}</div>`;
    $$('[data-open-cart]').forEach(b=>b.onclick=()=>{state.cartOpen=true;render()});$$('[data-close-cart]').forEach(b=>b.onclick=()=>{state.cartOpen=false;render()});
    $$('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;render()});$$('[data-nav-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.navCategory});
    $$('[data-quick-add]').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.id===b.dataset.quickAdd);if(p)addProduct(p,b.dataset.size)});
    $$('[data-size-select]').forEach(s=>s.onchange=()=>{const b=$(`[data-quick-add="${CSS.escape(s.dataset.sizeSelect)}"]`);if(b)b.dataset.size=s.value});
    $$('[data-qty]').forEach(b=>b.onclick=()=>qty(b.dataset.id,b.dataset.itemSize,Number(b.dataset.qty)));
    $$('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(i=>!(i.id===b.dataset.remove&&i.size===b.dataset.itemSize));persistCart();render()});
    $$('[data-banner]').forEach(b=>b.onclick=()=>{state.bannerIndex=Number(b.dataset.banner);render()});
    $('#search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;state.query=e.target.value;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos)});
    $('#mobile-search')?.addEventListener('input',e=>{state.query=e.target.value;state.mobileOpen=true;render()});
    $('[data-mobile-menu]')?.addEventListener('click',()=>{state.mobileOpen=!state.mobileOpen;render()});
    $('[data-apply-coupon]')?.addEventListener('click',()=>{state.couponCode=$('#coupon-field').value.trim();state.couponApplied=state.couponCode;render()});
    $('[data-calc-cep]')?.addEventListener('click',()=>{state.cep=$('#cep-field').value.trim();render()});
    $('[data-checkout]')?.addEventListener('click',()=>{if(!state.cart.length)return;const message=['Olá! Quero fazer este pedido na MAUY:',...state.cart.map(i=>`• ${i.nome} | Tam. ${i.size} | ${i.qty}x ${brl(i.preco)} = ${brl(i.preco*i.qty)}`),`Subtotal: ${brl(subtotal())}`,`Frete: ${state.cep?brl(shipping()):'a combinar'}`,...(coupon()?[`Cupom: ${coupon().codigo} (-${brl(discount())})`]:[]),`Total: ${brl(total())}`,`CEP: ${state.cep||'a informar'}`].join('\n');window.open(`https://wa.me/${encodeURIComponent(state.site.whatsapp||'5547992708359')}?text=${encodeURIComponent(message)}`,'_blank','noopener')});
  }
  async function init(){try{await loadData();render()}catch(err){console.error(err);$('#app').innerHTML=`<main class="grid min-h-screen place-items-center px-6 text-center"><div><p class="text-[10px] uppercase tracking-[.3em] text-[#9A8176]">MAUY FITNESS</p><h1 class="serif mt-4 text-3xl text-[#59283B]">Estamos preparando a loja</h1><p class="mt-3 max-w-md text-sm text-black/60">Não foi possível carregar os produtos. Verifique se <code>site.json</code> e <code>produtos.json</code> estão publicados na raiz do site.</p></div></main>`}}
  init();
  </script>
</body>
</html>
