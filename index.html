<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel | MAUY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{font-family:Poppins,system-ui,sans-serif}.on{background:#59283B;color:#F5F1EB}</style>
</head>
<body class="bg-[#F5F1EB] text-[#29292B]">
<div class="flex min-h-screen flex-col md:flex-row">
  <nav class="md:w-56 bg-white border-b md:border-r border-black/10 p-4 flex md:flex-col gap-2 overflow-x-auto">
    <div class="text-xl tracking-[.25em] text-[#59283B] font-medium md:mb-4 pr-4">MAUY<span class="block text-[10px] tracking-widest text-[#C5A99A]">PAINEL</span></div>
    <button data-tab="dash" class="tab text-left rounded-xl px-3 py-2 text-sm whitespace-nowrap">Visão geral</button>
    <button data-tab="prod" class="tab text-left rounded-xl px-3 py-2 text-sm whitespace-nowrap">Produtos</button>
    <button data-tab="ped" class="tab text-left rounded-xl px-3 py-2 text-sm whitespace-nowrap">Pedidos</button>
    <button data-tab="cup" class="tab text-left rounded-xl px-3 py-2 text-sm whitespace-nowrap">Cupons</button>
    <button data-tab="cfg" class="tab text-left rounded-xl px-3 py-2 text-sm whitespace-nowrap">Dados / Exportar</button>
    <a href="../" class="md:mt-auto text-sm text-[#59283B] underline px-3 py-2 whitespace-nowrap">← Ver loja</a>
  </nav>
  <main class="flex-1 p-4 sm:p-8"><div id="view"></div></main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 p-4 overflow-y-auto"><div id="modalBox" class="max-w-lg mx-auto mt-10 bg-white rounded-2xl p-6"></div></div>
<div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] space-y-2"></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K={prod:'mauy_produtos',site:'mauy_site',ped:'mauy_pedidos'};
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const loadData=async(k,url)=>store.get(k,null)??await fetch(url).then(r=>r.json());
function toast(m,t='ok'){const e=document.createElement('div');e.className=`px-4 py-2 rounded-full text-sm shadow-lg text-white ${t==='err'?'bg-red-700':'bg-[#59283B]'}`;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2200)}
const inp='w-full rounded-xl border border-[#C5A99A] px-3 py-2 text-sm bg-white';
const btn='rounded-full bg-[#59283B] text-[#F5F1EB] px-4 py-2 text-sm font-medium';
const btn2='rounded-full border border-[#59283B] text-[#59283B] px-4 py-2 text-sm';
let site,produtos,pedidos,tab='dash';

const openModal=h=>{$('#modalBox').innerHTML=h;$('#modal').classList.remove('hidden')};
const closeModal=()=>$('#modal').classList.add('hidden');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const saveP=()=>store.set(K.prod,produtos),saveS=()=>store.set(K.site,site),saveO=()=>store.set(K.ped,pedidos);
const head=(t,extra='')=>`<div class="flex flex-wrap items-center justify-between gap-3 mb-6"><h1 class="text-2xl font-medium text-[#59283B]">${t}</h1>${extra}</div>`;

/* ---------- Visão geral ---------- */
function vDash(){
  const validos=pedidos.filter(p=>p.status!=='Cancelado');
  const receita=validos.reduce((s,p)=>s+p.total,0),un=validos.reduce((s,p)=>s+p.itens.reduce((a,i)=>a+i.qtd,0),0);
  const baixo=produtos.filter(p=>p.estoque<=3);
  const rank={};validos.forEach(p=>p.itens.forEach(i=>rank[i.nome]=(rank[i.nome]||0)+i.qtd));
  const top=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const card=(l,v)=>`<div class="bg-white rounded-2xl p-5 shadow-sm"><div class="text-xs uppercase tracking-wider text-[#C5A99A]">${l}</div><div class="text-2xl font-semibold text-[#59283B] mt-1">${v}</div></div>`;
  return head('Visão geral')+`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${card('Receita',brl(receita))}${card('Pedidos',pedidos.length)}${card('Unidades vendidas',un)}${card('Ticket médio',brl(validos.length?receita/validos.length:0))}</div>
  <div class="grid md:grid-cols-2 gap-4 mt-4">
    <div class="bg-white rounded-2xl p-5"><h3 class="font-medium mb-3">Mais vendidos</h3>${top.length?top.map(([n,q])=>`<div class="flex justify-between text-sm py-1 border-b border-black/5"><span>${esc(n)}</span><span>${q}</span></div>`).join(''):'<p class="text-sm text-black/60">Sem vendas ainda.</p>'}</div>
    <div class="bg-white rounded-2xl p-5"><h3 class="font-medium mb-3">Estoque baixo (≤3)</h3>${baixo.length?baixo.map(p=>`<div class="flex justify-between text-sm py-1 border-b border-black/5"><span>${esc(p.nome)}</span><span>${p.estoque}</span></div>`).join(''):'<p class="text-sm text-black/60">Tudo em ordem.</p>'}</div>
  </div><p class="text-sm text-black/60 mt-4">${produtos.length} produtos cadastrados · ${(site.cupons||[]).filter(c=>c.ativo).length} cupons ativos</p>`;
}

/* ---------- Produtos ---------- */
function vProd(){
  return head('Produtos',`<button id="novoProd" class="${btn}">+ Novo produto</button>`)+`<div class="bg-white rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-[#59283B] uppercase text-[10px] tracking-[.18em]"><tr><th class="p-3">Produto</th><th class="p-3">Categoria</th><th class="p-3">Estoque</th><th class="p-3">Preço</th><th class="p-3 text-right">Ações</th></tr></thead><tbody>${produtos.map((p,i)=>`<tr class="border-t border-black/5"><td class="p-3 flex items-center gap-3"><img src="${esc(p.imagem)}" onerror="this.style.visibility='hidden'" class="h-12 w-10 object-cover rounded-md bg-[#F5F1EB]" alt="${esc(p.nome)}"><div><div class="font-medium">${esc(p.nome)}</div><div class="text-black/50 text-xs">${esc(p.tamanhos?.join(', ')||'')}</div></div></td><td class="p-3">${esc(p.categoria)}</td><td class="p-3">${p.estoque}</td><td class="p-3">${brl(p.preco)}</td><td class="text-right pr-3 whitespace-nowrap"><button data-ed="${i}" class="underline text-[#59283B] mr-3">Editar</button><button data-del="${i}" class="underline text-red-700">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
}
function formProd(i){
  const p=i==null?{id:'',nome:'',preco:'',categoria:'Feminina',estoque:0,tamanhos:['P','M','G'],imagem:'',descricao:''}:produtos[i];
  openModal(`<form id="fp" class="space-y-3"><h3 class="text-lg font-medium text-[#59283B]">${i==null?'Novo':'Editar'} produto</h3>
  <input name="nome" required placeholder="Nome" value="${esc(p.nome)}" class="${inp}">
  <div class="grid grid-cols-2 gap-3"><input name="preco" required type="number" min="0" step="0.01" placeholder="Preço" value="${p.preco}" class="${inp}"><input name="estoque" required type="number" min="0" step="1" placeholder="Estoque" value="${p.estoque}" class="${inp}"></div>
  <input name="categoria" required list="cats" placeholder="Categoria" value="${esc(p.categoria)}" class="${inp}"><datalist id="cats">${[...new Set(produtos.map(x=>x.categoria))].map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>
  <input name="tamanhos" placeholder="Tamanhos separados por vírgula" value="${esc((p.tamanhos||[]).join(', '))}" class="${inp}">
  <input name="imagem" placeholder="URL da imagem" value="${esc(p.imagem)}" class="${inp}">
  <textarea name="descricao" rows="3" placeholder="Descrição" class="${inp}">${esc(p.descricao)}</textarea>
  <div class="flex gap-2 justify-end"><button type="button" id="cx" class="${btn2}">Cancelar</button><button class="${btn}">Salvar</button></div></form>`);
  $('#cx').onclick=closeModal;
  $('#fp').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const novo={...p,nome:f.nome.trim(),preco:+f.preco,estoque:parseInt(f.estoque),categoria:f.categoria.trim(),tamanhos:f.tamanhos.split(',').map(s=>s.trim()).filter(Boolean),imagem:f.imagem.trim(),descricao:f.descricao.trim()};
    if(!novo.tamanhos.length)novo.tamanhos=['Único'];
    if(i==null){novo.id='PRD-'+Date.now().toString(36).toUpperCase();produtos.push(novo)}else produtos[i]=novo;
    saveP();closeModal();toast('Produto salvo');render();
  }
}

/* ---------- Pedidos ---------- */
const STATUS=['Novo','Pago','Enviado','Entregue','Cancelado'];
function vPed(){
  return head('Pedidos')+(pedidos.length?`<div class="space-y-3">${[...pedidos].reverse().map(p=>{const i=pedidos.indexOf(p);return `<div class="bg-white rounded-2xl p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><h3 class="font-medium text-[#59283B]">Pedido #${p.id||i+1}</h3><div class="text-sm mt-1">${esc(p.cliente)} · ${esc(p.whatsapp)} · ${esc(p.pagamento)}${p.endereco?' · '+esc(p.endereco):''}</div></div><span class="text-xs uppercase tracking-wider text-[#C5A99A]">${esc(p.status)}</span></div><ul class="text-sm text-black/70 mt-2">${p.itens.map(it=>`<li>${it.qtd}× ${esc(it.nome)} (${esc(it.tam)}) — ${brl(it.preco*it.qtd)}</li>`).join('')}</ul><div class="text-xs text-black/50 mt-1">Frete ${p.frete?brl(p.frete):'grátis'} (${esc(p.entrega)})${p.cupom?` · Cupom ${esc(p.cupom)} −${brl(p.desconto)}`:''}</div><div class="flex gap-2 mt-3 items-center"><select data-st="${i}" class="${inp} !w-auto">${STATUS.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select><button data-dp="${i}" class="underline text-red-700 text-sm">Excluir</button></div></div>`}).join('')}</div>`:'<p class="text-sm text-black/60">Nenhum pedido registrado.</p>');
}

/* ---------- Cupons ---------- */
function vCup(){
  return head('Cupons de desconto',`<button id="novoCup" class="${btn}">+ Novo cupom</button>`)+`<div class="bg-white rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-[#59283B] uppercase text-[10px] tracking-[.18em]"><tr><th class="p-3">Código</th><th class="p-3">Tipo</th><th class="p-3">Mínimo</th><th class="p-3">Status</th><th class="p-3 text-right">Ações</th></tr></thead><tbody>${(site.cupons||[]).map((c,i)=>`<tr class="border-t border-black/5"><td class="p-3 font-medium">${esc(c.codigo)}</td><td class="p-3">${c.tipo==='percentual'?c.valor+'%':brl(c.valor)}</td><td class="p-3">${brl(c.minimo)}</td><td class="p-3"><button data-tg="${i}" class="rounded-full px-2 py-1 text-xs ${c.ativo?'bg-[#59283B] text-white':'bg-black/5 text-black/60'}">${c.ativo?'Ativo':'Inativo'}</button></td><td class="p-3 text-right"><button data-dc="${i}" class="underline text-red-700">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
}
function formCup(){
  openModal(`<form id="fc" class="space-y-3"><h3 class="text-lg font-medium text-[#59283B]">Novo cupom</h3>
  <input name="codigo" required placeholder="CÓDIGO" class="${inp} uppercase">
  <div class="grid grid-cols-2 gap-3"><select name="tipo" class="${inp}"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select><input name="valor" required type="number" min="0" step="0.01" placeholder="Valor" value="10" class="${inp}"></div>
  <input name="minimo" type="number" min="0" step="0.01" placeholder="Pedido mínimo (R$)" value="0" class="${inp}">
  <div class="flex gap-2 justify-end"><button type="button" id="cx" class="${btn2}">Cancelar</button><button class="${btn}">Criar</button></div></form>`);
  $('#cx').onclick=closeModal;
  $('#fc').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const cod=f.codigo.trim().toUpperCase();
    if((site.cupons||[]).some(c=>c.codigo===cod))return toast('Já existe um cupom com esse código','err');
    if(f.tipo==='percentual'&&+f.valor>100)return toast('Percentual máximo: 100','err');
    site.cupons=[...(site.cupons||[]),{codigo:cod,tipo:f.tipo,valor:+f.valor,minimo:+f.minimo||0,ativo:true}];saveS();closeModal();toast('Cupom criado');render();
  }
}

/* ---------- Dados ---------- */
function vCfg(){
  return head('Dados e exportação')+`<div class="bg-white rounded-2xl p-5 space-y-4 text-sm max-w-xl">
  <p>As alterações ficam salvas no <b>localStorage</b> deste navegador e a loja já usa esses dados. Para publicar de forma definitiva no GitHub, exporte os JSON e substitua os arquivos em <code>site.json</code> e <code>produtos.json</code>.</p>
  <div class="flex flex-wrap gap-2"><button id="exP" class="${btn}">Baixar produtos.json</button><button id="exS" class="${btn}">Baixar site.json</button><button id="exO" class="${btn2}">Baixar pedidos.json</button></div>
  <hr><p>Restaurar remove as alterações locais (produtos, cupons, pedidos e carrinho) e volta aos arquivos JSON originais.</p><button id="reset" class="rounded-full border border-red-700 text-red-700 px-4 py-2 text-sm">Restaurar dados</button>
</div>`;
}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}

/* ---------- Render / eventos ---------- */
function render(){
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  $('#view').innerHTML={dash:vDash,prod:vProd,ped:vPed,cup:vCup,cfg:vCfg}[tab]();
  $('#novoProd')?.addEventListener('click',()=>formProd());
  $$('[data-ed]').forEach(b=>b.onclick=()=>formProd(+b.dataset.ed));
  $$('[data-del]').forEach(b=>b.onclick=()=>{const p=produtos[b.dataset.del];if(confirm(`Excluir "${p.nome}"?`)){produtos.splice(b.dataset.del,1);saveP();toast('Produto excluído');render()}});
  $$('[data-st]').forEach(s=>s.onchange=()=>{pedidos[s.dataset.st].status=s.value;saveO();toast('Status atualizado')});
  $$('[data-dp]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este pedido?')){pedidos.splice(b.dataset.dp,1);saveO();toast('Pedido excluído');render()}});
  $('#novoCup')?.addEventListener('click',formCup);
  $$('[data-tg]').forEach(b=>b.onclick=()=>{const c=site.cupons[b.dataset.tg];c.ativo=!c.ativo;saveS();render()});
  $$('[data-dc]').forEach(b=>b.onclick=()=>{if(confirm('Excluir cupom?')){site.cupons.splice(b.dataset.dc,1);saveS();toast('Cupom excluído');render()}});
  $('#exP')?.addEventListener('click',()=>dl('produtos.json',produtos));
  $('#exS')?.addEventListener('click',()=>dl('site.json',site));
  $('#exO')?.addEventListener('click',()=>dl('pedidos.json',pedidos));
  $('#reset')?.addEventListener('click',()=>{if(confirm('Apagar todas as alterações locais?')){['mauy_produtos','mauy_site','mauy_pedidos','mauy_carrinho'].forEach(k=>localStorage.removeItem(k));location.reload()}});
}
$$('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render()});
(async()=>{
  try{[site,produtos]=await Promise.all([loadData(K.site,'./site.json'),loadData(K.prod,'./produtos.json')]);pedidos=store.get(K.ped,[]);render();}
  catch(e){console.error(e);$('#view').innerHTML='<p>Não foi possível carregar os dados. Confirme se site.json e produtos.json estão publicados na raiz do site.</p>'}
})();
</script>
</body>
</html>
