<style>
:root{--sand:#F5F1EB;--ink:#29292B;--nude:#C5A99A;--pale:#E9DDD3;--wine:#59283B;--ti:#59283B;--card:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--sand:#1c1819;--ink:#F5F1EB;--pale:#2a2325;--wine:#8A4660;--ti:#E9DDD3;--card:#252021;color-scheme:dark}.logo img.lg-l{display:none}.logo img.lg-d{display:block}}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,sans-serif}
body{background:var(--sand);color:var(--ink);line-height:1.55;font-size:14px}
a{color:inherit;text-decoration:none}button{cursor:pointer;color:inherit;background:none;border:0;font-size:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
.promo{background:var(--wine);color:#fff;text-align:center;padding:9px;font-size:11px;letter-spacing:.14em;font-weight:500}
header{position:sticky;top:0;z-index:10;background:var(--sand);border-bottom:1px solid var(--pale)}
.head{height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.logo img{height:50px;width:auto;display:block}.logo img.lg-d{display:none}
nav{display:flex;gap:18px;font-size:12px;white-space:nowrap}nav button{opacity:.8}nav button:hover{opacity:1}
.act{display:flex;gap:8px;justify-content:flex-end}
.ic{border:1px solid var(--pale);border-radius:99px;padding:7px 15px;font-size:13px}
.ic b{background:var(--wine);color:#fff;border-radius:99px;padding:0 7px;margin-left:5px;font-weight:500;font-size:12px}
.srch{display:none;padding-bottom:12px}.srch.on{display:block}
input,select,textarea{font:inherit;font-size:13px;padding:10px 14px;border:1px solid var(--nude);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.btn{display:inline-flex;justify-content:center;align-items:center;background:var(--wine);color:#fff;border-radius:30px;padding:13px 26px;font-size:12px;font-weight:600;letter-spacing:.08em;transition:opacity .2s}
.btn:hover{opacity:.88}.btn.l{background:var(--sand);color:#59283B;margin-top:22px}.btn.g{background:none;color:var(--ink);border:1px solid var(--nude)}.btn.s{padding:8px 16px;font-size:11px}
/* carrossel */
.car{position:relative;overflow:hidden;touch-action:pan-y}.trk{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}.trk>*{flex:0 0 100%;min-width:0}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#f5f1ebd9;color:#59283B;font-size:22px;z-index:3;display:grid;place-items:center}.ar.p{left:14px}.ar.n{right:14px}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}.dots button{width:9px;height:9px;border-radius:50%;background:#ffffff80;padding:0}.dots button.on{background:#fff;width:26px;border-radius:9px}
.sl{min-height:560px;display:flex;align-items:center;color:#fff;background:linear-gradient(120deg,#3e1b2b,var(--wine)) center/cover;position:relative}
.sl:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#211418c0,#21141815)}
.hc{position:relative;padding:70px 0}
.ey{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--nude);font-weight:600}
.sl h1{font-weight:600;font-size:clamp(34px,6vw,64px);line-height:1.12;max-width:700px;margin:12px 0 18px}.sl p.t{max-width:460px;opacity:.9}
.sec{padding:54px 0 10px}.sec h2,.bn h2{font-weight:600;font-size:clamp(24px,3vw,34px);color:var(--ti)}.sec p.d{opacity:.7;margin:4px 0 20px}
.gal{position:relative}.gs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}.gs::-webkit-scrollbar{display:none}
.gs figure{flex:0 0 clamp(220px,26vw,300px);scroll-snap-align:start;position:relative}
.gs .ph{aspect-ratio:4/5}.gs figcaption{position:absolute;inset:auto 0 0;padding:34px 14px 14px;color:#fff;background:linear-gradient(transparent,#171115c0);font-size:12px}
.gal .ar{background:#f5f1ee}
.fl{display:flex;gap:9px;overflow:auto;padding:6px 0 20px}.fl button{white-space:nowrap;border:1px solid var(--nude);border-radius:30px;padding:8px 18px;font-size:12px;color:var(--ti)}.fl button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 20px;padding:6px 0 76px}
.card{text-align:left;min-width:0}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,var(--pale),color-mix(in srgb,var(--nude) 55%,var(--pale)));position:relative;overflow:hidden;display:grid;place-items:center}

.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s;position:absolute;inset:0}.card:hover .ph img{transform:scale(1.04)}
.tag{position:absolute;left:12px;top:12px;background:var(--wine);color:#fff;padding:4px 10px;border-radius:22px;font-size:10px;letter-spacing:.08em;z-index:1}
.card h3{font-size:14px;font-weight:500;margin:12px 0 2px}.pr{color:var(--ti);font-weight:600}.old{text-decoration:line-through;opacity:.55;font-weight:400;margin-right:8px;font-size:12px}.px{font-size:12px;opacity:.7;font-weight:400}
.empty{grid-column:1/-1;text-align:center;padding:48px;opacity:.7}
.bn{text-align:center;background:var(--pale);padding:48px 20px;margin-bottom:70px}.bn p{opacity:.75;margin:8px 0 20px}
footer{background:#29292B;color:#F5F1EB;padding:44px 0 22px}.fi{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.fi p{font-size:12px;max-width:320px;opacity:.75}.fi a,.fi button{display:block;font-size:12px;margin:7px 0}.fi img{height:56px}
.cp{text-align:center;border-top:1px solid #ffffff22;margin-top:32px;padding-top:18px;font-size:10px;opacity:.6}
.sh{position:fixed;inset:0;background:#19121480;z-index:30;display:none}.sh.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--sand);z-index:31;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column}.dr.on{transform:none}
.dh{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--pale);font-weight:600;font-size:20px;color:var(--ti)}
.db{flex:1;overflow:auto;padding:8px 22px}.df{padding:16px 22px 22px;background:var(--card);font-size:13px}
.bar{height:5px;background:var(--pale);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--wine);transition:width .4s}
.ln{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--pale);font-size:13px}
.q{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--nude);border-radius:99px;margin-top:6px}.q button{width:26px;height:26px}
.rw{display:flex;gap:8px;margin-top:9px}.rw .btn{padding:0 16px;white-space:nowrap}.ms{font-size:12px;min-height:18px;margin-top:4px}
.sm div{display:flex;justify-content:space-between;padding:2px 0}.sm .t{font-weight:700;font-size:16px;border-top:1px solid var(--nude);margin-top:6px;padding-top:8px}
.pix{background:var(--pale);border-left:3px solid var(--nude);padding:9px 12px;font-size:12px;margin:10px 0;border-radius:3px}
.md{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:#19121480}.md.on{display:grid}
.mb{position:relative;background:var(--sand);width:min(840px,100%);max-height:92dvh;overflow:auto;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mb .car .ar{width:34px;height:34px;font-size:18px}.mb .dots{bottom:10px}
.mb h2{font-weight:600;font-size:26px;color:var(--ti)}.x{position:absolute;right:14px;top:8px;font-size:26px;z-index:4}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 22px}.pl button{min-width:44px;padding:7px 14px;border:1px solid var(--nude);border-radius:99px}.pl button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--nude);font-size:12px;margin-top:22px}.tabs button{padding:7px 0;opacity:.6}.tabs button.on{opacity:1;border-bottom:2px solid var(--wine);font-weight:600}.tc{padding:12px 0;font-size:13px}
.toast{position:fixed;z-index:80;bottom:20px;left:50%;transform:translateX(-50%);background:#29292B;color:#fff;padding:10px 20px;border-radius:30px;font-size:12px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.f{display:block;font-size:11px;font-weight:500}.f input,.f textarea{margin-top:4px;font-weight:400}.f.w{grid-column:1/-1}.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.hint{font-size:12px;opacity:.75;margin-bottom:12px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs span{position:relative}.thumbs img{width:56px;height:70px;object-fit:cover;border-radius:6px}.thumbs button{position:absolute;top:-6px;right:-6px;background:var(--wine);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.mb{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.head{grid-template-columns:1fr auto;height:68px}.logo img{height:42px}nav{display:none}.fg{grid-template-columns:1fr}.sl{min-height:460px}.ar{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.sl.hi{background:var(--d) center/cover}
@media(max-width:560px){.sl.hi{background:var(--m,var(--d)) center/cover}}
.ben{background:var(--wine);color:#fff;padding:12px 0;font-size:12px;margin-top:30px}
.ben .wrap{display:flex;gap:10px 28px;flex-wrap:wrap;justify-content:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dv{display:flex;align-items:end;min-height:260px;padding:20px;color:#fff;font-weight:600;font-size:20px;background:var(--pale) center/cover;border-radius:4px;text-shadow:0 1px 8px #0008}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.dep{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.dep div{background:var(--card);padding:18px;border-radius:10px}
@media(max-width:560px){.duo{grid-template-columns:1fr}}

/* ---- barra de anúncios (carrossel) ---- */
.promo{padding:0;height:38px;overflow:hidden;position:relative;text-transform:uppercase}
.promo .pt{display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.promo .pt span{flex:0 0 38px;height:38px;line-height:38px;padding:0 46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .pa{position:absolute;top:0;width:38px;height:38px;color:#fff;font-size:18px;opacity:.65;z-index:2}.promo .pa:hover{opacity:1}.promo .pa.p{left:4px}.promo .pa.n{right:4px}
/* ---- selos de estoque ---- */
.tag.es{background:#29292B}.tag.lo{background:#a94446}.card.so .ph img{filter:grayscale(1);opacity:.55}
/* ---- modal do produto ---- */
.mb{width:min(980px,100%);align-items:start}.mb .full{grid-column:1/-1}
.gv{position:relative;min-width:0}
.gm{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--pale);cursor:zoom-in;touch-action:pan-y}
.gm img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;transform-origin:50% 50%}
.gm.z{cursor:zoom-out}.gm.z img{transform:scale(2.3)}
.gm.vd{cursor:auto}.gm iframe,.gm video{position:absolute;inset:0;width:100%;height:100%;border:0}
.gm>.ph{position:absolute;inset:0;aspect-ratio:auto}.gm .ar{width:34px;height:34px;font-size:18px}
.gn{position:absolute;right:10px;bottom:10px;background:#0007;color:#fff;font-size:11px;padding:3px 10px;border-radius:99px}
.gt{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.gt button{flex:0 0 56px;aspect-ratio:3/4;padding:0;border:2px solid transparent;opacity:.65;overflow:hidden;background:var(--pale)}
.gt button.on{border-color:var(--wine);opacity:1}.gt img{width:100%;height:100%;object-fit:cover;display:block}.gt .vb{display:grid;place-items:center;font-size:16px;color:var(--wine)}
.lb{font-size:12px;font-weight:500;margin:16px 0 0}
.off{background:var(--pale);color:var(--wine);font-size:11px;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--sand);box-shadow:0 0 0 1px var(--nude);padding:0}.sw button.on{box-shadow:0 0 0 2px var(--wine)}.sw button.so{opacity:.35}
.pl{margin:8px 0 14px}.pl button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.stk{font-size:12px;margin:0 0 12px}.stk.lo{color:#a94446;font-weight:500}
.ac{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ac .btn{flex:1}
.qt{display:inline-flex;align-items:center;border:1px solid var(--nude);border-radius:99px}.qt button{width:36px;height:40px;font-size:18px}.qt span{min-width:24px;text-align:center}
.shr{font-size:12px;margin-bottom:6px}.shr button{opacity:.75;text-decoration:underline}
.mf .rw input{flex:1}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.adv label{font-size:11px}.adv input{width:100%;margin-top:3px}
.advr{margin:10px 0;font-size:13px}.advr .btn{margin-top:8px}
.mt{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}.mt th,.mt td{border-bottom:1px solid var(--pale);padding:6px 4px;text-align:left}
.rel{display:grid;grid-template-columns:repeat(4,minmax(0,150px));justify-content:start;gap:12px}.rel button{text-align:left;font-size:12px;display:grid;gap:3px}.rel b{font-weight:500}
.lgpd{position:fixed;left:14px;right:14px;bottom:14px;max-width:520px;z-index:35;background:#29292B;color:#fff;padding:14px 16px;border-radius:10px;font-size:12px;display:flex;gap:14px;align-items:center}.lgpd p{margin:0}
/* setas do carrossel não cobrem o texto do banner */
.car .hc{padding-left:64px;padding-right:64px}
@media(max-width:560px){.car .hc{padding-left:0;padding-right:0}}
@media(max-width:850px){.gm{aspect-ratio:1/1}.rel{grid-template-columns:repeat(2,minmax(0,150px))}.gv{max-width:420px;margin:auto;width:100%}.rel{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=JSON.parse($('#dados-padrao').textContent);
const S={cat:'Todos',q:'',cart:[],cup:0,cupom:null,frete:null,pid:null,sz:null,col:null,qty:1,tab:0,ci:0,med:[]},TM={};
try{S.cart=JSON.parse(localStorage.getItem('mauy_cart'))||[]}catch(e){}
const keep=()=>{try{localStorage.setItem('mauy_cart',JSON.stringify(S.cart))}catch(e){}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const prods=()=>D.produtos.filter(p=>p.ativo!==false);
const url=u=>String(u||'').replace(/["'\\()]/g,'');
const photo=(p,tag)=>{const im=(p.imagens||[])[0];return `<div class="ph${im?'':' ne'}">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.nome)}">`:''}${tag?badge(p):''}</div>`};

/* ---------- estoque, frete, cupons, SEO, barra de anúncios ---------- */
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* Só bloqueia venda se o produto tem estoque lançado ou se o painel marcou "bloquear sem estoque". */
const tracked=p=>p.controlarEstoque===true||Object.values(p.variantes||{}).some(n=>+n>0);
function stockOf(p,c,s){if(!tracked(p))return Infinity;let t=0;for(const[k,n]of Object.entries(p.variantes||{})){const i=k.lastIndexOf('|'),kc=k.slice(0,i),ks=k.slice(i+1);if((c==null||kc===c)&&(s==null||ks===s))t+=+n||0}return t}
const soldOut=p=>stockOf(p)<=0;
const lowStock=p=>{const t=stockOf(p);return isFinite(t)&&t>0&&t<=(+p.estoqueMinimo||3)};
const badge=p=>soldOut(p)?'<span class="tag es">Esgotado</span>':lowStock(p)?'<span class="tag lo">Últimas unidades</span>':p.precoAntigo>p.preco?'<span class="tag">Oferta</span>':'';
const cores=p=>(p.cores||[]).filter(c=>c&&c.nome);
function clampCart(){let ch=false;S.cart.forEach(i=>{const p=D.produtos.find(x=>x.id==i.id);if(!p)return;const lim=stockOf(p,i.col??null,i.size);if(isFinite(lim)&&i.qty>lim){i.qty=lim;ch=true}});const n=S.cart.length;S.cart=S.cart.filter(i=>i.qty>0);if(ch||n!=S.cart.length)keep()}

/* frete por estado (CEP → UF) usando a tabela do painel */
const UFS=[[1000,19999,'SP'],[20000,28999,'RJ'],[29000,29999,'ES'],[30000,39999,'MG'],[40000,48999,'BA'],[49000,49999,'SE'],[50000,56999,'PE'],[57000,57999,'AL'],[58000,58999,'PB'],[59000,59999,'RN'],[60000,63999,'CE'],[64000,64999,'PI'],[65000,65999,'MA'],[66000,68899,'PA'],[68900,68999,'AP'],[69000,69299,'AM'],[69300,69399,'RR'],[69400,69899,'AM'],[69900,69999,'AC'],[70000,72799,'DF'],[72800,72999,'GO'],[73000,73699,'DF'],[73700,76799,'GO'],[76800,76999,'RO'],[77000,77999,'TO'],[78000,78899,'MT'],[79000,79999,'MS'],[80000,87999,'PR'],[88000,89999,'SC'],[90000,99999,'RS']];
const ufDe=c=>{const n=Math.floor(+c/1000);return(UFS.find(([a,b])=>n>=a&&n<=b)||[])[2]};
function freteDe(cep){const uf=ufDe(String(cep).slice(0,8)),r=(D.site.freteEstados||[]).find(x=>x.uf===uf),post=+D.site.postagem||0;return r?{v:+r.valor||0,a:post+(+r.prazo||0),uf}:{v:+D.site.freteBase||24.9,a:post+5,uf}}
function calcFrete(raw){const v=String(raw||'').replace(/\D/g,'');S.cep=raw;if(v.length!=8){S.frete=null;S.cm='Digite um CEP com 8 números.';return}const r=freteDe(v);S.frete=r.v;S.cm=`Entrega em até ${r.a} dias úteis${r.uf?' · '+r.uf:''} · ${brl(r.v)}${+D.site.gratis?` (grátis acima de ${brl(D.site.gratis)})`:''}.`}

/* cupons: percentual ou valor fixo, com compra mínima e validade */
const pct=c=>c.tipo==='fixo'?0:Number(c.p??c.v)||0,fix=c=>c.tipo==='fixo'?Number(c.v)||0:0;
const disc=()=>{const c=S.cupom;if(!c)return 0;const s=sub();if(c.min&&s<c.min)return 0;return fix(c)?Math.min(s,fix(c)):s*pct(c)/100};
const umMsg=()=>{const c=S.cupom;if(!c)return S.um||'';if(c.min&&sub()<c.min)return`Cupom ${S.cn} vale para compras a partir de ${brl(c.min)}.`;return`Cupom ${S.cn} aplicado: ${fix(c)?brl(fix(c)):pct(c)+'%'} de desconto.`};

/* HTML vindo do painel: reconstruído com lista de tags permitidas */
function safeHtml(t){t=String(t||'');if(!/<[a-z][\s\S]*>/i.test(t))return esc(t).replace(/\n/g,'<br>');
const OK=/^(P|B|STRONG|I|EM|U|UL|OL|LI|H3|H4|SPAN|DIV|A)$/,BAD=/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT)$/;
const cl=n=>[...n.childNodes].map(c=>{if(c.nodeType===3)return esc(c.nodeValue);if(c.nodeType!==1)return'';const g=c.tagName;if(BAD.test(g))return'';if(g==='BR')return'<br>';if(!OK.test(g))return cl(c);const tg=g.toLowerCase();let a='';if(g==='A'){const hf=c.getAttribute('href')||'';if(/^(https?:|mailto:|#)/i.test(hf))a=` href="${esc(hf)}" target="_blank" rel="noopener"`}return`<${tg}${a}>${cl(c)}</${tg}>`}).join('');
return cl(new DOMParser().parseFromString(t,'text/html').body)}
const plain=t=>{const d=document.createElement('div');d.innerHTML=safeHtml(t);return d.textContent.replace(/\s+/g,' ').trim()};

/* SEO dinâmico + dados estruturados (a loja é uma página só; a URL do produto é #p-ID) */
const meta=(k,v,prop)=>{const a=prop?'property':'name';let e=document.head.querySelector(`meta[${a}="${k}"]`);if(!e){e=document.createElement('meta');e.setAttribute(a,k);document.head.append(e)}e.setAttribute('content',v||'')};
const abs=u=>{try{return new URL(u,location.href).href}catch(e){return u||''}};
function ld(o){let e=document.getElementById('ld');if(!e){e=document.createElement('script');e.type='application/ld+json';e.id='ld';document.head.append(e)}e.textContent=JSON.stringify(o)}
function seoHome(){if(S.pid)return;const s=D.site,nome=s.nome||'MAUY Fitness',sc=s.seo||{},t=sc.titulo||`${nome} · ${s.frase||'Moda fitness'}`,d=sc.desc||s.rodape||'',img=sc.imagem||(D.banners[0]&&D.banners[0].imagem)||'';
document.title=t;meta('description',d);meta('og:title',t,1);meta('og:description',d,1);meta('og:type','website',1);if(img)meta('og:image',abs(img),1);meta('twitter:card','summary_large_image');
const fv=s.marca&&s.marca.favicon;if(fv){let l=document.querySelector('link[rel=icon]');if(!l){l=document.createElement('link');l.rel='icon';document.head.append(l)}l.href=fv}
ld({'@context':'https://schema.org','@type':'Store',name:nome,url:location.href.split('#')[0],image:img?abs(img):undefined,telephone:'+'+String(s.whatsapp||'').replace(/\D/g,'')})}
function seoProduct(p){const nome=D.site.nome||'MAUY Fitness',t=(p.metaTitle||p.nome)+' · '+nome,d=p.metaDesc||plain(p.descricao).slice(0,155),im=(p.imagens||[]).map(abs);
document.title=t;meta('description',d);meta('og:title',t,1);meta('og:description',d,1);meta('og:type','product',1);if(im[0])meta('og:image',im[0],1);
ld({'@context':'https://schema.org','@type':'Product',name:p.nome,description:d,image:im,sku:p.sku||String(p.id),category:p.categoria,offers:{'@type':'Offer',priceCurrency:'BRL',price:Number(p.preco).toFixed(2),availability:soldOut(p)?'https://schema.org/OutOfStock':'https://schema.org/InStock',url:location.href.split('#')[0]+'#p-'+encodeURIComponent(p.id)}})}

/* barra de anúncios em carrossel (mensagens vêm do painel) */
function promo(){const s=D.site,L=s.avisos&&s.avisos.length?s.avisos:(s.aviso?[s.aviso]:[]),el=$('#promo'),sig=JSON.stringify([L,s.avisoCor,s.avisoIntervalo]);
if(el.dataset.sig===sig)return;el.dataset.sig=sig;clearInterval(TM.promo);el.hidden=!L.length;if(!L.length)return;el.style.background=s.avisoCor||'';
el.setAttribute('role','region');el.setAttribute('aria-label','Avisos da loja');
el.innerHTML=`<div class="pt">${L.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${L.length>1?'<button class="pa p" aria-label="Aviso anterior">‹</button><button class="pa n" aria-label="Próximo aviso">›</button>':''}`;
const t=el.querySelector('.pt');let i=0;const go=k=>{i=(k+L.length)%L.length;t.style.transform=`translateY(-${i*38}px)`};
const run=()=>{clearInterval(TM.promo);if(L.length>1&&!REDUCE)TM.promo=setInterval(()=>go(i+1),+s.avisoIntervalo||5000)};
el.querySelector('.p')?.addEventListener('click',()=>{go(i-1);run()});el.querySelector('.n')?.addEventListener('click',()=>{go(i+1);run()});el.onmouseenter=()=>clearInterval(TM.promo);el.onmouseleave=run;run()}

/* aviso de cookies (LGPD) — texto vem do painel */
function lgpd(){const t=D.site.cookies;if(!t||LS.g('mauy_ck',false))return;const b=document.createElement('div');b.className='lgpd';b.innerHTML=`<p>${esc(t)}</p><button class="btn s">Entendi</button>`;b.querySelector('button').onclick=()=>{LS.s('mauy_ck',true);b.remove()};document.body.append(b)}

/* ---------- carrossel genérico ---------- */
function car(root,key,auto){const t=root.querySelector('.trk'),n=t.children.length;let i=0;clearInterval(TM[key]);
const go=k=>{i=(k+n)%n;t.style.transform=`translateX(-${i*100}%)`;root.querySelectorAll('.dots button').forEach((d,x)=>d.classList.toggle('on',x==i))};
const run=()=>{clearInterval(TM[key]);if(auto&&n>1&&!REDUCE)TM[key]=setInterval(()=>{if(document.contains(root))go(i+1);else clearInterval(TM[key])},auto)};
root.querySelector('.p')?.addEventListener('click',()=>{go(i-1);run()});root.querySelector('.n')?.addEventListener('click',()=>{go(i+1);run()});
root.querySelectorAll('.dots button').forEach((d,x)=>d.onclick=()=>{go(x);run()});
let x0=null;root.addEventListener('pointerdown',e=>x0=e.clientX);root.addEventListener('pointerup',e=>{if(x0!=null&&Math.abs(e.clientX-x0)>45){go(i+(e.clientX<x0?1:-1));run()}x0=null});
go(0);run();if(auto){root.addEventListener('mouseenter',()=>clearInterval(TM[key]));root.addEventListener('mouseleave',run)}root.tabIndex=0;root.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'){go(i-1);run()}if(e.key=='ArrowRight'){go(i+1);run()}})}
const ctl=n=>n>1?`<button class="ar p" aria-label="Anterior">‹</button><button class="ar n" aria-label="Próximo">›</button><div class="dots">${Array.from({length:n},(_,i)=>`<button aria-label="Slide ${i+1}"></button>`).join('')}</div>`:'';

/* ---------- seções da home (vêm de D.layout) ---------- */
let SEC=[];
const LAY=()=>{const raw=(D.layout&&D.layout.length)?D.layout:[{tipo:'banner'},{tipo:'produtos',titulo:'A coleção',quantidade:0}];
return raw.filter(b=>b&&b.ativo!==false).map(b=>({...b,tipo:({destaques:'produtos',lookbook:'galeria'})[b.tipo]||b.tipo}))};
const emb=v=>{v=String(v||'').trim();let m=v.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return `<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;m=v.match(/vimeo\.com\/(\d+)/);if(m)return `<iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy"></iframe>`;return /^(https:|img\/|\.?\/)/.test(v)?`<video src="${esc(v)}" controls playsinline></video>`:''};
const nm=c=>c=='Feminina'?'Moda Feminina':c=='Masculina'?'Moda Masculina':c;

function hero(el,key){const B=D.banners.length?D.banners:[{titulo:'',texto:'',cta:'',imagem:''}];
el.innerHTML=`<div class="car"><div class="trk">${B.map(b=>`<div class="sl${b.imagem?' hi':''}" style="${b.imagem?`--d:url('${url(b.imagem)}');--m:url('${url(b.imagemMobile||b.imagem)}')`:''}"><div class="wrap hc"><p class="ey">MAUY Fitness · Nova coleção</p><h1>${esc(b.titulo)}</h1><p class="t">${esc(b.texto)}</p>${b.cta?`<a class="btn l" href="${esc(b.link||'#loja')}">${esc(b.cta)}</a>`:''}</div></div>`).join('')}</div>${ctl(B.length)}</div>`;
car(el.querySelector('.car'),key,+D.site.intervalo||6000)}

function gal(el,b){const G=(b.fotos||[]).filter(g=>g&&g.img);
el.innerHTML=`<button class="ar p" aria-label="Anterior">‹</button><div class="gs">${G.map(g=>`<figure><div class="ph"><img loading="lazy" src="${esc(g.img)}" alt="${esc(g.legenda)}"></div>${g.legenda?`<figcaption>${esc(g.legenda)}</figcaption>`:''}</figure>`).join('')}</div><button class="ar n" aria-label="Próximo">›</button>`;
const s=el.querySelector('.gs');el.querySelector('.p').onclick=()=>s.scrollBy({left:-s.clientWidth*.8,behavior:'smooth'});el.querySelector('.n').onclick=()=>s.scrollBy({left:s.clientWidth*.8,behavior:'smooth'})}

function secs(){SEC=LAY();let first=true;
$('#secs').innerHTML=SEC.map((b,i)=>{const H=b.titulo?`<h2>${esc(b.titulo)}</h2>`:'',ln=String(b.conteudo||'').split('\n').map(x=>x.trim()).filter(Boolean);
switch(b.tipo){
case 'banner':return `<section data-s="${i}"></section>`;
case 'galeria':return (b.fotos||[]).some(f=>f&&f.img)?`<section class="wrap sec" data-s="${i}">${H}<div class="gal"></div></section>`:'';
case 'produtos':{const id=first?' id="loja"':'';first=false;return `<section class="wrap sec"${id} data-pb="${i}">${H}<div class="fl"></div><div class="grid"></div></section>`}
case 'beneficios':return `<div class="ben"><div class="wrap">${ln.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`;
case 'bannerDuplo':return `<section class="wrap sec">${H}<div class="duo">${[1,2].map(n=>b['imagem'+n]?`<a class="dv" href="${esc(b['link'+n]||'#loja')}" style="background-image:url('${url(b['imagem'+n])}')">${esc(b['titulo'+n]||'')}</a>`:'').join('')}</div></section>`;
case 'video':{const v=emb(b.conteudo);return v?`<section class="wrap sec">${H}<div class="vid">${v}</div></section>`:''}
case 'depoimentos':return ln.length?`<section class="wrap sec">${H}<div class="dep">${ln.map(x=>{const[n,...t]=x.split('|');return `<div><p>“${esc(t.length?t.join('|'):n)}”</p><b>${t.length?esc(n):''}</b></div>`}).join('')}</div></section>`:'';
default:return ''}}).join('');
SEC.forEach((b,i)=>{const el=document.querySelector(`[data-s="${i}"]`);if(!el)return;if(b.tipo=='banner')hero(el,'hero'+i);if(b.tipo=='galeria')gal(el.querySelector('.gal'),b)})}

function head(){const s=D.site;promo();$('#fr').textContent=s.frase||'';$('#ft').textContent=s.rodape||'';$('#wl').href='https://wa.me/'+String(s.whatsapp).replace(/\D/g,'');const m=s.marca||{},root=document.documentElement;if(m.cor1){root.style.setProperty('--wine',m.cor1);root.style.setProperty('--ti',m.cor1)}if(m.cor2)root.style.setProperty('--nude',m.cor2);if(m.logoClaro){document.querySelectorAll('.logo img.lg-l,footer .fi img').forEach(i=>i.src=m.logoClaro)}if(m.logoEscuro)document.querySelectorAll('.logo img.lg-d').forEach(i=>i.src=m.logoEscuro);

/* produto: galeria com zoom, cor/tamanho com estoque, quantidade, frete, provador de tamanho */
function openP(id){const p=D.produtos.find(x=>x.id==id);if(!p)return;Object.assign(S,{pid:p.id,sz:null,col:null,qty:1,tab:0,ci:0});prodView();$('#md').classList.add('on');$('#sh').classList.add('on');seoProduct(p);try{history.replaceState(null,'','#p-'+encodeURIComponent(p.id))}catch(e){}}
function parseMed(t){return String(t||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=2&&a[0]).map(a=>({t:a[0],raw:a.slice(1,4),v:a.slice(1,4).map(x=>{const m=String(x).replace(/,/g,'.').match(/(\d+(?:\.\d+)?)(?:\s*[-–a]\s*(\d+(?:\.\d+)?))?/);return m?[+m[1],+(m[2]||m[1])]:null})}))}
function sugerir(p,m){const R=parseMed(D.site.medidas);let idx=-1,acima=false;
m.forEach((val,k)=>{if(!val)return;let j=R.findIndex(r=>r.v[k]&&val<=r.v[k][1]);if(j<0){acima=true;j=R.length-1}idx=Math.max(idx,j)});
if(idx<0||!R.length)return null;const off=(p.tamanhos||[]).map(String);let pick=R[idx].t,note='';
if(off.length&&!off.includes(pick)){const alt=R.slice(idx).concat(R.slice(0,idx).reverse()).find(r=>off.includes(r.t));note=alt?` Esta peça não tem o ${esc(pick)}; o mais próximo é o ${esc(alt.t)}.`:'';pick=alt?alt.t:pick}
return{pick,acima,note,ok:!off.length||off.includes(pick)}}
function medidasHtml(p){const R=parseMed(D.site.medidas),m=S.med||[];const gd=String(p.guia||'').trim();
if(!R.length)return gd?`<div class="dsc">${safeHtml(gd)}</div>`:'<p>Consulte a tabela de medidas com o atendimento pelo WhatsApp antes de escolher o tamanho.</p>';
const inp=(i,l)=>`<label>${l}<input id="m${i+1}" inputmode="numeric" maxlength="3" placeholder="cm" value="${esc(m[i]||'')}"></label>`;
return`<p style="font-size:12px;opacity:.8">Provador de tamanho: informe suas medidas em centímetros e indicamos o tamanho ideal.</p><div class="adv">${inp(0,'Busto')}${inp(1,'Cintura')}${inp(2,'Quadril')}</div><button class="btn g s" data-adv>Descobrir meu tamanho</button><div id="advr" class="advr" aria-live="polite"></div><table class="mt"><thead><tr><th>Tam.</th><th>Busto</th><th>Cintura</th><th>Quadril</th></tr></thead><tbody>${R.map(r=>`<tr><td><b>${esc(r.t)}</b></td>${[0,1,2].map(k=>`<td>${esc(r.raw[k]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>${gd?`<div class="dsc" style="margin-top:10px">${safeHtml(gd)}</div>`:''}`}
function prodView(){const p=D.produtos.find(x=>x.id==S.pid);if(!p)return;const sc=$('#mb').scrollTop;
const cs=cores(p),im=p.imagens||[],vid=p.video?emb(p.video):'',T=['Descrição','Guia de medidas','Trocas'],tam=p.tamanhos&&p.tamanhos.length?p.tamanhos:['Único'];
if(cs.length&&!cs.some(c=>c.nome===S.col))S.col=cs[0].nome;if(!cs.length)S.col=null;
const ck=S.col||'Único',free=t=>stockOf(p,ck,t);if(S.sz&&free(S.sz)<=0)S.sz=null;
const av=S.sz?free(S.sz):null,out=soldOut(p),lim=S.sz&&isFinite(av)?av:99;if(S.qty>lim)S.qty=Math.max(1,lim);
const n=im.length+(vid?1:0),ci=Math.min(S.ci,Math.max(0,n-1));S.ci=ci;const onVid=!!vid&&ci>=im.length;
const gal=`<div class="gv"><div class="gm${onVid?' vd':''}" data-gm>${ci<im.length?`<img src="${esc(im[ci])}" alt="${esc(p.nome)}">`:(vid||'<div class="ph ne"></div>')}${n>1&&!onVid?'<button class="ar p" data-gp aria-label="Foto anterior">‹</button><button class="ar n" data-gn aria-label="Próxima foto">›</button>':''}${n>1?`<span class="gn">${ci+1}/${n}</span>`:''}${badge(p)}</div>${n>1?`<div class="gt">${im.map((u,k)=>`<button data-gi="${k}" class="${k==ci?'on':''}" aria-label="Foto ${k+1}"><img src="${esc(u)}" alt=""></button>`).join('')}${vid?`<button data-gi="${im.length}" class="vb${onVid?' on':''}" aria-label="Ver vídeo">▶</button>`:''}</div>`:''}</div>`;
const pc=Math.max(1,+D.site.parcelas||3),pr=`<div class="pr" style="font-size:20px;margin-top:4px">${p.precoAntigo>p.preco?`<span class="old">${brl(p.precoAntigo)}</span>`:''}${brl(p.preco)}${p.precoAntigo>p.preco?`<span class="off">-${Math.round((1-p.preco/p.precoAntigo)*100)}%</span>`:''}</div><p style="font-size:12px;opacity:.75">${brl(p.preco*(1-(+D.site.pix||0)/100))} no Pix · ${pc}x de ${brl(p.preco/pc)} sem juros</p>`;
const hex=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#ccc';
const cl=cs.length?`<p class="lb">Cor: <b>${esc(S.col)}</b></p><div class="sw">${cs.map(c=>`<button data-col="${esc(c.nome)}" title="${esc(c.nome)}" aria-label="Cor ${esc(c.nome)}" class="${c.nome===S.col?'on':''}${stockOf(p,c.nome,null)<=0?' so':''}" style="background:${esc(hex(c.hex))}"></button>`).join('')}</div>`:'';
const sz=`<p class="lb">Tamanho${S.sz?`: <b>${esc(S.sz)}</b>`:''}</p><div class="pl">${tam.map(t=>`<button data-z="${esc(t)}" class="${t==S.sz?'on':''}"${free(t)<=0?' disabled':''}>${esc(t)}</button>`).join('')}</div>`;
const note=out?'<p class="stk lo">Produto esgotado no momento.</p>':(S.sz&&isFinite(av)&&av<=(+p.estoqueMinimo||3)?`<p class="stk lo">Últimas unidades: restam ${av}.</p>`:'');
const wa=`https://wa.me/${String(D.site.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent('Olá! Quero ser avisada quando '+p.nome+' voltar ao estoque.')}`;
const act=out?`<a class="btn" style="display:block;text-align:center" href="${wa}" target="_blank" rel="noopener">Avise-me quando chegar</a>`:`<div class="ac"><div class="qt"><button data-qd="-1" aria-label="Diminuir quantidade">−</button><span>${S.qty}</span><button data-qd="1" aria-label="Aumentar quantidade">+</button></div><button class="btn" data-add>${S.sz?'Adicionar à sacola · '+brl(p.preco*S.qty):'Escolha um tamanho'}</button></div>`;
const frt=`<div class="mf"><p class="lb">Calcule o frete</p><div class="rw"><input id="mcep" placeholder="CEP (00000-000)" inputmode="numeric" maxlength="9" value="${esc(S.cep||'')}"><button class="btn g s" data-mcep>Calcular</button></div><div class="ms" id="mcm">${esc(S.cm||'')}</div></div>`;
const tc=[`<div class="dsc">${safeHtml(p.descricao)}${p.tecido?`<p><b>Tecido:</b> ${esc(p.tecido)}</p>`:''}</div>`,medidasHtml(p),`<div class="dsc">${D.site.trocas?safeHtml(D.site.trocas):'<p>Troca garantida em até 7 dias após o recebimento, com a peça sem uso e com etiqueta.</p>'}</div>`];
const rel=prods().filter(x=>x.id!=p.id&&x.categoria===p.categoria).slice(0,4);
const rl=rel.length?`<div class="full"><p class="lb">Combine com</p><div class="rel">${rel.map(x=>`<button data-rel="${esc(x.id)}">${photo(x)}<span>${esc(x.nome)}</span><b>${brl(x.preco)}</b></button>`).join('')}</div></div>`:'';
$('#mb').innerHTML=`<button class="x" data-close aria-label="Fechar">×</button>${gal}<div><p class="ey" style="color:var(--wine)">${esc(p.categoria)}</p><h2>${esc(p.nome)}</h2>${pr}${cl}${sz}${note}${act}<div class="shr"><button data-share>↗ Compartilhar este produto</button></div>${frt}<div class="tabs">${T.map((t,i)=>`<button data-t="${i}" class="${i==S.tab?'on':''}">${t}</button>`).join('')}</div><div class="tc">${tc[S.tab]}</div></div>${rl}`;
$('#mb').scrollTop=sc}
function share(p){const u=location.href.split('#')[0]+'#p-'+encodeURIComponent(p.id);if(navigator.share)navigator.share({title:p.nome,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Link copiado!'),()=>toast(u));else toast(u)}
let swT=0,gx=null;
$('#mb').addEventListener('pointerdown',e=>{gx=e.target.closest('[data-gm]')&&!e.target.closest('button')?e.clientX:null});
$('#mb').addEventListener('pointerup',e=>{if(gx==null)return;const dx=e.clientX-gx;gx=null;if(Math.abs(dx)>45){swT=Date.now();$('#mb').querySelector(dx<0?'[data-gn]':'[data-gp]')?.click()}});
$('#mb').addEventListener('mousemove',e=>{const g=e.target.closest('.gm.z');if(!g)return;const r=g.getBoundingClientRect();g.querySelector('img').style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`});
$('#mb').addEventListener('input',e=>{if(e.target.id=='mcep'){let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v}});
$('#mb').onclick=e=>{const t=e.target.closest('button');
if(!t){const g=e.target.closest('[data-gm]');if(g&&!g.classList.contains('vd')&&Date.now()-swT>350)g.classList.toggle('z');return}
const p=D.produtos.find(x=>x.id==S.pid);if(!p)return;const d=t.dataset;
if('close' in d)return shut();if(t.disabled)return;
if(d.z){S.sz=d.z;S.qty=1}
else if(d.col){S.col=d.col;S.qty=1}
else if(d.gi!==undefined)S.ci=+d.gi;
else if('gp' in d||'gn' in d){const n=(p.imagens||[]).length+(p.video&&emb(p.video)?1:0);S.ci=(S.ci+('gn' in d?1:-1)+n)%n}
else if(d.qd){const lim=S.sz?stockOf(p,S.col||'Único',S.sz):99;S.qty=Math.min(Math.max(1,S.qty+ +d.qd),isFinite(lim)?lim:99)}
else if(d.t)S.tab=+d.t;
else if('share' in d)return share(p);
else if(d.rel)return openP(d.rel);
else if('mcep' in d){calcFrete($('#mcep').value);$('#mcm').textContent=S.cm;return cart()}
else if('adv' in d){S.med=[1,2,3].map(i=>+String($('#m'+i).value).replace(',','.')||0);const r=sugerir(p,S.med),o=$('#advr');
 o.innerHTML=!r?'Informe ao menos uma medida.':`Tamanho indicado: <b>${esc(r.pick)}</b>.${r.note}${r.acima?' Suas medidas passam da nossa tabela; fale com a gente no WhatsApp.':''}<br><small>Entre dois tamanhos? Prefira o maior para mais conforto.</small>${r.ok?`<br><button class="btn s" data-use="${esc(r.pick)}">Usar tamanho ${esc(r.pick)}</button>`:''}`;return}
else if(d.use){S.sz=d.use;S.qty=1;S.tab=0}
else if('add' in d){if(!S.sz)return toast('Escolha um tamanho.');const lim=stockOf(p,S.col||'Único',S.sz),f=S.cart.find(i=>i.id==p.id&&i.size==S.sz&&(i.col||null)==(S.col||null)),have=f?f.qty:0,k=Math.min(S.qty,lim-have);
 if(k<=0)return toast('Você já tem todo o estoque desta variação na sacola.');if(k<S.qty)toast(`Adicionamos as ${k} últimas unidades disponíveis.`);
 f?f.qty+=k:S.cart.push({id:p.id,size:S.sz,col:S.col,qty:k});keep();cart();shut();return openCart()}
else return;
prodView()};

/* sacola */
const lines=()=>S.cart.map((i,x)=>({...i,x,p:D.produtos.find(y=>y.id==i.id)})).filter(i=>i.p);
const sub=()=>lines().reduce((s,i)=>s+i.p.preco*i.qty,0);
function cart(){clampCart();const L=lines(),s=sub(),q=L.reduce((n,i)=>n+i.qty,0),free=+D.site.gratis||0;$('#cc').textContent=q;
$('#it').innerHTML=L.length?L.map((i,x)=>`<div class="ln">${photo(i.p)}<div><strong style="font-weight:500">${esc(i.p.nome)}</strong><br><span style="opacity:.7">Tam. ${esc(i.size)}${i.col&&i.col!=='Único'?' · '+esc(i.col):''}</span><br><span class="q"><button data-q="${i.x}" data-d="-1" aria-label="Diminuir">−</button>${i.qty}<button data-q="${i.x}" data-d="1" aria-label="Aumentar">+</button></span></div><div>${brl(i.p.preco*i.qty)}</div></div>`).join(''):'<p class="empty" style="padding:30px 0">Sua sacola está vazia.</p>';
const d=disc(),fr=S.frete==null?null:(s>=free?0:S.frete),tot=s-d+(fr||0);
$('#cf').innerHTML=`<div style="font-size:12px">${s==0?`Frete grátis acima de ${brl(free)}`:s>=free?'Você ganhou frete grátis':`Faltam ${brl(free-s)} para o frete grátis`}</div><div class="bar"><i style="width:${Math.min(100,free?s/free*100:0)}%"></i></div>
<div class="rw"><input id="cep" placeholder="CEP (00000-000)" inputmode="numeric" maxlength="9" value="${esc(S.cep||'')}"><button class="btn g s" id="cepb">Calcular</button></div><div class="ms">${esc(S.cm||'')}</div>
<div class="rw"><input id="cup" placeholder="Cupom de desconto" value="${esc(S.cn||'')}"><button class="btn g s" id="cupb">Aplicar</button></div><div class="ms">${esc(umMsg())}</div>
<div class="sm" style="margin-top:8px"><div><span>Subtotal</span><span>${brl(s)}</span></div>${d?`<div><span>Cupom</span><span>− ${brl(d)}</span></div>`:''}<div><span>Frete</span><span>${fr==null?'a calcular':fr==0?'Grátis':brl(fr)}</span></div><div class="t"><span>Total</span><span>${brl(tot)}</span></div></div>
<div class="pix"><b>Pix: ${brl(tot*(1-D.site.pix/100))}</b><br>${D.site.pix}% de desconto no pagamento à vista.</div><button class="btn" style="width:100%" id="co">Finalizar pedido via WhatsApp</button>`}
$('#it').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const i=S.cart[+b.dataset.q];if(!i)return;const p=D.produtos.find(x=>x.id==i.id),d=+b.dataset.d;if(d>0&&p){const lim=stockOf(p,i.col??null,i.size);if(i.qty>=lim)return toast(`Estoque disponível: ${lim} un.`)}i.qty+=d;if(i.qty<1)S.cart.splice(+b.dataset.q,1);keep();cart()};
$('#cf').onclick=e=>{const id=e.target.id;
if(id=='cepb'){calcFrete($('#cep').value);cart()}
if(id=='cupb'){const v=$('#cup').value.trim().toUpperCase(),c=D.site.cupons.find(x=>String(x.c).toUpperCase()==v);S.cn=v;S.cupom=null;S.um='';
if(!c)S.um='Cupom inválido. Confira o código.';else if(c.val&&new Date(c.val+'T23:59:59')<new Date())S.um='Este cupom expirou.';else S.cupom=c;cart()}
if(id=='co'){const L=lines();if(!L.length)return;const s=sub(),free=+D.site.gratis||0,d=disc(),fr=S.frete==null?null:(s>=free?0:S.frete),tot=s-d+(fr||0),pixTot=tot*(1-(+D.site.pix||0)/100);const m=['Olá, MAUY! Quero finalizar meu pedido:','',...L.map(i=>`• ${i.p.nome} | Tam. ${i.size}${i.col&&i.col!=='Único'?' | Cor '+i.col:''} | Qtd. ${i.qty} — ${brl(i.p.preco*i.qty)}`),'',`Subtotal: ${brl(s)}`];if(d)m.push(`Cupom (${S.cn}): − ${brl(d)}`);if(S.cep)m.push(`CEP: ${S.cep}`);m.push(`Frete: ${fr==null?'A calcular':fr==0?'Grátis':brl(fr)}`);m.push(`*Total: ${brl(tot)}*`);if(+D.site.pix>0)m.push(`Total no Pix (${D.site.pix}% off): *${brl(pixTot)}*`);open('https://wa.me/'+String(D.site.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(m.join('\n')),'_blank','noopener')}};
$('#cf').oninput=e=>{if(e.target.id=='cep'){let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v}};
const openCart=()=>{$('#dr').classList.add('on');$('#sh').classList.add('on')};
function shut(){['dr','md','sh'].forEach(i=>$('#'+i).classList.remove('on'));if(S.pid){S.pid=null;seoHome();try{if(/^#p-/.test(location.hash))history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
$('#cb').onclick=openCart;$('#cx').onclick=shut;$('#sh').onclick=shut;document.addEventListener('keydown',e=>{if(e.key=='Escape')shut()});

/* ---------- armazenamento local (rascunho de pré-visualização) ---------- */
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Armazenamento cheio. Use imagens menores ou links de imagem.');return false}}};

function route(first){const m=location.hash.match(/^#p-(.+)$/);if(first)store();if(m){let id;try{id=decodeURIComponent(m[1])}catch(e){id=m[1]}if(D.produtos.find(x=>x.id==id)&&S.pid!=id)openP(id)}else if(S.pid)shut()}

(async()=>{try{const r=await fetch('dados.json?'+Date.now(),{cache:'no-store'});if(r.ok)D=await r.json()}catch(e){}
const draft=LS.g('mauy_draft',null);if(draft){D=draft;toast('Visualizando rascunho local (não publicado)')}
D.site=D.site||{};D.site.cupons=D.site.cupons||[];D.banners=D.banners||[];D.galeria=D.galeria||[];D.produtos=(D.produtos||[]).map(p=>({...p,imagens:p.imagens||(p.imagem?[p.imagem]:[]),tamanhos:p.tamanhos?.length?p.tamanhos:['Único']}));
lgpd();route(true)})();
